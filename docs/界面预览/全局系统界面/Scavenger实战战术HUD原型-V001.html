<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scavenger 实战 680p 极简战术 HUD 原型 · V001（阶段 4C）</title>
<style>
/* ==========================================================================
   Scavenger 阶段 4C · 实战 680p 极简战术 HUD 交互原型（V001）
   设计系统：A3 烟炭双金融合 × B2 战术微描边精工 × C4 外柔内锐 (12px / 5px)
   渲染基线：stylized-680p-v1（底层 3D 锁定 680p 垂直高度 + 复古暖滤镜；UI 原生高清）
   性能红线：常驻 HUD 严禁 backdrop-filter，统一高透暗实底 --ui-bg-pod 保 60FPS
   表单红线：100% 定制战术下拉 .ui-select（自动向上弹出）与 .ui-check，零原生 <select>
   ========================================================================== */
:root {
  --ui-bg-canvas: #0d0e13;
  --ui-bg-pod: rgba(19, 20, 28, 0.92);
  --ui-bg-pod-elevated: #14151e;
  --ui-bg-overlay-glass: linear-gradient(150deg, rgba(24, 25, 36, 0.90) 0%, rgba(16, 17, 25, 0.94) 56%, rgba(30, 25, 19, 0.92) 100%);
  --ui-bg-slot: rgba(35, 37, 48, 0.88);
  --ui-line-subtle: rgba(255, 255, 255, 0.09);
  --ui-line-base: rgba(255, 255, 255, 0.19);
  --ui-line-strong: rgba(255, 255, 255, 0.34);

  --ui-text-primary: #f5f6f9;
  --ui-text-secondary: #b6bac5;
  --ui-text-muted: #838896;
  --ui-text-inverse: #0d0e13;
  --ui-stroke-halo: rgba(9, 10, 15, 0.96);

  --ui-ch-ground: #38e5c0;
  --ui-ch-ground-inner: #9bf5e0;
  --ui-ch-ground-fill: rgba(56, 229, 192, 0.15);
  --ui-ch-heli: #68c8ff;
  --ui-ch-heli-inner: #bae4ff;
  --ui-ch-heli-fill: rgba(104, 200, 255, 0.15);
  --ui-ch-plane: #b197fc;
  --ui-ch-plane-inner: #dcd0ff;
  --ui-ch-plane-fill: rgba(177, 151, 252, 0.15);

  --ui-state-select: #f0d372;
  --ui-state-select-inner: #f6de86;
  --ui-state-select-fill: rgba(240, 211, 114, 0.16);
  --ui-state-warn: #ffb800;
  --ui-state-danger: #ff5266;
  --ui-state-toxic: #a8f22c;
  --ui-state-safe: #3cd69f;

  --ui-accent-grad: linear-gradient(135deg, #f6de86 0%, #e5b73e 100%);
  --ui-rim-top: inset 0 1px 0 rgba(255, 255, 255, 0.09);
  --ui-shadow-pod: 0 12px 30px rgba(0, 0, 0, 0.52);

  --ui-r-surface: 12px;
  --ui-r-control: 5px;
  --ui-r-sm: 4px;
  --ui-r-pill: 9999px;

  --ui-dur-micro: 100ms;
  --ui-dur-standard: 200ms;
  --ui-ease-out: cubic-bezier(0.22, 1, 0.36, 1);

  --ui-z-world: 100;
  --ui-z-hud: 200;
  --ui-z-drawer: 300;
  --ui-z-overlay: 400;
  --ui-z-system: 500;

  --ui-font-display: "Bahnschrift", "DIN Alternate", "Microsoft YaHei UI", sans-serif;
  --ui-font-sans: "Microsoft YaHei UI", "PingFang SC", "Segoe UI", sans-serif;
  --ui-font-mono: "JetBrains Mono", "Cascadia Mono", "Consolas", monospace;
}

*, *::before, *::after { box-sizing: border-box; }
html, body {
  margin: 0; height: 100%; overflow: hidden;
  background: #06070a; color: var(--ui-text-primary);
  font-family: var(--ui-font-sans); font-size: 12.5px; line-height: 1.4;
  -webkit-font-smoothing: antialiased; user-select: none;
}
.mono { font-family: var(--ui-font-mono); font-variant-numeric: tabular-nums; }
.display-font { font-family: var(--ui-font-display); letter-spacing: 0.03em; }
button, input { font-family: inherit; }
[hidden] { display: none !important; }

/* ====== 外壳视口（支持全屏 / 16:9 1208×680 / 21:9 1588×680） ====== */
.viewport-host {
  width: 100vw; height: 100vh; display: grid; place-items: center;
  background: radial-gradient(circle at 50% 45%, #141720 0%, #050609 85%);
}
.hud-stage {
  position: relative; width: 100%; height: 100%; overflow: hidden;
  background: var(--ui-bg-canvas);
  transition: width 260ms var(--ui-ease-out), height 260ms var(--ui-ease-out);
}
.hud-stage[data-aspect="16:9"] {
  width: min(1208px, calc(100vw - 24px), calc((100vh - 24px) * 16 / 9));
  height: auto;
  aspect-ratio: 16 / 9;
  border-radius: 10px; border: 1px solid rgba(240, 211, 114, 0.36);
  box-shadow: 0 28px 80px rgba(0, 0, 0, 0.84);
}
.hud-stage[data-aspect="21:9"] {
  width: min(1588px, calc(100vw - 20px), calc((100vh - 24px) * 21 / 9));
  height: auto;
  aspect-ratio: 21 / 9;
  border-radius: 10px; border: 1px solid rgba(56, 229, 192, 0.38);
  box-shadow: 0 28px 80px rgba(0, 0, 0, 0.84);
}

/* ====== Z-100 双层分离战场（底层 680p 暖滤镜 + 上层原生 DPR 标绘） ====== */
.world-3d-canvas {
  position: absolute; inset: 0; width: 100%; height: 100%; z-index: 10;
  image-rendering: pixelated;
  filter: contrast(1.08) saturate(1.10) sepia(0.06);
}
.world-ring-svg, .world-overlay-canvas, .world-ui-layer {
  position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none;
}
.world-ring-svg { z-index: 95; }
.world-overlay-canvas { z-index: 100; }
.world-ui-layer { z-index: 110; overflow: hidden; }
.drag-select-box {
  position: absolute; z-index: 115; pointer-events: none;
  border: 1.5px solid var(--ui-state-select); background: rgba(240, 211, 114, 0.12);
  border-radius: 2px;
}

/* 车底去框透视名牌与紧凑降级点（0px 锚点固定） */
.ground-mark {
  position: absolute; top: 0; left: 0; pointer-events: auto; cursor: pointer;
  display: inline-flex; align-items: center; gap: 5px;
  padding: 2px 6px; border-radius: 4px;
  background: rgba(11, 12, 18, 0.72);
  border: 1px solid rgba(255, 255, 255, 0.12);
  color: var(--ui-text-primary); font-size: 11px; font-weight: 700; white-space: nowrap;
  text-shadow: 0 1px 4px #000000;
  transition: opacity 120ms, border-color 100ms, background 100ms;
}
.ground-mark.kind-mbt, .ground-mark.kind-ifv, .ground-mark.kind-supply { color: var(--ui-ch-ground-inner); }
.ground-mark.kind-attack_heli, .ground-mark.kind-trans_heli { color: var(--ui-ch-heli-inner); }
.ground-mark.kind-cas { color: var(--ui-ch-plane-inner); }
.ground-mark.is-selected {
  background: rgba(240, 211, 114, 0.18); border-color: var(--ui-state-select);
  color: var(--ui-state-select-inner); z-index: 5;
}
.ground-mark.is-hovered { border-color: #ffffff; z-index: 6; }
.ground-mark.is-compact { padding: 2px 4px; gap: 0; border-radius: 999px; }
.ground-mark.is-compact .mark-name, .ground-mark.is-compact .mark-sub { display: none; }
.ground-mark.is-dimmed { opacity: 0.42; }
.mark-sub { font-family: var(--ui-font-mono); font-size: 10px; color: var(--ui-text-secondary); font-weight: 500; }

/* ====== Z-200 战斗常驻 HUD 安全区外框（严禁 backdrop-filter） ====== */
.hud-layer {
  position: absolute; inset: 0; z-index: var(--ui-z-hud);
  pointer-events: none; padding: 10px 14px;
  display: flex; flex-direction: column; justify-content: space-between;
}
/* 21:9 Hor+ 横向安全收束 */
.hud-stage[data-aspect="21:9"] .hud-layer-clamp {
  width: 100%; max-width: 1280px; margin: 0 auto; height: 100%;
  display: flex; flex-direction: column; justify-content: space-between;
}
.hud-layer-clamp {
  width: 100%; height: 100%;
  display: flex; flex-direction: column; justify-content: space-between; gap: 8px;
}
.hud-layer.is-hidden-hud { opacity: 0; visibility: hidden; }

/* 高透暗实底战斗舱体（零毛玻璃保 60FPS） */
.hud-pod {
  pointer-events: auto;
  background: var(--ui-bg-pod);
  border: 1px solid var(--ui-line-base);
  border-radius: var(--ui-r-surface);
  box-shadow: var(--ui-rim-top), var(--ui-shadow-pod);
  backdrop-filter: none !important;
}

/* B2 按钮与 L1 无底框硬黑外描边提示 */
.ui-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 5px;
  height: 28px; padding: 0 9px; border-radius: var(--ui-r-sm);
  border: 1px solid var(--ui-line-base); background: var(--ui-bg-slot); color: var(--ui-text-primary);
  font-size: 11px; font-weight: 700; cursor: pointer; white-space: nowrap;
  transition: border-color var(--ui-dur-micro), color var(--ui-dur-micro), background var(--ui-dur-micro);
}
.ui-btn:hover:not(:disabled) { border-color: var(--ui-state-select); color: var(--ui-state-select); background: rgba(255,255,255,0.08); }
.ui-btn--danger { background: rgba(255,82,102,0.16); border-color: rgba(255,82,102,0.42); color: var(--ui-state-danger); }
.ui-btn--danger:hover:not(:disabled) { background: var(--ui-state-danger); color: #ffffff; border-color: transparent; }
.ui-btn--primary { background: var(--ui-accent-grad); color: var(--ui-text-inverse); border-color: transparent; }

.ui-keycap {
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 19px; height: 18px; padding: 0 5px; border-radius: var(--ui-r-pill);
  background: #ffffff; color: #090a0f; border: 2px solid #090a0f;
  font-family: var(--ui-font-mono); font-size: 9.5px; font-weight: 900; line-height: 1;
  -webkit-text-stroke: 0 !important; text-shadow: none !important;
}
.ui-keycap--dark { background: rgba(13,14,19,0.92); color: #f5f6f9; border-color: rgba(255,255,255,0.28); }
.ui-prompt-btn {
  pointer-events: auto; display: inline-flex; align-items: center; gap: 5px;
  padding: 2px 3px; border: none; background: transparent; cursor: pointer;
}
.ui-outlined-text {
  color: #ffffff; font-size: 11.5px; font-weight: 800;
  paint-order: stroke fill; -webkit-text-stroke: 3.4px #090a0f;
  text-shadow: 0 2px 6px rgba(0,0,0,0.88);
}

/* 顶部极简态势条（严禁任意子项折行与黑字，占顶边 ~40px） */
.hud-top-bar {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  flex: 0 0 auto; white-space: nowrap;
}
.zone-strip {
  display: flex; align-items: center; gap: 5px; padding: 4px 6px; flex: 0 0 auto;
}
.zone-pill {
  position: relative; display: inline-flex; align-items: center; gap: 6px;
  padding: 4px 8px; border-radius: var(--ui-r-control);
  background: rgba(11, 12, 18, 0.88); border: 1px solid var(--ui-line-subtle);
  color: var(--ui-text-primary); white-space: nowrap; flex: 0 0 auto;
  cursor: pointer; transition: border-color 100ms;
}
.zone-pill:hover { border-color: var(--ui-line-strong); }
.zone-pill i.z-dot { width: 7px; height: 7px; border-radius: 50%; flex: 0 0 auto; }
.zone-pill strong { font-size: 11px; font-weight: 800; color: var(--ui-text-primary); white-space: nowrap; }
.zone-pill span.z-meta { font-family: var(--ui-font-mono); font-size: 10px; color: var(--ui-text-secondary); white-space: nowrap; }
.zone-cap-bar {
  width: 28px; height: 4px; border-radius: 99px; background: rgba(255,255,255,0.14); overflow: hidden; flex: 0 0 auto;
}
.zone-cap-bar > i { display: block; height: 100%; transition: width 260ms var(--ui-ease-out); }

.top-telemetry {
  display: flex; align-items: center; gap: 8px; padding: 5px 10px; flex: 0 0 auto; white-space: nowrap;
}
.tele-item { display: inline-flex; align-items: baseline; gap: 4px; font-size: 11px; color: var(--ui-text-secondary); white-space: nowrap; }
.tele-item b { font-family: var(--ui-font-mono); font-size: 11.5px; color: var(--ui-text-primary); white-space: nowrap; }
.tele-sep { width: 1px; height: 12px; background: var(--ui-line-subtle); flex: 0 0 auto; }
.top-actions { display: flex; align-items: center; gap: 5px; pointer-events: auto; flex: 0 0 auto; }

/* 中下区域容器（左栏编队＋小地图 / 中空战场 / 底中指令舱 / 右下镜头+L1） */
.hud-mid-row {
  flex: 1; min-height: 0; position: relative;
  display: flex; align-items: flex-end; justify-content: space-between; gap: 12px;
}

/* 左栏：上编队微卡 ＋ 下微缩雷达（严格控制在 x <= 228px，绝不侵入中央 60% 与互相重叠） */
.hud-left-col {
  width: 218px; height: 100%; flex: 0 0 auto;
  display: flex; flex-direction: column; justify-content: space-between; gap: 8px;
}
.squad-dock {
  padding: 7px; display: flex; flex-direction: column; gap: 5px;
  max-height: calc(100% - 124px); overflow: hidden;
}
.ui-seg {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px;
  padding: 2px; border-radius: var(--ui-r-control); background: rgba(10,11,16,0.86);
  border: 1px solid var(--ui-line-subtle);
}
.ui-seg button {
  height: 22px; border: none; border-radius: 3px; background: transparent;
  color: var(--ui-text-muted); font-size: 10.5px; font-weight: 700; cursor: pointer;
}
.ui-seg button.active { background: var(--ui-state-select-fill); color: var(--ui-state-select); }

.squad-list {
  display: flex; flex-direction: column; gap: 4px; overflow-y: auto;
  scrollbar-width: none;
}
.squad-list::-webkit-scrollbar { display: none; }
.sq-card {
  position: relative; padding: 5px 7px; border-radius: var(--ui-r-sm);
  background: rgba(26, 28, 38, 0.88); border: 1px solid var(--ui-line-subtle);
  border-left: 3px solid var(--sq-ch, var(--ui-ch-ground));
  cursor: pointer; display: flex; flex-direction: column; gap: 3px;
  transition: border-color 100ms, background 100ms;
}
.sq-card:hover { background: rgba(42, 45, 58, 0.92); }
.sq-card.is-selected {
  border-color: var(--ui-state-select); border-left-color: var(--sq-ch);
  background: rgba(240, 211, 114, 0.11);
}
@keyframes alert-pulse {
  0%, 100% { box-shadow: 0 0 0 1px var(--ui-state-danger); border-color: var(--ui-state-danger); }
  50% { box-shadow: 0 0 12px 1px rgba(255, 82, 102, 0.48); border-color: #ff8c9a; }
}
.sq-card.is-critical { animation: alert-pulse 0.9s ease-in-out infinite; }
.sq-head { display: flex; align-items: center; justify-content: space-between; gap: 5px; }
.sq-name { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 800; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sq-meta { display: flex; align-items: center; justify-content: space-between; font-size: 9.5px; color: var(--ui-text-muted); }

/* 延迟掉血白条（Squad Card + 底舱共用） */
.hp-track {
  position: relative; height: 5px; border-radius: 3px;
  background: rgba(8, 9, 14, 0.94); border: 1px solid #07080c; overflow: hidden;
}
.hp-track--lg { height: 10px; border-radius: var(--ui-r-sm); }
.hp-trail {
  position: absolute; left: 0; top: 0; bottom: 0; background: #ffffff; opacity: 0.88;
  transition: width 0.48s var(--ui-ease-out) 0.16s;
}
.hp-fill {
  position: absolute; left: 0; top: 0; bottom: 0;
  transition: width 0.14s var(--ui-ease-out), background 0.18s;
}
.hp-bonus {
  position: absolute; top: 0; bottom: 0; background: #68c8ff;
  border-left: 1.5px solid #ffffff; transition: left 0.14s, width 0.2s;
}
.hp-track.is-critical { animation: alert-pulse 0.85s ease-in-out infinite; }

/* 左下微缩雷达小地图 */
.minimap-pod {
  padding: 6px; display: flex; flex-direction: column; gap: 4px; flex: 0 0 auto;
}
.minimap-head { display: flex; justify-content: space-between; align-items: center; font-size: 10px; color: var(--ui-text-muted); }
.minimap-canvas {
  width: 100%; height: 92px; border-radius: var(--ui-r-sm);
  border: 1px solid var(--ui-line-subtle); background: #10131a; display: block; cursor: crosshair;
}

/* 底中选中单位武器与 6 槽指令舱（紧贴底边，保持在 y > 544px 不侵入中央 60%） */
.hud-bottom-center {
  flex: 1; min-width: 0; max-width: 688px; margin: 0 auto;
  padding: 8px 11px; display: flex; flex-direction: column; gap: 7px;
  align-self: flex-end;
}
.unit-bar-row {
  display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: nowrap;
}
.unit-ident { display: flex; align-items: center; gap: 8px; min-width: 0; flex: 1; }
.unit-ident-txt { display: flex; flex-direction: column; min-width: 0; flex: 1; }
.unit-title-line { display: flex; align-items: center; gap: 6px; }
.unit-title-line strong { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.unit-hp-line { display: flex; align-items: center; gap: 8px; margin-top: 2px; }
.unit-hp-line .hp-track { flex: 1; min-width: 90px; }

.weapon-strip { display: flex; align-items: center; gap: 5px; flex: 0 0 auto; }
.wep-pill {
  padding: 3px 8px; border-radius: var(--ui-r-sm);
  background: rgba(11,12,18,0.86); border: 1px solid var(--ui-line-base);
  color: var(--ui-text-secondary); font-size: 10.5px; cursor: pointer;
  display: inline-flex; align-items: center; gap: 5px; white-space: nowrap;
}
.wep-pill.active { border-color: var(--ui-state-select); color: var(--ui-state-select); background: var(--ui-state-select-fill); font-weight: 700; }

/* 定制战术下拉 .ui-select（强制支持向上弹出 .is-dropup） */
.ui-select { position: relative; min-width: 146px; flex: 0 0 auto; }
.ui-select-trigger {
  width: 100%; height: 28px; padding: 0 8px;
  display: flex; align-items: center; justify-content: space-between; gap: 6px;
  background: rgba(11, 12, 18, 0.90); border: 1px solid var(--ui-line-base);
  border-radius: var(--ui-r-sm); color: var(--ui-text-primary);
  font-size: 11px; font-weight: 700; cursor: pointer; white-space: nowrap;
}
.ui-select-trigger:hover { border-color: rgba(240,211,114,0.56); }
.ui-select.is-open .ui-select-trigger { border-color: var(--ui-state-select); box-shadow: 0 0 0 2px var(--ui-state-select-fill); }
.ui-select-val { display: inline-flex; align-items: center; gap: 6px; }
.ui-select-dot { width: 6px; height: 6px; border-radius: 50%; flex: 0 0 auto; }
.ui-select-chev { width: 12px; height: 12px; color: var(--ui-text-muted); transition: transform 150ms; }
.ui-select.is-open .ui-select-chev { transform: rotate(180deg); color: var(--ui-state-select); }
.ui-select-menu {
  position: absolute; top: calc(100% + 5px); right: 0; min-width: 100%; width: max-content; max-width: 248px;
  z-index: 95; padding: 4px; border-radius: 8px;
  background: var(--ui-bg-pod-elevated); border: 1px solid rgba(240, 211, 114, 0.36);
  box-shadow: var(--ui-rim-top), 0 14px 32px rgba(0, 0, 0, 0.80);
  display: flex; flex-direction: column; gap: 2px;
}
.ui-select.is-dropup .ui-select-menu { top: auto; bottom: calc(100% + 6px); right: 0; }
.ui-select-option {
  position: relative; width: 100%; padding: 6px 8px 6px 10px;
  border: 1px solid transparent; border-radius: var(--ui-r-sm);
  background: transparent; color: var(--ui-text-secondary); font-size: 11.5px; text-align: left;
  display: flex; align-items: center; justify-content: space-between; gap: 8px; cursor: pointer;
}
.ui-select-option:hover, .ui-select-option.is-focused { background: rgba(255,255,255,0.08); color: var(--ui-text-primary); }
.ui-select-option[aria-selected="true"] {
  background: rgba(240, 211, 114, 0.13); border-color: rgba(240, 211, 114, 0.34);
  color: var(--ui-state-select); font-weight: 700;
}
.ui-select-option[aria-selected="true"]::before {
  content: ""; position: absolute; left: 2px; top: 4px; bottom: 4px; width: 3px;
  border-radius: 2px; background: var(--ui-state-select);
}
.ui-select-option-sub { display: block; font-size: 10px; color: var(--ui-text-muted); font-weight: 400; }

/* 6 槽战术指令栏（支持扇形冷却 / 充能低量耗尽 / 锁定斜纹 / 悬浮 Tooltip） */
.cmd-grid {
  display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px;
}
.cmd-slot {
  position: relative; height: 54px; padding: 6px 6px 5px;
  border-radius: var(--ui-r-control);
  background: var(--ui-bg-slot); border: 1px solid var(--ui-line-base);
  display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 2px;
  cursor: pointer; overflow: visible; text-align: center;
  transition: border-color 100ms, background 100ms;
}
.cmd-slot:hover:not(.is-locked):not(.is-empty):not(.is-cooling) { border-color: var(--ui-state-select); background: rgba(255,255,255,0.08); }
.cmd-slot.is-active-mode { border-color: var(--ui-state-safe); background: rgba(60,214,159,0.12); }
.cmd-slot .slot-key { position: absolute; top: 4px; left: 4px; }
.cmd-slot .slot-charge {
  position: absolute; top: 4px; right: 4px;
  font-family: var(--ui-font-mono); font-size: 9.5px; font-weight: 800;
  padding: 1px 4px; border-radius: 3px;
  background: rgba(13,14,19,0.88); border: 1px solid var(--ui-line-base); color: var(--ui-text-primary);
}
.cmd-slot.is-low .slot-charge { border-color: var(--ui-state-warn); color: var(--ui-state-warn); }
.cmd-slot.is-empty { opacity: 0.56; border-color: rgba(255,82,102,0.44); cursor: not-allowed; }
.cmd-slot.is-empty .slot-charge { background: rgba(255,82,102,0.22); border-color: var(--ui-state-danger); color: var(--ui-state-danger); }
.cmd-slot .slot-title { font-size: 11px; font-weight: 800; color: var(--ui-text-primary); white-space: nowrap; }
.cmd-slot .slot-sub { font-size: 9.5px; color: var(--ui-text-muted); white-space: nowrap; }

.cd-mask {
  position: absolute; inset: 0; border-radius: var(--ui-r-control);
  display: grid; place-items: center; pointer-events: none; z-index: 3;
  background: conic-gradient(rgba(10, 11, 16, 0.96) var(--cd-deg, 0deg), rgba(10, 11, 16, 0.78) 0deg);
}
.cd-sec { font-family: var(--ui-font-mono); font-size: 17px; font-weight: 900; color: #ffffff; text-shadow: 0 2px 8px #000000; }
.cmd-slot.is-cooling { border-color: var(--ui-line-subtle); cursor: wait; }
.cmd-slot.is-cooling > :not(.cd-mask):not(.slot-key):not(.tip-bubble) { visibility: hidden; }

.cmd-slot.is-locked {
  cursor: not-allowed;
  background: repeating-linear-gradient(-45deg, rgba(255,255,255,0.03) 0 6px, transparent 6px 12px), rgba(14,15,22,0.92);
  border-color: rgba(255,255,255,0.10);
}
.cmd-slot.is-locked .slot-title { color: var(--ui-text-muted); }

/* Tooltip 悬浮气泡 */
.tip-bubble {
  position: absolute; bottom: calc(100% + 7px); left: 50%; transform: translateX(-50%);
  padding: 5px 8px; border-radius: var(--ui-r-sm); white-space: nowrap; pointer-events: none;
  background: #0a0b10; border: 1px solid var(--ui-state-select); color: var(--ui-text-primary);
  font-size: 10.5px; box-shadow: 0 8px 20px rgba(0,0,0,0.65); z-index: 40;
  opacity: 0; transition: opacity 100ms;
}
.cmd-slot:hover .tip-bubble { opacity: 1; }

/* 右下角镜头胶囊 ＋ L1 无底框硬黑外描边引导 */
.hud-bottom-right {
  min-width: 214px; flex: 0 0 auto; align-self: flex-end;
  display: flex; flex-direction: column; align-items: flex-end; gap: 7px;
}
.hud-stage[data-aspect="21:9"] .minimap-canvas { height: 64px; }
.hud-stage[data-aspect="21:9"] .squad-dock { max-height: calc(100% - 98px); }
.hud-stage[data-aspect="21:9"] .hud-bottom-center { padding: 6px 10px; gap: 5px; }
.hud-stage[data-aspect="21:9"] .cmd-slot { height: 48px; }
.cam-capsule {
  display: inline-flex; align-items: center; gap: 3px; padding: 4px 7px;
  border-radius: var(--ui-r-pill);
}
.cam-capsule button {
  width: 22px; height: 22px; border: none; border-radius: 50%;
  background: rgba(255,255,255,0.07); color: var(--ui-text-primary); cursor: pointer;
  font-size: 12px; font-weight: 700; display: grid; place-items: center;
}
.cam-capsule button:hover { background: var(--ui-state-select); color: var(--ui-text-inverse); }
.cam-capsule span.cam-readout { font-family: var(--ui-font-mono); font-size: 10.5px; color: var(--ui-state-select); padding: 0 5px; }

.l1-prompts {
  display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 6px 10px;
}

/* ====== Z-300 8 槽放射战术轮盘 ====== */
.wheel-backdrop {
  position: absolute; inset: 0; z-index: var(--ui-z-drawer);
  background: rgba(6, 7, 11, 0.42); backdrop-filter: blur(6px);
  display: grid; place-items: center;
}
.wheel-ring { position: relative; width: 320px; height: 300px; }
.wheel-center {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
  width: 106px; height: 106px; border-radius: 50%;
  background: var(--ui-bg-pod-elevated); border: 2px solid var(--ui-state-select);
  box-shadow: 0 12px 32px rgba(0,0,0,0.72);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  text-align: center; padding: 8px; cursor: pointer;
}
.wheel-center strong { font-size: 12.5px; color: var(--ui-state-select); }
.wheel-center span { font-size: 10px; color: var(--ui-text-secondary); margin-top: 2px; }
.wheel-slot {
  position: absolute; transform: translate(-50%, -50%);
  width: 82px; height: 48px; border-radius: var(--ui-r-sm);
  background: var(--ui-bg-pod-elevated); border: 1px solid var(--ui-line-base);
  color: var(--ui-text-primary); cursor: pointer; overflow: hidden;
  display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding-top: 5px;
}
.wheel-slot .w-bar {
  width: 100%; padding: 2px 0; font-size: 10px; font-weight: 800; text-align: center;
  background: rgba(255,255,255,0.06); color: var(--ui-text-secondary);
}
.wheel-slot:hover, .wheel-slot.active { border-color: #ffffff; transform: translate(-50%, -50%) scale(1.06); z-index: 2; }
.wheel-slot:hover .w-bar, .wheel-slot.active .w-bar { background: #ffffff; color: var(--ui-text-inverse); }

/* ====== Z-300 右侧后方增援与物资抽屉（不透明 #14151e 实底防透字） ====== */
.drawer-backdrop {
  position: absolute; inset: 0; z-index: calc(var(--ui-z-drawer) - 1);
  background: rgba(5, 6, 10, 0.48);
}
.reinf-drawer {
  position: absolute; top: 12px; right: 12px; bottom: 12px; width: min(350px, calc(100% - 24px));
  z-index: calc(var(--ui-z-drawer) + 2);
  background: var(--ui-bg-pod-elevated); border: 1px solid var(--ui-line-base);
  border-radius: var(--ui-r-surface); box-shadow: var(--ui-rim-top), 0 20px 50px rgba(0,0,0,0.78);
  padding: 14px; display: flex; flex-direction: column; gap: 10px;
}
.drawer-head { display: flex; justify-content: space-between; align-items: center; padding-bottom: 8px; border-bottom: 1px solid var(--ui-line-subtle); }
.drawer-list { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 7px; }
.reinf-item {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding: 8px 10px; border-radius: var(--ui-r-control);
  background: rgba(255,255,255,0.04); border: 1px solid var(--ui-line-subtle);
}
.reinf-item strong { display: block; font-size: 12px; }
.reinf-item span { display: block; font-size: 10.5px; color: var(--ui-text-muted); }

/* 定制精工复选框 */
.ui-check {
  appearance: none; -webkit-appearance: none; margin: 0; flex: 0 0 auto;
  width: 15px; height: 15px; border-radius: 4px; cursor: pointer; position: relative;
  background: rgba(11, 12, 18, 0.88); border: 1.5px solid rgba(255, 255, 255, 0.30);
}
.ui-check:checked { background: var(--ui-state-select); border-color: var(--ui-state-select); }
.ui-check:checked::after {
  content: ""; position: absolute; left: 4px; top: 1px; width: 4px; height: 8px;
  border: solid #0d0e13; border-width: 0 2px 2px 0; transform: rotate(42deg);
}

/* ====== Z-400 战局快速暂停遮罩（允许毛玻璃） ====== */
.pause-overlay {
  position: absolute; inset: 0; z-index: var(--ui-z-overlay);
  background: rgba(6, 7, 11, 0.72); backdrop-filter: blur(18px);
  display: grid; place-items: center; padding: 20px;
}
.pause-card {
  width: min(420px, 92%); padding: 20px 22px; border-radius: var(--ui-r-surface);
  background: var(--ui-bg-overlay-glass); border: 1px solid var(--ui-line-base);
  box-shadow: var(--ui-rim-top), 0 24px 64px rgba(0,0,0,0.78);
  display: flex; flex-direction: column; gap: 12px;
}

/* ====== Z-500 Toast 队列（上限 2 条） ====== */
.toast-stack {
  position: absolute; top: 60px; right: 16px; z-index: var(--ui-z-system);
  display: flex; flex-direction: column; gap: 7px; pointer-events: none;
}
.toast-item {
  display: flex; align-items: center; gap: 9px; padding: 8px 12px;
  border-radius: var(--ui-r-control); background: rgba(16, 17, 25, 0.96);
  border: 1px solid var(--ui-line-base); box-shadow: 0 10px 26px rgba(0,0,0,0.62);
  font-size: 11.5px; max-width: 320px;
}
.toast-dot { width: 7px; height: 7px; border-radius: 50%; flex: 0 0 auto; }
.toast-item strong { display: block; font-size: 11.5px; }
.toast-item span { display: block; font-size: 10.5px; color: var(--ui-text-secondary); }
</style>
</head>
<body>
<div class="viewport-host">
  <div class="hud-stage" id="hud-stage" data-aspect="full">
    <!-- Z-100 底层 680p 复古微缩战场 + 原生 DPR 标绘层 -->
    <canvas class="world-3d-canvas" id="world-3d-canvas"></canvas>
    <svg class="world-ring-svg" id="world-ring-svg" aria-hidden="true"></svg>
    <canvas class="world-overlay-canvas" id="world-overlay-canvas"></canvas>
    <div class="world-ui-layer" id="world-ui-layer"></div>
    <div class="drag-select-box" id="drag-select-box" hidden></div>

    <!-- Z-200 战斗常驻 HUD 安全区（严禁 backdrop-filter） -->
    <div class="hud-layer" id="hud-layer">
      <div class="hud-layer-clamp">
        <!-- 顶部态势条（无强制倒计时） -->
        <header class="hud-top-bar">
          <div class="hud-pod zone-strip" id="zone-strip" aria-label="三区肃清与占领态势"></div>

          <div class="hud-pod top-telemetry" aria-label="战场资源与帧率遥测">

            <span class="tele-sep"></span>

            <span class="tele-sep"></span>
            <span class="tele-item">编制 <b id="tele-cap">6/8</b></span>
            <span class="tele-sep"></span>
            <span class="tele-item mono"><b id="tele-fps">60 FPS · 11ms</b></span>
          </div>

          <div class="top-actions">
            <button type="button" class="ui-btn ui-btn--danger" id="btn-sim-hit">模拟受击 -28%</button>
            <button type="button" class="ui-btn" id="btn-aspect">画幅：全屏</button>
            <button type="button" class="ui-btn" id="btn-hide-hud">隐藏 HUD [F5]</button>
          </div>
        </header>

        <!-- 中下战区：左侧编队/雷达 + 中央全净空战场 + 底中武器指令舱 + 右下镜头/L1引导 -->
        <div class="hud-mid-row">
          <div class="hud-left-col">
            <aside class="hud-pod squad-dock" aria-label="编队状态微卡">
              <div class="ui-seg" id="layer-seg">
                <button type="button" data-layer="all" class="active">3 全部</button>
                <button type="button" data-layer="ground">1 地面</button>
                <button type="button" data-layer="air">2 空中</button>
              </div>
              <div class="squad-list" id="squad-list"></div>
            </aside>

            <aside class="hud-pod minimap-pod" aria-label="战区雷达小地图">
              <div class="minimap-head">
                <span class="mono" style="font-weight:700">AIRBASE RADAR</span>
                <span>点击跳镜</span>
              </div>
              <canvas class="minimap-canvas" id="minimap-canvas" width="204" height="92"></canvas>
            </aside>
          </div>

          <!-- 底中选中单位武器与 6 槽指令舱 -->
          <section class="hud-pod hud-bottom-center" aria-label="选中单位与指令舱">
            <div class="unit-bar-row">
              <div class="unit-ident">
                <span id="sel-unit-ico" style="display:grid;place-items:center;flex:0 0 auto"></span>
                <div class="unit-ident-txt">
                  <div class="unit-title-line">
                    <strong id="sel-unit-name">铁砧 01 · M1A2 SEP v3</strong>
                    <span class="mono" id="sel-unit-state" style="font-size:10px;color:var(--ui-ch-ground)">地面 · 待命</span>
                  </div>
                  <div class="unit-hp-line">
                    <div class="hp-track hp-track--lg" id="sel-hp-track">
                      <div class="hp-trail" id="sel-hp-trail" style="width:100%"></div>
                      <div class="hp-fill" id="sel-hp-fill" style="width:100%;background:var(--ui-ch-ground)"></div>
                      <div class="hp-bonus" id="sel-hp-bonus" style="left:86%;width:14%"></div>
                    </div>
                    <span class="mono" id="sel-hp-txt" style="font-size:11px;font-weight:800">100%</span>
                  </div>
                </div>
              </div>

              <div class="weapon-strip" id="weapon-strip"></div>

              <!-- 定制战术下拉（靠底自动向上弹出 .is-dropup） -->
              <div class="ui-select" id="hud-roe-select" data-value="free">
                <button type="button" class="ui-select-trigger" role="combobox" aria-haspopup="listbox" aria-expanded="false" aria-label="选中单位交战规则">
                  <span class="ui-select-val">
                    <span class="ui-select-dot" style="color:var(--ui-state-danger);background:currentColor"></span>
                    <span class="ui-select-txt">自由开火</span>
                  </span>
                  <svg class="ui-select-chev" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6l4 4 4-4"/></svg>
                </button>
                <div class="ui-select-menu" role="listbox" hidden>
                  <button type="button" class="ui-select-option" role="option" data-val="free" data-dot="var(--ui-state-danger)" aria-selected="true">
                    <div><span>自由开火 · 优先高危</span><span class="ui-select-option-sub">发现可见目标立即开火</span></div>
                  </button>
                  <button type="button" class="ui-select-option" role="option" data-val="return" data-dot="var(--ui-state-warn)" aria-selected="false">

                  </button>
                  <button type="button" class="ui-select-option" role="option" data-val="hold" data-dot="var(--ui-ch-ground)" aria-selected="false">
                    <div><span>停火待命 · 接受补给</span><span class="ui-select-option-sub">停稳停火以完成弹药补给</span></div>
                  </button>
                </div>
              </div>
            </div>

            <!-- 6 槽游戏专属状态机指令栏 -->
            <div class="cmd-grid" id="cmd-grid"></div>
          </section>

          <div class="hud-bottom-right">

            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- 隐藏 HUD 状态下的角标唤醒提示（L1 无底框硬描边） -->
    <div id="hud-restore-hint" hidden style="position:absolute;top:12px;right:14px;z-index:210">
      <button type="button" class="ui-prompt-btn" id="btn-restore-hud"><span class="ui-outlined-text">恢复战斗 HUD</span><span class="ui-keycap">F5</span></button>
    </div>

    <!-- Z-300 8 槽放射状战术轮盘（按 V 唤出） -->
    <div class="wheel-backdrop" id="wheel-overlay" hidden>
      <div class="wheel-ring" id="wheel-ring">
        <button type="button" class="wheel-center" id="wheel-center">
          <strong id="wheel-title">取消轮盘</strong>
          <span id="wheel-sub">点击中心或按 ESC 返回</span>
        </button>
      </div>
    </div>

    <!-- Z-300 右侧后方增援与补给抽屉（不透明实底 #14151e 防透字） -->
    <div class="drawer-backdrop" id="reinf-backdrop" hidden></div>
    <aside class="reinf-drawer" id="reinf-drawer" role="dialog" aria-modal="true" aria-label="后方增援与物资调度" hidden>
      <div class="drawer-head">
        <div>
          <span class="mono" style="font-size:10px;color:var(--ui-state-select)">REINFORCEMENT &amp; LOGISTICS</span>
          <h3 class="display-font" style="margin:2px 0 0;font-size:16px">后方站增援与物资购入</h3>
        </div>
        <button type="button" class="ui-btn" id="btn-close-drawer">关闭 <span class="ui-keycap ui-keycap--dark">ESC</span></button>
      </div>
      <div style="font-size:11px;color:var(--ui-text-secondary);padding:6px 8px;border-radius:5px;background:rgba(255,255,255,0.04)">
        增援从左下角后方补给站进场，价格含首批弹药；占用总编制上限 <b class="mono">8</b>。
      </div>
      <div class="drawer-list" id="reinf-list"></div>
      <label style="display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--ui-text-secondary);cursor:pointer;padding-top:6px;border-top:1px solid var(--ui-line-subtle)">
        <input type="checkbox" class="ui-check" id="chk-auto-rally" checked> 新入场单位自动前出至 B 区南翼集结点
      </label>
    </aside>

    <!-- Z-400 战局暂停遮罩（允许毛玻璃） -->
    <div class="pause-overlay" id="pause-overlay" hidden>
      <div class="pause-card" role="dialog" aria-modal="true" aria-label="战局快速暂停">
        <span class="mono" style="font-size:11px;color:var(--ui-state-select)">SIMULATION PAUSED // Z-400</span>
        <h3 class="display-font" style="margin:0;font-size:24px">战局已暂停</h3>
        <p style="margin:0;font-size:12px;color:var(--ui-text-secondary)">按 ESC 立即恢复战斗模拟与时间流速，或重置至示范初始战况。</p>
        <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:4px">
          <button type="button" class="ui-btn" id="btn-pause-reset">重置示范战况</button>
          <button type="button" class="ui-btn ui-btn--primary" id="btn-pause-resume" style="height:34px;padding:0 16px">恢复战斗 <span class="ui-keycap">ESC</span></button>
        </div>
      </div>
    </div>

    <!-- Z-500 Toast 队列（上限 2 条） -->
    <div class="toast-stack" id="toast-stack" aria-live="polite"></div>
  </div>
</div>

  /* ====== 画布尺寸严格遵循 680p（底层 680px 高，UI 原生 DPR 高清） ====== */
  function resizeAll() {
    const w = Math.max(320, stageEl.clientWidth);

  function worldToScreen(wx, wy, wz) {
    const w = stageEl.clientWidth, h = stageEl.clientHeight;
    const ppm = h / cam.span;
    const dx = wx - cam.cx, dz = wz - cam.cz;
    const c = Math.cos(cam.angle), s = Math.sin(cam.angle);
    const rx = dx * c - dz * s, rz = dx * s + dz * c;
    return { x: w * 0.5 + rx * ppm, y: h * 0.5 + rz * SIN_TILT * ppm - wy * COS_TILT * ppm, ppm };
  }
  function screenToWorld(sx, sy) {
    const w = stageEl.clientWidth, h = stageEl.clientHeight;
    const ppm = h / cam.span;
    const nx = (sx - w * 0.5) / ppm, nz = (sy - h * 0.5) / (ppm * SIN_TILT);
    const c = Math.cos(cam.angle), s = Math.sin(cam.angle);
    return { x: cam.cx + nx * c + nz * s, z: cam.cz - nx * s + nz * c };
  }
  function unitAllowed(u) { return layerFilter === 'all' || u.layer === layerFilter; }
  function checkReachable(u, x, z) {
    if (x < BOUNDS.minX || x > BOUNDS.maxX || z < BOUNDS.minZ || z > BOUNDS.maxZ) return { valid: false, reason: '超出战区边界' };
    if (u.layer === 'ground' && x >= OBSTACLE.minX && x <= OBSTACLE.maxX && z >= OBSTACLE.minZ && z <= OBSTACLE.maxZ) {

  /* ====== 车底防叠字碰撞引擎（0px 锚点绝不跳槽） ====== */
  function rectsOverlap(a, b, m) {
    return !(a.right + m <= b.left || a.left - m >= b.right || a.bottom + m <= b.top || a.top - m >= b.bottom);
  }
  function resolveNameplateCollision(items) {
    const rank = it => (it.isHovered ? 4 : it.isSelected ? 3 : it.isActive ? 2 : 1);
    const ordered = [...items].sort((a, b) => rank(b) - rank(a) || a.id.localeCompare(b.id));
    const occFull = [], occHigh = [], occComp = [];
    const res = new Map();
    for (const it of ordered) {
      const p = rank(it);
      const fw = it.isSelected || it.isHovered ? 104 : 68, fh = 20, cw = 22, ch = 18;
      const ax = it.ax, ay = it.ay;
      const fRect = { left: ax - fw * 0.5, right: ax + fw * 0.5, top: ay, bottom: ay + fh };
      const cRect = { left: ax - cw * 0.5, right: ax + cw * 0.5, top: ay, bottom: ay + ch };
      if (p >= 3) { occFull.push(fRect); occHigh.push(fRect); res.set(it.id, 'full'); continue; }
      if (!occFull.some(r => rectsOverlap(fRect, r, 3))) { occFull.push(fRect); res.set(it.id, 'full'); continue; }
      if (!occHigh.some(r => rectsOverlap(cRect, r, 3)) && !occComp.some(c => Math.hypot(ax - c.x, ay - c.y) < 10)) {
        occComp.push({ x: ax, y: ay }); res.set(it.id, 'compact');
      } else res.set(it.id, 'dimmed');
    }
    return res;
  }

        const t = Math.min(dragBox.y0, dragBox.y1), b = Math.max(dragBox.y0, dragBox.y1);

  const selects = [];
  function closeAllSelects(except = null) { for (const s of selects) if (s.el !== except) s.close(); }
  function bindSelect(id, onChange) {
    const box = document.getElementById(id);
    const trig = box.querySelector('.ui-select-trigger');
    const menu = box.querySelector('.ui-select-menu');
    const opts = Array.from(box.querySelectorAll('.ui-select-option'));
    const txtEl = box.querySelector('.ui-select-txt');
    const dotEl = box.querySelector('.ui-select-trigger .ui-select-dot');
    let fIdx = 0;
    const setF = i => { fIdx = (i + opts.length) % opts.length; opts.forEach((o, idx) => o.classList.toggle('is-focused', idx === fIdx)); };
    const close = () => { box.classList.remove('is-open'); menu.hidden = true; trig.setAttribute('aria-expanded', 'false'); };
    const open = () => {
      closeAllSelects(box);
      const tRect = trig.getBoundingClientRect();
      const sRect = stageEl.getBoundingClientRect();
      const spaceBelow = Math.min(window.innerHeight, sRect.bottom) - tRect.bottom;
      box.classList.toggle('is-dropup', spaceBelow < 185);
      box.classList.add('is-open'); menu.hidden = false; trig.setAttribute('aria-expanded', 'true');
      setF(Math.max(0, opts.findIndex(o => o.getAttribute('aria-selected') === 'true')));
    };
    const setValue = (val, emit = false) => {
      const target = opts.find(o => o.dataset.val === val) || opts[0];
      opts.forEach(o => o.setAttribute('aria-selected', String(o === target)));
      box.dataset.value = target.dataset.val;
      const fullTxt = target.querySelector('span')?.textContent || '';
      if (txtEl) txtEl.textContent = fullTxt.split('·')[0].trim();
      if (dotEl && target.dataset.dot) dotEl.style.color = target.dataset.dot;
      if (emit && onChange) onChange(target.dataset.val, fullTxt);
    };
    trig.addEventListener('click', e => { e.stopPropagation(); menu.hidden ? open() : close(); });
    opts.forEach((o, idx) => {
      o.addEventListener('pointerenter', () => setF(idx));
      o.addEventListener('click', e => { e.stopPropagation(); setValue(o.dataset.val, true); close(); trig.focus(); });
    });
    const api = { el: box, isOpen: () => !menu.hidden, close, setValue };
    selects.push(api);
    return api;
  }

  document.getElementById('btn-focus-unit').addEventListener('click', () => { const u = units.find(x => x.id === primaryId); if (u) { cam.cx = u.x; cam.cz = u.z; } });
  document.getElementById('btn-stop-unit').addEventListener('click', () => {
    units.filter(u => selected.has(u.id)).forEach(u => { u.queue = []; u.mode = u.kind === 'cas' ? 'orbit' : 'idle'; });
    syncSelectedHud();
    pushToast('已停止选中单位当前航路 [X]', '', 'var(--ui-state-warn)');
  });

  /* ====== 统一键盘控制与严格 LIFO ESC 栈 ====== */
  window.addEventListener('keydown', e => {
    keys.add(e.code);
    if (e.key === 'Escape') {
      e.preventDefault();
      const openSel = selects.find(s => s.isOpen());
      if (openSel) { openSel.close(); return; }
      if (!document.getElementById('wheel-overlay').hidden) { closeWheel(); return; }
      if (!document.getElementById('reinf-drawer').hidden) { setDrawerOpen(false); return; }
      setPaused(!paused);
      return;
    }
    if (e.code === 'F5') { e.preventDefault(); setHudHidden(!hudHidden); return; }
    if (paused) return;
    if (e.code === 'KeyV') openWheel();
    else if (e.code === 'KeyP') setDrawerOpen(document.getElementById('reinf-drawer').hidden);
    else if (e.code === 'KeyC') document.getElementById('btn-focus-unit').click();
    else if (e.code === 'KeyX') document.getElementById('btn-stop-unit').click();
    else if (e.code === 'KeyF') document.getElementById('cam-reset').click();
    else if (e.code === 'KeyR') triggerDecoy();
    else if (e.code === 'KeyE') { const u = units.find(x => x.id === primaryId); if (u) triggerSupply(u); }
    else if (e.code === 'KeyQ') triggerAirstrike();
    else if (e.code === 'Tab') {
      e.preventDefault();
      const vis = units.filter(unitAllowed);
      if (vis.length) {
        const idx = vis.findIndex(u => u.id === primaryId);
        const nxt = vis[(idx + 1) % vis.length];
        selected.clear(); selected.add(nxt.id); primaryId = nxt.id; syncSelectedHud();
      }
    } else if (/^Digit[1-6]$/.test(e.code)) {
      const k = e.code.slice(-1);
      const t = units.find(u => u.key === k);
      if (t) { selected.clear(); selected.add(t.id); primaryId = t.id; syncSelectedHud(); }
    }
  });
  window.addEventListener('keyup', e => keys.delete(e.code));

  /* ====== 实时战场模拟与双层渲染主循环 ====== */
  let lastT = performance.now(), fpsSmooth = 60.0;
  function stepSim(dt) {
    if (paused) return;
    let cdDirty = false;
    if (cdState.supply > 0) { cdState.supply = Math.max(0, cdState.supply - dt); cdDirty = true; }
    if (cdState.airstrike > 0) { cdState.airstrike = Math.max(0, cdState.airstrike - dt); cdDirty = true; }
    if (cdDirty && Math.floor((lastT + dt * 1000) / 250) !== Math.floor(lastT / 250)) renderCmdSlots();

    for (const u of units) {
      if (u.kind === 'cas' && u.orbit) {
        u.orbit.phase += dt * 0.65;
        const nx = u.orbit.x + Math.cos(u.orbit.phase) * u.orbit.r;
        const nz = u.orbit.z + Math.sin(u.orbit.phase) * u.orbit.r;
        u.yaw = Math.atan2(nz - u.z, nx - u.x);
        u.x = nx; u.z = nz;
      } else if (u.queue.length) {
        const wp = u.queue[0];
        const dx = wp.x - u.x, dz = wp.z - u.z, dist = Math.hypot(dx, dz);
        const step = u.maxSpeed * dt;
        if (dist <= step + 0.5) {
          u.x = wp.x; u.z = wp.z; if (wp.facing !== undefined) u.yaw = wp.facing;
          u.queue.shift(); if (!u.queue.length) u.mode = 'idle';
        } else {
          u.yaw = Math.atan2(dz, dx);
          u.x += (dx / dist) * step; u.z += (dz / dist) * step;
        }
      }
    }

    // 诱饵计时与吸引尸群
    for (let i = decoys.length - 1; i >= 0; i--) {
      const d = decoys[i];
      if (d.delay > 0) d.delay = Math.max(0, d.delay - dt);
      else {
        d.active -= dt;
        for (const z of zombies) {
          const dx = d.x - z.x, dz = d.z - z.z, dist = Math.hypot(dx, dz);
          if (dist < 76 && dist > 3) { z.x += (dx / dist) * 5.2 * dt; z.z += (dz / dist) * 5.2 * dt; }
        }
        if (d.active <= 0) decoys.splice(i, 1);
      }
    }
    for (let i = tracers.length - 1; i >= 0; i--) { tracers[i].life -= dt; if (tracers[i].life <= 0) tracers.splice(i, 1); }
  }

  function renderFrame(now) {
    const dt = Math.min(0.05, (now - lastT) / 1000);
    lastT = now;
    fpsSmooth = fpsSmooth * 0.92 + (1 / Math.max(0.008, dt)) * 0.08;
    document.getElementById('tele-fps').textContent = `${fpsSmooth.toFixed(0)} FPS · ${(dt * 1000).toFixed(0)}ms`;

    // WASD 镜头平移
    const px = (keys.has('KeyD') ? 1 : 0) - (keys.has('KeyA') ? 1 : 0);
    const pz = (keys.has('KeyS') ? 1 : 0) - (keys.has('KeyW') ? 1 : 0);
    if (px || pz) {
      const c = Math.cos(cam.angle), s = Math.sin(cam.angle), spd = cam.span * 0.45 * dt;
      cam.cx += (px * c + pz * s) * spd; cam.cz += (-px * s + pz * c) * spd;
    }
    cam.span += (cam.targetSpan - cam.span) * Math.min(1, dt * 14);
    cam.angle += (cam.targetAngle - cam.angle) * Math.min(1, dt * 14);
    const lvl = cam.span < 135 ? '近景' : cam.span > 290 ? '远景' : '中景';
    document.getElementById('cam-span-lbl').textContent = `${lvl} ${Math.round(cam.span)}m`;

    stepSim(dt);

    /* ---- 1. 绘制底层 680p 暖滤镜 3D 战场画布 ---- */
    const cw = bgCanvas.width, ch = bgCanvas.height;
    const sw = stageEl.clientWidth, sh = stageEl.clientHeight;
    const scaleX = cw / sw, scaleY = ch / sh;
    bCtx.save();
    bCtx.setTransform(scaleX, 0, 0, scaleY, 0, 0);
    bCtx.fillStyle = '#2c352c';
    bCtx.fillRect(0, 0, sw, sh);

    // 主跑道与停机坪水泥地
    const rPts = [worldToScreen(-110, 0, 52), worldToScreen(118, 0, -52), worldToScreen(128, 0, -28), worldToScreen(-100, 0, 74)];
    bCtx.fillStyle = '#53564f';
    bCtx.beginPath(); rPts.forEach((p, i) => i ? bCtx.lineTo(p.x, p.y) : bCtx.moveTo(p.x, p.y)); bCtx.closePath(); bCtx.fill();
    bCtx.strokeStyle = 'rgba(240, 211, 114, 0.35)'; bCtx.lineWidth = 1.6; bCtx.setLineDash([12, 10]);
    const c0 = worldToScreen(-105, 0, 62), c1 = worldToScreen(122, 0, -40);
    bCtx.beginPath(); bCtx.moveTo(c0.x, c0.y); bCtx.lineTo(c1.x, c1.y); bCtx.stroke(); bCtx.setLineDash([]);

    // 栅格参考线
    bCtx.strokeStyle = 'rgba(255,255,255,0.06)'; bCtx.lineWidth = 1;
    bCtx.beginPath();
    for (let x = -160; x <= 160; x += 24) {
      const a = worldToScreen(x, 0, -140), b = worldToScreen(x, 0, 140);
      bCtx.moveTo(a.x, a.y); bCtx.lineTo(b.x, b.y);
    }
    for (let z = -120; z <= 120; z += 24) {
      const a = worldToScreen(-180, 0, z), b = worldToScreen(180, 0, z);
      bCtx.moveTo(a.x, a.y); bCtx.lineTo(b.x, b.y);
    }
    bCtx.stroke();

    // 机库静态障碍区
    const ob = [worldToScreen(OBSTACLE.minX, 0, OBSTACLE.minZ), worldToScreen(OBSTACLE.maxX, 0, OBSTACLE.minZ), worldToScreen(OBSTACLE.maxX, 0, OBSTACLE.maxZ), worldToScreen(OBSTACLE.minX, 0, OBSTACLE.maxZ)];
    bCtx.fillStyle = 'rgba(255, 82, 102, 0.16)'; bCtx.strokeStyle = 'rgba(255, 82, 102, 0.72)'; bCtx.lineWidth = 1.5; bCtx.setLineDash([6, 4]);
    bCtx.beginPath(); ob.forEach((p, i) => i ? bCtx.lineTo(p.x, p.y) : bCtx.moveTo(p.x, p.y)); bCtx.closePath(); bCtx.fill(); bCtx.stroke(); bCtx.setLineDash([]);

    // 后方补给站 & A/B/C 任务区圆圈
    const fBase = worldToScreen(-84, 0, 44);
    bCtx.fillStyle = 'rgba(60, 214, 159, 0.18)'; bCtx.strokeStyle = '#3cd69f'; bCtx.lineWidth = 1.8;
    bCtx.beginPath(); bCtx.ellipse(fBase.x, fBase.y, 18 * fBase.ppm, 18 * fBase.ppm * SIN_TILT, 0, 0, Math.PI * 2); bCtx.fill(); bCtx.stroke();
    for (const z of ZONES) {
      const zp = worldToScreen(z.x, 0, z.z);
      bCtx.fillStyle = z.col + '22'; bCtx.strokeStyle = z.col; bCtx.lineWidth = 1.6; bCtx.setLineDash([7, 5]);
      bCtx.beginPath(); bCtx.ellipse(zp.x, zp.y, z.r * zp.ppm, z.r * zp.ppm * SIN_TILT, 0, 0, Math.PI * 2); bCtx.fill(); bCtx.stroke(); bCtx.setLineDash([]);
    }

    // 视野可见判别 & 迷雾遮罩（东北 C 区处加迷雾＋模糊群声涟漪）
    const inVision = (wx, wz) => units.some(u => Math.hypot(u.x - wx, u.z - wz) <= u.sight);
    const fogC = worldToScreen(ZONES[2].x, 0, ZONES[2].z);
    const fogGrad = bCtx.createRadialGradient(fogC.x, fogC.y, 8, fogC.x, fogC.y, 56 * fogC.ppm);
    fogGrad.addColorStop(0, 'rgba(10, 12, 18, 0.78)'); fogGrad.addColorStop(1, 'rgba(10, 12, 18, 0)');
    bCtx.fillStyle = fogGrad; bCtx.beginPath(); bCtx.arc(fogC.x, fogC.y, 58 * fogC.ppm, 0, Math.PI * 2); bCtx.fill();
    // 迷雾外模糊群声涟漪（不暴露具体位置数量）
    const waveR = (14 + ((now * 0.015) % 28)) * fogC.ppm;
    bCtx.strokeStyle = `rgba(255, 184, 0, ${0.42 - (waveR / (44 * fogC.ppm)) * 0.35})`;
    bCtx.lineWidth = 1.5; bCtx.beginPath(); bCtx.ellipse(fogC.x, fogC.y, waveR, waveR * SIN_TILT, 0, 0, Math.PI * 2); bCtx.stroke();

    // 仅绘制视野内可见尸群
    bCtx.fillStyle = '#ff5266';
    for (const zb of zombies) {
      if (!inVision(zb.x, zb.z)) continue;
      const p = worldToScreen(zb.x, 0, zb.z);
      bCtx.beginPath(); bCtx.arc(p.x, p.y, 2.2, 0, Math.PI * 2); bCtx.fill();
    }

    // 声源诱饵扩散波纹
    for (const dc of decoys) {
      const dp = worldToScreen(dc.x, 0, dc.z);
      bCtx.fillStyle = dc.delay > 0 ? '#ffb800' : '#68c8ff';
      bCtx.beginPath(); bCtx.arc(dp.x, dp.y, 4, 0, Math.PI * 2); bCtx.fill();
      if (dc.delay <= 0) {
        const rr = ((now * 0.04) % 42) * dp.ppm;
        bCtx.strokeStyle = `rgba(104, 200, 255, ${0.65 - rr / (45 * dp.ppm)})`;
        bCtx.lineWidth = 1.8;
        bCtx.beginPath(); bCtx.ellipse(dp.x, dp.y, rr, rr * SIN_TILT, 0, 0, Math.PI * 2); bCtx.stroke();
      }
    }

    // 载具低模色块实体
    for (const u of units) {
      const up = worldToScreen(u.x, u.y * 0.28, u.z);
      if (u.layer === 'air') {
        const gp = worldToScreen(u.x, 0, u.z);
        bCtx.fillStyle = 'rgba(0,0,0,0.28)'; bCtx.beginPath(); bCtx.ellipse(gp.x + 6, gp.y + 4, 9, 5, 0, 0, Math.PI * 2); bCtx.fill();
      }
      bCtx.save();
      bCtx.translate(up.x, up.y);
      bCtx.rotate(u.yaw);
      bCtx.fillStyle = u.layer === 'ground' ? '#4a5646' : '#535e66';
      bCtx.strokeStyle = '#15191c'; bCtx.lineWidth = 1.4;
      const bw = u.kind === 'cas' ? 16 : 14, bh = u.kind === 'cas' ? 12 : 9;
      bCtx.fillRect(-bw * 0.5, -bh * 0.5, bw, bh);
      bCtx.strokeRect(-bw * 0.5, -bh * 0.5, bw, bh);
      bCtx.restore();
    }
    bCtx.restore();

    /* ---- 2. 原生 DPR 场内矢量标绘（双环 / 高度虚线 / 100m 盘旋轨 / 线框幽灵） ---- */
    const dpr = ovCanvas.width / Math.max(1, sw);
    oCtx.setTransform(1, 0, 0, 1, 0, 0);
    oCtx.clearRect(0, 0, ovCanvas.width, ovCanvas.height);
    oCtx.save();
    oCtx.setTransform(dpr, 0, 0, dpr, 0, 0);

    // 扫射激光弹道特效
    for (const tr of tracers) {
      const a = worldToScreen(tr.x0, 22, tr.z0), b = worldToScreen(tr.x1, 0, tr.z1);
      oCtx.strokeStyle = tr.col; oCtx.globalAlpha = tr.life; oCtx.lineWidth = 2.2;
      oCtx.beginPath(); oCtx.moveTo(a.x, a.y); oCtx.lineTo(b.x, b.y); oCtx.stroke();
    }
    oCtx.globalAlpha = 1;

    // 诱饵 4s 倒计时文字标签
    for (const dc of decoys) {
      const dp = worldToScreen(dc.x, 0, dc.z);
      oCtx.fillStyle = '#0d0e13'; oCtx.strokeStyle = dc.delay > 0 ? '#ffb800' : '#68c8ff'; oCtx.lineWidth = 1.2;
      oCtx.beginPath(); oCtx.roundRect(dp.x + 8, dp.y - 14, 72, 18, 4); oCtx.fill(); oCtx.stroke();
      oCtx.fillStyle = '#f5f6f9'; oCtx.font = '700 10px Consolas,monospace'; oCtx.textBaseline = 'middle';
      oCtx.fillText(dc.delay > 0 ? `诱饵 ${dc.delay.toFixed(1)}s` : `引群中 ${dc.active.toFixed(0)}s`, dp.x + 13, dp.y - 5);
    }

    const markInputs = [];
    for (const u of units) {
      const node = ensureDom(u);
      const vis = unitAllowed(u);
      node.rg.style.display = vis ? '' : 'none';
      node.mark.style.display = vis ? 'inline-flex' : 'none';
      if (!vis) continue;

      const isSel = selected.has(u.id), isHov = hoveredId === u.id;
      const gp = worldToScreen(u.x, 0, u.z);
      const ap = worldToScreen(u.x, u.y * 0.28, u.z);
      const ringCol = isSel ? '#f0d372' : u.ch;

      // 关键硬规：固定翼（cas）绝不画地面贴地双环，只留地面十字锚点 + 100m 盘旋轨 + 四角框
      if (u.kind === 'cas') {
        node.rOut.style.display = 'none'; node.rIn.style.display = 'none';
        oCtx.strokeStyle = ringCol; oCtx.lineWidth = 1.5;
        oCtx.beginPath(); oCtx.moveTo(gp.x - 5, gp.y); oCtx.lineTo(gp.x + 5, gp.y); oCtx.moveTo(gp.x, gp.y - 5); oCtx.lineTo(gp.x, gp.y + 5); oCtx.stroke();
        // 100m 高空垂直虚线
        oCtx.strokeStyle = 'rgba(177, 151, 252, 0.55)'; oCtx.setLineDash([4, 4]);
        oCtx.beginPath(); oCtx.moveTo(gp.x, gp.y); oCtx.lineTo(ap.x, ap.y); oCtx.stroke(); oCtx.setLineDash([]);
        // 100m 高空盘旋圆轨
        if (u.orbit) {
          oCtx.strokeStyle = ringCol; oCtx.lineWidth = isSel ? 1.8 : 1.1; oCtx.setLineDash([7, 5]);
          oCtx.beginPath();
          for (let i = 0; i <= 36; i++) {
            const ang = (i / 36) * Math.PI * 2;
            const op = worldToScreen(u.orbit.x + Math.cos(ang) * u.orbit.r, u.y * 0.28, u.orbit.z + Math.sin(ang) * u.orbit.r);
            i ? oCtx.lineTo(op.x, op.y) : oCtx.moveTo(op.x, op.y);
          }
          oCtx.stroke(); oCtx.setLineDash([]);
        }
        // 高空机身四角锁定框
        const hw = 14, hh = 11, cl = 6;
        oCtx.strokeStyle = ringCol; oCtx.lineWidth = isSel ? 2.0 : 1.4;
        oCtx.beginPath();
        oCtx.moveTo(ap.x - hw, ap.y - hh + cl); oCtx.lineTo(ap.x - hw, ap.y - hh); oCtx.lineTo(ap.x - hw + cl, ap.y - hh);
        oCtx.moveTo(ap.x + hw - cl, ap.y - hh); oCtx.lineTo(ap.x + hw, ap.y - hh); oCtx.lineTo(ap.x + hw, ap.y - hh + cl);
        oCtx.moveTo(ap.x - hw, ap.y + hh - cl); oCtx.lineTo(ap.x - hw, ap.y + hh); oCtx.lineTo(ap.x - hw + cl, ap.y + hh);
        oCtx.moveTo(ap.x + hw - cl, ap.y + hh); oCtx.lineTo(ap.x + hw, ap.y + hh); oCtx.lineTo(ap.x + hw, ap.y + hh - cl);
        oCtx.stroke();
      } else {
        // 地面 & 直升机：正交贴地双环（SVG）
        const rx = u.ringR * gp.ppm, ry = rx * SIN_TILT;
        node.rOut.style.display = ''; node.rIn.style.display = '';
        node.rOut.setAttribute('cx', gp.x); node.rOut.setAttribute('cy', gp.y);
        node.rOut.setAttribute('rx', rx); node.rOut.setAttribute('ry', ry);
        node.rOut.setAttribute('stroke', ringCol); node.rOut.setAttribute('stroke-width', isSel || isHov ? '2.2' : '1.4');
        node.rOut.setAttribute('opacity', isSel || isHov ? '0.96' : '0.52');
        node.rIn.setAttribute('cx', gp.x); node.rIn.setAttribute('cy', gp.y);
        node.rIn.setAttribute('rx', rx * 0.68); node.rIn.setAttribute('ry', ry * 0.68);
        node.rIn.setAttribute('stroke', ringCol); node.rIn.setAttribute('stroke-width', '1.1');
        node.rIn.setAttribute('opacity', isSel ? '0.82' : '0.32');

        if (u.layer === 'air') {
          oCtx.strokeStyle = 'rgba(104, 200, 255, 0.56)'; oCtx.lineWidth = 1.4; oCtx.setLineDash([4, 4]);
          oCtx.beginPath(); oCtx.moveTo(gp.x, gp.y); oCtx.lineTo(ap.x, ap.y); oCtx.stroke(); oCtx.setLineDash([]);
        }
        // 已下达的航路折线＋终点幽灵框
        if (u.queue.length) {
          let prev = gp;
          oCtx.strokeStyle = ringCol; oCtx.lineWidth = 1.8; oCtx.setLineDash([6, 4]);
          oCtx.beginPath(); oCtx.moveTo(prev.x, prev.y);
          for (const wp of u.queue) {
            const wpp = worldToScreen(wp.x, 0, wp.z);
            oCtx.lineTo(wpp.x, wpp.y); prev = wpp;
          }
          oCtx.stroke(); oCtx.setLineDash([]);
          const last = u.queue[u.queue.length - 1];
          const lp = worldToScreen(last.x, 0, last.z);
          oCtx.strokeStyle = ringCol; oCtx.lineWidth = 1.5;
          oCtx.beginPath(); oCtx.ellipse(lp.x, lp.y, rx * 0.72, ry * 0.72, 0, 0, Math.PI * 2); oCtx.stroke();
        }
      }

      const ay = gp.y + 11;
      node.mark.style.transform = `translate3d(${Math.round(gp.x)}px,${Math.round(ay)}px,0) translate(-50%,0)`;
      node.mark.classList.toggle('is-selected', isSel);
      node.mark.classList.toggle('is-hovered', isHov);
      node.sb.textContent = u.queue.length ? '· 机动' : u.kind === 'cas' ? '· 100m' : '';
      markInputs.push({ id: u.id, ax: gp.x, ay, isHovered: isHov, isSelected: isSel, isActive: u.queue.length > 0 });
    }

    // 实时右键拖动 1:1 线框幽灵预览 + 障碍红警拒收
    if (rightDrag) {
      const actUnits = units.filter(u => selected.has(u.id) && unitAllowed(u));
      const facing = rightDrag.dragging ? Math.atan2(rightDrag.curZ - rightDrag.startZ, rightDrag.curX - rightDrag.startX) : null;
      actUnits.forEach((u, idx) => {
        const spread = actUnits.length > 1 ? (idx - (actUnits.length - 1) * 0.5) * 11 : 0;
        const perpX = facing !== null ? -Math.sin(facing) * spread : spread;
        const perpZ = facing !== null ? Math.cos(facing) * spread : 0;
        const tx = rightDrag.startX + perpX, tz = rightDrag.startZ + perpZ;
        const chk = checkReachable(u, tx, tz);
        const col = chk.valid ? '#f0d372' : '#ff5266';
        const p0 = worldToScreen(u.x, 0, u.z), p1 = worldToScreen(tx, 0, tz);
        oCtx.strokeStyle = col; oCtx.lineWidth = 2.0; oCtx.setLineDash([7, 5]);
        oCtx.beginPath(); oCtx.moveTo(p0.x, p0.y); oCtx.lineTo(p1.x, p1.y); oCtx.stroke(); oCtx.setLineDash([]);
        // 线框幽灵轮廓
        oCtx.save(); oCtx.translate(p1.x, p1.y); oCtx.rotate(facing ?? u.yaw);
        oCtx.fillStyle = chk.valid ? 'rgba(240, 211, 114, 0.22)' : 'rgba(255, 82, 102, 0.24)';
        oCtx.strokeStyle = col; oCtx.lineWidth = 2.0;
        oCtx.fillRect(-13, -8, 26, 16); oCtx.strokeRect(-13, -8, 26, 16);
        oCtx.beginPath(); oCtx.moveTo(13, 0); oCtx.lineTo(24, 0); oCtx.lineTo(19, -4); oCtx.moveTo(24, 0); oCtx.lineTo(19, 4); oCtx.stroke();
        oCtx.restore();
        if (idx === 0) {
          const dist = Math.hypot(tx - u.x, tz - u.z);
          const lbl = chk.valid ? `${Math.round(dist)}m · ${Math.max(1, Math.round(dist / u.maxSpeed))}s` : `✕ ${chk.reason}`;
          oCtx.fillStyle = 'rgba(13,14,19,0.92)'; oCtx.strokeStyle = col; oCtx.lineWidth = 1.2;
          oCtx.beginPath(); oCtx.roundRect(p1.x + 14, p1.y - 22, oCtx.measureText(lbl).width + 16, 19, 4); oCtx.fill(); oCtx.stroke();
          oCtx.fillStyle = col; oCtx.font = '700 10.5px Consolas,monospace'; oCtx.textBaseline = 'middle';
          oCtx.fillText(lbl, p1.x + 21, p1.y - 12);
        }
      });
    }
    oCtx.restore();

    // 应用车底名牌防叠字状态
    const modes = resolveNameplateCollision(markInputs);
    for (const u of units) {
      const node = domCache.get(u.id);
      if (!node || node.mark.style.display === 'none') continue;
      const m = modes.get(u.id) || 'full';
      node.mark.classList.toggle('is-compact', m === 'compact' || m === 'dimmed');
      node.mark.classList.toggle('is-dimmed', m === 'dimmed');
    }

    /* ---- 3. 同步刷新左下微缩雷达小地图 ---- */
    mCtx.fillStyle = '#0e1118'; mCtx.fillRect(0, 0, mmCanvas.width, mmCanvas.height);
    const toMm = (wx, wz) => ({
      x: ((wx - BOUNDS.minX) / (BOUNDS.maxX - BOUNDS.minX)) * mmCanvas.width,
      y: ((wz - BOUNDS.minZ) / (BOUNDS.maxZ - BOUNDS.minZ)) * mmCanvas.height,
    });
    for (const z of ZONES) {
      const mp = toMm(z.x, z.z);
      mCtx.fillStyle = z.col + '33'; mCtx.strokeStyle = z.col; mCtx.lineWidth = 1.2;
      mCtx.beginPath(); mCtx.arc(mp.x, mp.y, 11, 0, Math.PI * 2); mCtx.fill(); mCtx.stroke();
    }
    for (const u of units) {
      const mp = toMm(u.x, u.z);
      mCtx.fillStyle = selected.has(u.id) ? '#f0d372' : u.ch;
      mCtx.beginPath(); mCtx.arc(mp.x, mp.y, selected.has(u.id) ? 3.2 : 2.3, 0, Math.PI * 2); mCtx.fill();
    }

    requestAnimationFrame(renderFrame);
  }

  /* ====== 初始化 ====== */
  renderZones();
  syncSelectedHud();
  requestAnimationFrame(renderFrame);
})();
</script>
</body>
</html>
