*, *::before, *::after { box-sizing: border-box; }
html, body {
  margin: 0; height: 100%; overflow: hidden;
  background: #06070a; color: var(--ui-text-primary);
  font-family: var(--ui-font-sans); font-size: var(--ui-fs-body); line-height: 1.4;
  -webkit-font-smoothing: antialiased; user-select: none;
}
.mono { font-family: var(--ui-font-mono); font-variant-numeric: tabular-nums; }
.display-font { font-family: var(--ui-font-display); letter-spacing: 0.03em; font-weight: 800; }
button, input { font-family: inherit; color: inherit; }
[hidden] { display: none !important; }

/* ====== 外壳视口（支持全屏 / 16:9 1208×680 / 21:9 Hor+ 1588×680） ====== */
.viewport-host {
  width: 100vw; height: 100vh; display: grid; place-items: center;
  background: radial-gradient(circle at 50% 45%, #141720 0%, #050609 85%);
}
.hud-stage {
  position: relative; width: 100%; height: 100%; overflow: hidden;
  background: var(--ui-bg-canvas);
  transition: width 260ms var(--ui-ease-out), height 260ms var(--ui-ease-out);
}
.hud-stage[data-aspect="16:9"] {
  width: min(1208px, calc(100vw - 24px), calc((100vh - 24px) * 16 / 9));
  height: auto; aspect-ratio: 16 / 9;
  border-radius: 10px; border: 1px solid rgba(240, 211, 114, 0.36);
  box-shadow: 0 28px 80px rgba(0, 0, 0, 0.84);
}
.hud-stage[data-aspect="21:9"] {
  width: min(1588px, calc(100vw - 20px), calc((100vh - 24px) * 21 / 9));
  height: auto; aspect-ratio: 21 / 9;
  border-radius: 10px; border: 1px solid rgba(56, 229, 192, 0.38);
  box-shadow: 0 28px 80px rgba(0, 0, 0, 0.84);
}

/* ====== Z-100 双层分离战场（底层 680p 暖滤镜 + 原生 DPR 标绘层） ====== */
.world-3d-canvas {
  position: absolute; inset: 0; width: 100%; height: 100%; z-index: 10;
  image-rendering: pixelated;
  filter: contrast(1.08) saturate(1.10) sepia(0.06);
}
.world-ring-svg, .world-overlay-canvas, .world-ui-layer {
  position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none;
}
.world-ring-svg { z-index: 95; }
.world-overlay-canvas { z-index: 100; }
.world-ui-layer { z-index: 110; overflow: hidden; }
.drag-select-box {
  position: absolute; z-index: 115; pointer-events: none;
  border: 1.5px solid var(--ui-state-select); background: rgba(240, 211, 114, 0.13); border-radius: 3px;
}

/* 车底去框透视名牌与紧凑降级点 */
.ground-mark {
  position: absolute; top: 0; left: 0; pointer-events: auto; cursor: pointer;
  display: inline-flex; align-items: center; gap: 6px;
  padding: var(--mark-pad); border-radius: 5px;
  background: rgba(11, 12, 18, 0.78); border: 1px solid rgba(255, 255, 255, 0.16);
  color: var(--ui-text-primary); font-size: var(--mark-fs); font-weight: 700; white-space: nowrap;
  text-shadow: 0 1px 4px #000000;
  transition: opacity 120ms, border-color 100ms, background 100ms;
}
.ground-mark svg { width: var(--ico-mark); height: var(--ico-mark); flex: 0 0 auto; }
.ground-mark.kind-mbt, .ground-mark.kind-ifv, .ground-mark.kind-supply, .ground-mark.kind-arty { color: var(--ui-ch-ground-inner); }
.ground-mark.kind-attack_heli, .ground-mark.kind-trans_heli { color: var(--ui-ch-heli-inner); }
.ground-mark.kind-cas { color: var(--ui-ch-plane-inner); }
.ground-mark.is-selected { background: rgba(240, 211, 114, 0.20); border-color: var(--ui-state-select); color: var(--ui-state-select-inner); z-index: 5; }
.ground-mark.is-hovered { border-color: #ffffff; z-index: 6; }
.ground-mark.is-compact { padding: 3px 5px; gap: 0; border-radius: 999px; }
.ground-mark.is-compact .mark-name, .ground-mark.is-compact .mark-sub { display: none; }
.ground-mark.is-dimmed { opacity: 0.42; }
.mark-sub { font-family: var(--ui-font-mono); font-size: var(--mark-sub-fs); color: var(--ui-text-secondary); font-weight: 500; }

/* ====== L1 无底框硬黑外描边提示 ＋ 键帽隔离 ====== */
.ui-prompt-btn {
  border: 0; background: transparent; padding: 3px 4px; margin: 0; cursor: pointer;
  display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; flex: 0 0 auto;
  font-size: var(--ui-prompt-fs); line-height: 1.15; pointer-events: auto;
  transition: transform 100ms var(--ui-ease-out);
}
.ui-prompt-btn .p-label {
  color: #ffffff; font-weight: 800; letter-spacing: 0.02em;
  paint-order: stroke fill; -webkit-text-stroke: var(--ui-prompt-stroke) #090a0f;
  text-shadow: 0 2px 5px rgba(0,0,0,0.68);
}
.ui-prompt-btn:hover:not(:disabled) .p-label { color: var(--ui-state-select); }
.ui-prompt-btn:active:not(:disabled) { transform: translateY(1px); }
.ui-prompt-btn.is-active .p-label { color: var(--ui-state-select); }

.ui-keycap {
  display: inline-flex; align-items: center; justify-content: center; flex: 0 0 auto;
  min-width: var(--ui-keycap-sz); height: var(--ui-keycap-sz); padding: 0 6px; border-radius: var(--ui-r-pill);
  background: #ffffff; color: #090a0f; border: 2px solid #090a0f;
  -webkit-text-stroke: 0 !important; text-shadow: none !important;
  font-family: var(--ui-font-mono); font-size: var(--ui-keycap-fs); font-weight: 900; line-height: 1;
}
.ui-keycap--round { width: var(--ui-keycap-sz); height: var(--ui-keycap-sz); padding: 0; }
.ui-keycap--dark { background: rgba(13,14,19,0.92); color: #f5f6f9; border-color: rgba(255,255,255,0.28); }
.ui-prompt-btn.is-active .ui-keycap { background: var(--ui-state-select); color: #090a0f; }

.ui-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  height: var(--ui-btn-h); padding: 0 var(--ui-btn-px); border-radius: var(--ui-r-control);
  border: 1px solid var(--ui-line-base); background: var(--ui-bg-slot); color: var(--ui-text-primary);
  font-size: var(--ui-btn-fs); font-weight: 700; cursor: pointer; white-space: nowrap;
  transition: border-color 100ms, color 100ms, background 100ms;
}
.ui-btn--sm { height: var(--ui-btn-sm-h); padding: 0 11px; font-size: var(--ui-fs-xs); }
.ui-btn:hover:not(:disabled) { border-color: var(--ui-state-select); color: var(--ui-state-select); background: rgba(255,255,255,0.08); }
.ui-btn--accent {
  border-color: rgba(240, 211, 114, 0.48); color: var(--ui-state-select);
  background: rgba(19, 20, 28, 0.92);
}
.ui-btn--accent.is-active { background: var(--ui-accent-grad); color: var(--ui-text-inverse); border-color: transparent; }
.ui-btn--primary { background: var(--ui-accent-grad); color: var(--ui-text-inverse); border-color: transparent; }

/* ====== 常驻战斗 HUD 高透暗实底底座（严禁 backdrop-filter 保 60FPS） ====== */
.hud-pod {
  pointer-events: auto;
  background: var(--ui-bg-pod);
  border: 1px solid var(--ui-line-base);
  border-radius: var(--ui-r-surface);
  box-shadow: var(--ui-rim-top), var(--ui-shadow-pod);
  backdrop-filter: none !important;
  min-width: 0;
}

/* ====== Z-200 三行安全区 CSS Grid 骨架（物理杜绝抽屉压到底栏！） ====== */
.hud-grid {
  position: absolute; inset: 0; z-index: 200; pointer-events: none;
  padding: clamp(8px, 1.2vh, 14px) clamp(10px, 1.3vw, 16px);
  display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: clamp(6px, 1vh, 10px);
  transition: opacity 180ms var(--ui-ease-out);
}
.hud-stage[data-aspect="21:9"] .hud-grid {
  width: 100%; max-width: 1420px; left: 50%; transform: translateX(-50%);
}
.hud-grid.is-hidden-hud { opacity: 0; visibility: hidden; pointer-events: none; }
#hud-restore-chip { position: absolute; left: 16px; bottom: 16px; z-index: 215; }

/* ====== ROW 1：流体三栏顶栏（Flex 两端对齐，物理保证三段间距永远 >= 8px） ====== */
.hud-top {
  display: flex; align-items: center; justify-content: space-between;
  gap: 8px; min-width: 0; pointer-events: none;
}
.hud-top-left { justify-self: start; display: flex; align-items: center; gap: 8px; pointer-events: auto; }
.hud-top-center { justify-self: center; min-width: 0; pointer-events: auto; }
.hud-top-right { justify-self: end; display: flex; align-items: center; gap: var(--top-r-gap); pointer-events: auto; }

.tl-resource {
  display: inline-flex; align-items: center; gap: var(--tl-gap); padding: var(--tl-pad);
  white-space: nowrap;
}
.tl-pts-val { font-family: var(--ui-font-display); font-size: var(--tl-pts-fs); color: var(--ui-state-select); line-height: 0.95; }
.tl-pts-meta { display: flex; flex-direction: column; font-size: var(--tl-meta-fs); color: var(--ui-text-secondary); line-height: 1.25; }
.tl-pts-meta b { color: var(--ui-text-primary); font-family: var(--ui-font-mono); font-size: var(--tl-meta-b-fs); }

.tc-island {
  display: inline-flex; align-items: center; gap: var(--tc-gap); padding: var(--tc-pad); border-radius: var(--ui-r-pill);
  white-space: nowrap;
}
.tc-pause-btn {
  border: 0; background: transparent; padding: 3px 8px; border-radius: var(--ui-r-pill);
  display: inline-flex; align-items: center; gap: 7px; font-size: var(--tc-fs); font-weight: 800;
  color: var(--ui-text-primary); cursor: pointer; white-space: nowrap;
}
.tc-pause-btn:hover { background: rgba(255,255,255,0.09); }
.tc-pause-btn i { width: var(--tc-dot-sz); height: var(--tc-dot-sz); border-radius: 50%; background: var(--ui-state-safe); box-shadow: 0 0 8px var(--ui-state-safe); }
.tc-pause-btn.is-paused i { background: var(--ui-state-warn); box-shadow: 0 0 8px var(--ui-state-warn); }
.tc-sep { width: 1px; height: 18px; background: var(--ui-line-subtle); flex: 0 0 auto; }

.zone-pill {
  border: 1px solid transparent; background: transparent; padding: var(--zone-pad); border-radius: var(--ui-r-sm);
  display: inline-flex; align-items: center; gap: 6px; cursor: pointer;
  color: var(--ui-text-primary); white-space: nowrap; flex: 0 0 auto;
  transition: background 100ms, border-color 100ms;
}
.zone-pill:hover { background: rgba(255,255,255,0.07); border-color: var(--ui-line-subtle); }
.zone-pill i.z-dot { width: 8px; height: 8px; border-radius: 50%; flex: 0 0 auto; }
.zone-pill strong { font-size: var(--tc-fs); font-weight: 800; color: var(--ui-text-primary); white-space: nowrap; }
.zone-cap-bar { width: var(--zone-bar-w); height: 5px; border-radius: 99px; background: rgba(255,255,255,0.14); overflow: hidden; flex: 0 0 auto; }
.zone-cap-bar > i { display: block; height: 100%; }
.zone-pill span.z-meta { font-family: var(--ui-font-mono); font-size: var(--zone-meta-fs); color: var(--ui-text-secondary); white-space: nowrap; }
.tc-fps { font-family: var(--ui-font-mono); font-size: var(--zone-meta-fs); color: var(--ui-state-select); white-space: nowrap; }

/* ====== ROW 2：中间安全走廊（左右滑出抽屉物理限高 max-height: 100% 永不溢出底栏） ====== */
.hud-middle {
  display: flex; justify-content: space-between; align-items: flex-start; gap: 12px;
  min-height: 0; min-width: 0; pointer-events: none;
}
.mid-left, .mid-right { display: flex; align-items: flex-start; gap: 10px; height: 100%; min-height: 0; pointer-events: none; }

/* 《断箭》极窄左侧兵种分类轨（宽随尺码无损放大） */
.cat-rail {
  pointer-events: auto; width: var(--cat-rail-w); max-height: 100%; padding: var(--cat-pad);
  display: flex; flex-direction: column; gap: 4px; overflow-y: auto; scrollbar-width: none; flex: 0 0 auto;
}
.cat-rail::-webkit-scrollbar { display: none; }
.cat-btn {
  border: 1px solid transparent; border-radius: var(--ui-r-control);
  background: transparent; color: var(--ui-text-secondary); padding: var(--cat-btn-pad);
  display: flex; flex-direction: column; align-items: flex-start; gap: 3px;
  cursor: pointer; transition: background 100ms, color 100ms;
}
.cat-btn:hover:not(.active) { background: rgba(255,255,255,0.07); color: var(--ui-text-primary); }
.cat-btn.active { background: #ffffff; color: var(--ui-text-inverse); }
.cat-btn-top { width: 100%; display: flex; align-items: center; justify-content: space-between; font-size: var(--cat-top-fs); font-weight: 800; }
.cat-btn-name { display: flex; align-items: center; gap: 5px; font-size: var(--cat-name-fs); font-weight: 800; white-space: nowrap; }
.cat-dot { width: var(--cat-dot-sz); height: var(--cat-dot-sz); border-radius: 50%; }

/* 滑出单位名册抽屉（不透明 #14151e 实底 + 物理限高 max-height: 100%） */
.roster-flyout {
  pointer-events: auto; width: var(--roster-w); max-height: 100%; padding: 13px 14px;
  background: var(--ui-bg-pod-elevated); border: 1px solid var(--ui-line-base);
  border-radius: var(--ui-r-surface); box-shadow: var(--ui-rim-top), var(--ui-shadow-pod);
  display: flex; flex-direction: column; gap: 10px;
}
.roster-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex: 0 0 auto; }
.roster-head h3 { margin: 0; font-size: var(--roster-h3-fs); color: var(--ui-state-select); }
.roster-sub { font-size: var(--ui-fs-xs); color: var(--ui-text-muted); }
.roster-grid {
  display: grid; grid-template-columns: 1fr 1fr; gap: 7px; flex: 1 1 auto; min-height: 0;
  overflow-y: auto; scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.16) transparent;
}
.r-card {
  border: 1px solid var(--ui-line-subtle); border-left: 3px solid var(--rc-ch, var(--ui-ch-ground));
  border-radius: var(--ui-r-control); background: var(--ui-bg-card); color: var(--ui-text-primary);
  padding: var(--r-card-pad); text-align: left; cursor: pointer; display: flex; flex-direction: column; gap: 4px;
}
.r-card:hover { background: rgba(255,255,255,0.10); }
.r-card.selected { background: var(--ui-select-sweep); color: var(--ui-text-inverse); border-color: transparent; border-left-color: var(--rc-ch); }
.r-card-top { display: flex; align-items: center; justify-content: space-between; gap: 4px; font-size: var(--r-card-top-fs); font-weight: 800; }
.r-card-sub { font-size: var(--r-card-sub-fs); opacity: 0.80; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* 延迟掉血双段 HP 条 */
.hp-track {
  position: relative; height: 5px; border-radius: 3px;
  background: rgba(8, 9, 14, 0.94); border: 1px solid #07080c; overflow: hidden;
}
.hp-track--lg { height: var(--hp-lg-h); border-radius: var(--ui-r-sm); }
.hp-trail { position: absolute; left: 0; top: 0; bottom: 0; background: #ffffff; opacity: 0.88; transition: width 0.45s var(--ui-ease-out) 0.16s; }
.hp-fill { position: absolute; left: 0; top: 0; bottom: 0; transition: width 0.14s, background 0.18s; }
.hp-bonus { position: absolute; top: 0; bottom: 0; background: #68c8ff; border-left: 1.5px solid #ffffff; transition: left 0.14s, width 0.2s; }
@keyframes alert-pulse {
  0%, 100% { box-shadow: 0 0 0 1px var(--ui-state-danger); border-color: var(--ui-state-danger); }
  50% { box-shadow: 0 0 12px 1px rgba(255, 82, 102, 0.50); border-color: #ff8c9a; }
}
.is-critical { animation: alert-pulse 0.85s ease-in-out infinite; }

/* 右滑出后方增援与演示抽屉（不透明 #14151e 实底 + 物理限高 max-height: 100%） */
.reinf-drawer {
  pointer-events: auto; width: var(--drawer-w); max-height: 100%; padding: 14px 16px;
  background: var(--ui-bg-pod-elevated); border: 1px solid var(--ui-line-base);
  border-radius: var(--ui-r-surface); box-shadow: var(--ui-rim-top), var(--ui-shadow-pod);
  display: flex; flex-direction: column; gap: 10px;
}
.drawer-list { flex: 1 1 auto; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 7px; scrollbar-width: thin; }
.reinf-item {
  display: flex; align-items: center; justify-content: space-between; gap: 9px;
  padding: var(--reinf-pad); border-radius: var(--ui-r-control);
  background: rgba(255,255,255,0.045); border: 1px solid var(--ui-line-subtle);
}
.reinf-item svg { width: var(--ico-reinf); height: var(--ico-reinf); flex: 0 0 auto; }
.reinf-item strong { display: block; font-size: var(--reinf-name-fs); }
.reinf-item span { display: block; font-size: var(--reinf-sub-fs); color: var(--ui-text-muted); }

/* 三档无损物理尺码切换分段条 */
.size-switch-row {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding-top: 8px; border-top: 1px solid var(--ui-line-subtle);
}
.size-switch-lbl { font-size: var(--ui-fs-xs); font-weight: 700; color: var(--ui-text-secondary); white-space: nowrap; }
.size-seg {
  display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 3px; flex: 1;
  padding: 3px; border-radius: var(--ui-r-control);
  background: rgba(11, 12, 18, 0.90); border: 1px solid var(--ui-line-subtle);
}
.size-seg-btn {
  border: 0; border-radius: var(--ui-r-sm); height: var(--ui-btn-sm-h); padding: 0 6px;
  background: transparent; color: var(--ui-text-secondary); font-size: var(--ui-fs-xs); font-weight: 700;
  cursor: pointer; white-space: nowrap; transition: background 100ms, color 100ms;
}
.size-seg-btn:hover:not(.active) { background: rgba(255,255,255,0.08); color: var(--ui-text-primary); }
.size-seg-btn.active { background: #ffffff; color: var(--ui-text-inverse); }

.demo-strip { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; padding-top: 8px; border-top: 1px solid var(--ui-line-subtle); }
.ui-check {
  appearance: none; -webkit-appearance: none; margin: 0; flex: 0 0 auto;
  width: var(--chk-sz); height: var(--chk-sz); border-radius: 4px; cursor: pointer; position: relative;
  background: rgba(11, 12, 18, 0.88); border: 1.5px solid rgba(255, 255, 255, 0.30);
}
.ui-check:checked { background: var(--ui-state-select); border-color: var(--ui-state-select); }
.ui-check:checked::after {
  content: ""; position: absolute; left: 28%; top: 10%; width: 32%; height: 58%;
  border: solid #0d0e13; border-width: 0 2.2px 2.2px 0; transform: rotate(42deg);
}

/* ====== ROW 3：底部双翼分离（底中完全贯通净空！） ====== */
.hud-bottom {
  display: flex; justify-content: space-between; align-items: flex-end; gap: 12px;
  min-width: 0; pointer-events: none;
}
.bl-wing { display: flex; flex-direction: column; align-items: flex-start; gap: 7px; min-width: 0; pointer-events: none; }
.bl-wing > * { pointer-events: auto; }
.br-wing { display: flex; align-items: flex-end; justify-content: flex-end; gap: 10px; min-width: 0; pointer-events: none; }
.br-wing > * { pointer-events: auto; }

.bl-toast {
  max-width: min(560px, 46vw); padding: var(--bl-toast-pad); border-radius: var(--ui-r-pill);
  display: inline-flex; align-items: center; gap: 8px; font-size: var(--bl-toast-fs); color: var(--ui-text-primary);
}
.bl-toast i { width: 8px; height: 8px; border-radius: 50%; background: var(--ui-state-select); flex: 0 0 auto; }
.bl-toast span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* 《红龙》空中直达快选条（支持矮屏自动收折为 L1 描边按钮） */
.air-comm-wrap { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.air-comm-strip {
  display: inline-flex; align-items: center; gap: 5px; padding: 4px 6px; border-radius: var(--ui-r-control);
}
.air-chip {
  border: 1px solid var(--ui-line-subtle); border-radius: 4px; padding: var(--air-chip-pad);
  background: var(--ui-bg-card); color: var(--ui-text-secondary);
  display: inline-flex; align-items: center; gap: 6px; font-size: var(--air-chip-fs); font-weight: 700;
  cursor: pointer; white-space: nowrap;
}
.air-chip svg { width: var(--ico-sm); height: var(--ico-sm); flex: 0 0 auto; }
.air-chip:hover { background: rgba(255,255,255,0.12); color: #ffffff; }
.air-chip.active { background: #ffffff; color: var(--ui-text-inverse); border-color: #ffffff; }

.bl-main-row { display: flex; align-items: flex-end; gap: 10px; min-width: 0; }
.mm-cg-pair { display: flex; align-items: flex-end; gap: 7px; flex: 0 0 auto; }
.minimap-shell { display: flex; flex-direction: column; gap: 5px; width: var(--mm-w); flex: 0 0 auto; }
.minimap-head { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
.layer-pills {
  display: inline-flex; gap: 3px; padding: 3px; border-radius: var(--ui-r-control);
}
.mm-tool {
  border: 0; border-radius: 4px; height: var(--mm-tool-h); padding: 0 var(--mm-tool-px); background: transparent;
  color: var(--ui-text-secondary); font-size: var(--mm-tool-fs); font-weight: 700; cursor: pointer; white-space: nowrap;
}
.mm-tool.active { background: #ffffff; color: var(--ui-text-inverse); }
.minimap-box {
  position: relative; width: var(--mm-w); height: var(--mm-h); border-radius: var(--ui-r-surface);
  overflow: hidden; background: #10131a; border: 1px solid var(--ui-line-strong);
  box-shadow: var(--ui-shadow-pod); cursor: crosshair;
}
#minimap-canvas { width: 100%; height: 100%; display: block; }
.mm-hint { position: absolute; left: 8px; bottom: 5px; font-family: var(--ui-font-mono); font-size: var(--mm-hint-fs); color: rgba(255,255,255,0.62); pointer-events: none; }

/* 竖直 1~6 快捷编组条 */
.cg-strip {
  display: grid; grid-template-rows: repeat(6, minmax(0, 1fr)); gap: 3px; height: var(--mm-h); padding: 4px;
  border-radius: var(--ui-r-control); flex: 0 0 auto;
}
.cg-btn {
  position: relative; width: var(--cg-w); border: 0; border-radius: 4px; background: rgba(255,255,255,0.06);
  color: var(--ui-text-muted); font-family: var(--ui-font-mono); font-size: var(--cg-fs); font-weight: 800;
  display: grid; place-items: center; cursor: pointer; padding: 0;
}
.cg-btn.has-unit { color: var(--ui-text-primary); background: rgba(255,255,255,0.13); }
.cg-btn.has-unit::after { content: ""; position: absolute; right: 2px; top: 2px; width: 4.5px; height: 4.5px; border-radius: 50%; background: var(--ui-state-select); }
.cg-btn.active { background: #ffffff; color: var(--ui-text-inverse); }

/* 动态多选矩阵托盘（仅多选 >= 2 时显示） */
.multi-tray {
  width: var(--tray-w); max-height: var(--mm-h); padding: 9px 10px;
  display: flex; flex-direction: column; gap: 6px; flex: 0 0 auto;
}
.multi-tray-head { display: flex; justify-content: space-between; align-items: center; font-size: var(--ui-fs-sm); color: var(--ui-text-secondary); }
.multi-tray-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 5px; flex: 1 1 auto; min-height: 0; overflow-y: auto; scrollbar-width: none; }
.multi-tray-grid::-webkit-scrollbar { display: none; }
.m-chip {
  border: 1px solid transparent; border-radius: 4px; background: var(--ui-bg-card); padding: 5px 3px;
  cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 3px; color: var(--ui-text-primary);
}
.m-chip svg { width: var(--ico-sm); height: var(--ico-sm); flex: 0 0 auto; }
.m-chip.focused { border-color: var(--ui-state-select); background: var(--ui-state-select-fill); color: var(--ui-state-select); }
.m-chip span { font-family: var(--ui-font-mono); font-size: var(--tray-chip-fs); white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }

/* 右下翼左侧：动态单选详情卡（空选隐藏） */
.inspector-card {
  width: var(--insp-w); padding: var(--insp-pad); display: flex; flex-direction: column; gap: var(--insp-gap); flex: 0 0 auto;
}
.insp-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-width: 0; }
.insp-title { display: flex; align-items: center; gap: 9px; min-width: 0; }
.insp-ico { width: var(--insp-ico-box); height: var(--insp-ico-box); border-radius: var(--ui-r-control); background: rgba(255,255,255,0.07); display: grid; place-items: center; flex: 0 0 auto; }
.insp-ico svg { width: var(--insp-ico-svg); height: var(--insp-ico-svg); display: block; }
.insp-name { min-width: 0; }
.insp-name strong { display: block; font-size: var(--insp-title-fs); color: var(--ui-state-select); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.insp-name small { display: block; font-size: var(--insp-sub-fs); color: var(--ui-text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.insp-hp-val { font-size: var(--insp-hp-fs); font-weight: 900; flex: 0 0 auto; }
.insp-hp-row { display: flex; align-items: center; gap: 8px; }
.insp-hp-row .hp-track { flex: 1; }
.insp-wep-roe { display: flex; align-items: center; justify-content: space-between; gap: 7px; }
.wep-pill {
  border: 1px solid var(--ui-line-base); border-radius: var(--ui-r-sm); padding: var(--wep-pad);
  background: rgba(11,12,18,0.88); color: var(--ui-text-secondary); font-size: var(--wep-fs);
  cursor: pointer; white-space: nowrap; flex: 0 0 auto;
}
.wep-pill.active { border-color: var(--ui-state-select); color: var(--ui-state-select); background: var(--ui-state-select-fill); font-weight: 700; }

/* 定制战术下拉 .ui-select（自动向上弹出 .is-dropup） */
.ui-select { position: relative; min-width: var(--roe-w); flex: 0 0 auto; }
.ui-select-trigger {
  width: 100%; height: var(--roe-h); padding: 0 9px;
  display: flex; align-items: center; justify-content: space-between; gap: 6px;
  background: rgba(11, 12, 18, 0.92); border: 1px solid var(--ui-line-base);
  border-radius: var(--ui-r-sm); color: var(--ui-text-primary); font-size: var(--roe-fs); font-weight: 700;
  cursor: pointer; white-space: nowrap;
}
.ui-select.is-open .ui-select-trigger { border-color: var(--ui-state-select); box-shadow: 0 0 0 2px var(--ui-state-select-fill); }
.ui-select-val { display: inline-flex; align-items: center; gap: 6px; }
.ui-select-dot { width: 7px; height: 7px; border-radius: 50%; flex: 0 0 auto; }
.ui-select-chev { width: 13px; height: 13px; color: var(--ui-text-muted); transition: transform 150ms; }
.ui-select.is-open .ui-select-chev { transform: rotate(180deg); color: var(--ui-state-select); }
.ui-select-menu {
  position: absolute; top: calc(100% + 5px); right: 0; min-width: 100%; width: max-content; max-width: 280px;
  z-index: 95; padding: 5px; border-radius: 8px;
  background: var(--ui-bg-pod-elevated); border: 1px solid rgba(240, 211, 114, 0.36);
  box-shadow: var(--ui-rim-top), 0 14px 32px rgba(0, 0, 0, 0.80);
  display: flex; flex-direction: column; gap: 3px;
}
.ui-select.is-dropup .ui-select-menu { top: auto; bottom: calc(100% + 6px); right: 0; }
.ui-select-option {
  position: relative; width: 100%; padding: 7px 10px 7px 12px;
  border: 1px solid transparent; border-radius: var(--ui-r-sm);
  background: transparent; color: var(--ui-text-secondary); font-size: var(--roe-opt-fs); text-align: left;
  cursor: pointer;
}
.ui-select-option:hover, .ui-select-option.is-focused { background: rgba(255,255,255,0.08); color: var(--ui-text-primary); }
.ui-select-option[aria-selected="true"] {
  background: rgba(240, 211, 114, 0.13); border-color: rgba(240, 211, 114, 0.34);
  color: var(--ui-state-select); font-weight: 700;
}
.ui-select-option[aria-selected="true"]::before {
  content: ""; position: absolute; left: 2px; top: 4px; bottom: 4px; width: 3px; border-radius: 2px; background: var(--ui-state-select);
}
.ui-select-option-sub { display: block; font-size: var(--roe-sub-fs); color: var(--ui-text-muted); font-weight: 400; }

/* 最右下角：精简去重 3×2 实战命令盘（原生变量大热区） */
.cmd-grid-shell {
  width: var(--cmd-shell-w); padding: var(--cmd-pad); display: flex; flex-direction: column; gap: 8px; flex: 0 0 auto;
}
.cmd-grid-head { display: flex; justify-content: space-between; align-items: center; font-size: var(--cmd-head-fs); color: var(--ui-text-muted); }
.cmd-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--cmd-gap); }
.cmd-cell {
  position: relative; height: var(--cmd-cell-h); border: 1px solid var(--ui-line-base); border-radius: var(--ui-r-control);
  background: var(--ui-bg-slot); color: var(--ui-text-primary); padding: 6px 5px;
  display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 2px;
  cursor: pointer; overflow: visible; transition: border-color 100ms, background 100ms;
}
.cmd-cell:hover:not(:disabled):not(.is-locked):not(.is-empty):not(.is-cooling) { border-color: var(--ui-state-select); background: rgba(255,255,255,0.09); }
.cmd-cell.is-active-mode { border-color: var(--ui-state-safe); background: rgba(60, 214, 159, 0.14); }
.cmd-cell .c-kbd { position: absolute; left: 6px; top: 4px; font-family: var(--ui-font-mono); font-size: var(--cmd-kbd-fs); font-weight: 900; color: var(--ui-text-secondary); }
.cmd-cell .c-charge {
  position: absolute; right: 5px; top: 4px; font-family: var(--ui-font-mono); font-size: var(--cmd-chg-fs); font-weight: 800;
  padding: 1px 5px; border-radius: 3px; background: rgba(13,14,19,0.9); border: 1px solid var(--ui-line-base);
}
.cmd-cell.is-low .c-charge { border-color: var(--ui-state-warn); color: var(--ui-state-warn); }

.cmd-cell .c-sub { font-size: var(--cmd-sub-fs); color: var(--ui-text-muted); white-space: nowrap; }
.cmd-cell.is-locked {

  border-color: rgba(255,255,255,0.10);

/* 冷却扇形遮罩（冷却期彻底隐藏底层文字防重影） */
.cd-mask {
  position: absolute; inset: 0; border-radius: var(--ui-r-control); z-index: 3;
  display: grid; place-items: center; pointer-events: none;

.cd-sec { font-family: var(--ui-font-mono); font-size: var(--cmd-cd-fs); font-weight: 900; color: #ffffff; text-shadow: 0 2px 8px #000000; }
.cmd-cell.is-cooling { cursor: wait; border-color: var(--ui-line-subtle); }

.tip-bubble {
  position: absolute; bottom: calc(100% + 8px); right: 0; padding: 6px 10px;

  font-size: var(--tip-fs); box-shadow: 0 8px 20px rgba(0,0,0,0.68); z-index: 45;
  opacity: 0; transition: opacity 100ms;
}
.cmd-cell:hover .tip-bubble { opacity: 1; }

.wheel-backdrop, .pause-overlay {

.wheel-backdrop { z-index: 300; background: rgba(6, 7, 11, 0.44); backdrop-filter: blur(6px); }
.wheel-ring { position: relative; width: var(--wheel-w); height: var(--wheel-h); }
.wheel-center {

}
.wheel-center strong { font-size: var(--ui-fs-body); color: var(--ui-state-select); }
.wheel-center span { font-size: var(--ui-fs-xs); color: var(--ui-text-secondary); margin-top: 3px; }
.wheel-slot {
  position: absolute; transform: translate(-50%, -50%);
  width: var(--wheel-slot-w); height: var(--wheel-slot-h); border-radius: var(--ui-r-sm);
  background: var(--ui-bg-pod-elevated); border: 1px solid var(--ui-line-base);
  color: var(--ui-text-primary); cursor: pointer; overflow: hidden;

}
.wheel-slot .w-bar { width: 100%; padding: 3px 0; font-size: var(--wheel-bar-fs); font-weight: 800; text-align: center; background: rgba(255,255,255,0.06); color: var(--ui-text-secondary); }
.wheel-slot:hover, .wheel-slot.active { border-color: #ffffff; transform: translate(-50%, -50%) scale(1.06); z-index: 2; }
.wheel-slot:hover .w-bar, .wheel-slot.active .w-bar { background: #ffffff; color: var(--ui-text-inverse); }

.pause-overlay { z-index: 400; background: rgba(6, 7, 11, 0.72); backdrop-filter: blur(18px); }
.pause-card {

  background: var(--ui-bg-overlay-glass); border: 1px solid var(--ui-line-base);

/* ====== Z-500 Toast 队列（上限 2 条；右抽屉展开时自动左让防挡关闭键） ====== */
.toast-stack { position: absolute; top: var(--toast-top); right: 16px; z-index: 500; display: flex; flex-direction: column; gap: 7px; pointer-events: none; transition: right 180ms var(--ui-ease-out); }

  function worldToScreen(wx, wy, wz) {
    const w = stageEl.clientWidth, h = stageEl.clientHeight, ppm = h / cam.span;
    const dx = wx - cam.cx, dz = wz - cam.cz, c = Math.cos(cam.angle), s = Math.sin(cam.angle);
    return { x: w * 0.5 + (dx * c - dz * s) * ppm, y: h * 0.5 + (dx * s + dz * c) * SIN_TILT * ppm - wy * COS_TILT * ppm, ppm };
  }
  function screenToWorld(sx, sy) {

  function rectsOverlap(a, b, m) {
    return !(a.right + m <= b.left || a.left - m >= b.right || a.bottom + m <= b.top || a.top - m >= b.bottom);
  }
  function resolveNameplateCollision(items) {
    const rank = it => (it.isHovered ? 4 : it.isSelected ? 3 : it.isActive ? 2 : 1);
    const ordered = [...items].sort((a, b) => rank(b) - rank(a) || a.id.localeCompare(b.id));
    const occFull = [], occHigh = [], occComp = [], res = new Map();
    const sz = stageEl.dataset.uiSize || 'lg';
    const baseSelW = sz === 'xl' ? 128 : sz === 'compact' ? 102 : 118;
    const baseNorW = sz === 'xl' ? 82 : sz === 'compact' ? 66 : 76;
    const fh = sz === 'xl' ? 24 : sz === 'compact' ? 20 : 22;
    const cw = sz === 'compact' ? 22 : 26, ch = sz === 'compact' ? 18 : 22;
    for (const it of ordered) {
      const p = rank(it), fw = it.isSelected || it.isHovered ? baseSelW : baseNorW;
      const ax = it.ax, ay = it.ay;
      const fRect = { left: ax - fw * 0.5, right: ax + fw * 0.5, top: ay, bottom: ay + fh };
      const cRect = { left: ax - cw * 0.5, right: ax + cw * 0.5, top: ay, bottom: ay + ch };
      if (p >= 3) { occFull.push(fRect); occHigh.push(fRect); res.set(it.id, 'full'); continue; }
      if (!occFull.some(r => rectsOverlap(fRect, r, 3))) { occFull.push(fRect); res.set(it.id, 'full'); continue; }
      if (!occHigh.some(r => rectsOverlap(cRect, r, 3)) && !occComp.some(c => Math.hypot(ax - c.x, ay - c.y) < 10)) {
        occComp.push({ x: ax, y: ay }); res.set(it.id, 'compact');
      } else res.set(it.id, 'dimmed');
    }
    return res;
  }

  const selects = [];
  function closeAllSelects(except = null) { for (const s of selects) if (s.el !== except) s.close(); }
  function bindSelect(id, onChange) {
    const box = document.getElementById(id), trig = box.querySelector('.ui-select-trigger'), menu = box.querySelector('.ui-select-menu');
    const opts = Array.from(box.querySelectorAll('.ui-select-option')), txtEl = box.querySelector('.ui-select-txt'), dotEl = box.querySelector('.ui-select-trigger .ui-select-dot');
    const close = () => { box.classList.remove('is-open'); menu.hidden = true; trig.setAttribute('aria-expanded', 'false'); };
    const open = () => {
      closeAllSelects(box);
      const tRect = trig.getBoundingClientRect(), sRect = stageEl.getBoundingClientRect();
      box.classList.toggle('is-dropup', Math.min(window.innerHeight, sRect.bottom) - tRect.bottom < 185);
      box.classList.add('is-open'); menu.hidden = false; trig.setAttribute('aria-expanded', 'true');
    };
    const setValue = (val, emit = false) => {
      const target = opts.find(o => o.dataset.val === val) || opts[0];
      opts.forEach(o => o.setAttribute('aria-selected', String(o === target)));
      box.dataset.value = target.dataset.val;
      const fullTxt = target.querySelector('span')?.textContent || '';
      if (txtEl) txtEl.textContent = fullTxt.split('·')[0].trim();
      if (dotEl && target.dataset.dot) dotEl.style.color = target.dataset.dot;
      if (emit && onChange) onChange(target.dataset.val, fullTxt);
    };
    trig.addEventListener('click', e => { e.stopPropagation(); menu.hidden ? open() : close(); });
    opts.forEach(o => o.addEventListener('click', e => { e.stopPropagation(); setValue(o.dataset.val, true); close(); trig.focus(); }));
    const api = { el: box, isOpen: () => !menu.hidden, close, setValue };
    selects.push(api);
    return api;
  }

    bCtx.fillStyle = 'rgba(255, 82, 102, 0.16)'; bCtx.strokeStyle = 'rgba(255, 82, 102, 0.72)'; bCtx.lineWidth = 1.5; bCtx.setLineDash([6, 4]);

      node.mark.classList.toggle('is-dimmed', m === 'dimmed');
    }

    // 3. 左下雷达
    mCtx.fillStyle = '#0e1118'; mCtx.fillRect(0, 0, mmCanvas.width, mmCanvas.height);
    const mmScale = mmCanvas.width / 212;
    const toMm = (wx, wz) => ({ x: ((wx - BOUNDS.minX) / (BOUNDS.maxX - BOUNDS.minX)) * mmCanvas.width, y: ((wz - BOUNDS.minZ) / (BOUNDS.maxZ - BOUNDS.minZ)) * mmCanvas.height });
    for (const z of ZONES) { const mp = toMm(z.x, z.z); mCtx.fillStyle = z.col + '33'; mCtx.strokeStyle = z.col; mCtx.lineWidth = 1.4 * mmScale; mCtx.beginPath(); mCtx.arc(mp.x, mp.y, 12 * mmScale, 0, Math.PI * 2); mCtx.fill(); mCtx.stroke(); }
    for (const u of units) { const mp = toMm(u.x, u.z); mCtx.fillStyle = selected.has(u.id) ? '#f0d372' : u.ch; mCtx.beginPath(); mCtx.arc(mp.x, mp.y, (selected.has(u.id) ? 3.4 : 2.5) * mmScale, 0, Math.PI * 2); mCtx.fill(); }

    requestAnimationFrame(renderFrame);
  }

  /* ====== 初始化 ====== */
  renderZones();
  syncAllUI();
  resizeAll();
  requestAnimationFrame(renderFrame);
})();
</script>
</body>
</html>
