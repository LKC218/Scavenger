<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <link rel="icon" href="data:," />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>程序化载具自动化视觉验证夹具 · stylized-680p-v1</title>
  <link rel="stylesheet" href="/ui/令牌.css" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 1208px;
      height: 680px;
      overflow: hidden;
      background: #141916;
    }
    #stage {
      width: 1208px;
      height: 680px;
      display: block;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "/vendor/build/three.module.js",
        "three/addons/": "/vendor/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="stage"></div>
  <script type="module">
    import * as THREE from 'three';
    import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
    import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
    import {KTX2Loader} from 'three/addons/loaders/KTX2Loader.js';
    import {MeshoptDecoder} from 'three/addons/libs/meshopt_decoder.module.js';
    import {RENDER_STYLE_BASELINE, applyStylized680pCanvas} from '/src/程序化地图/渲染基线.mjs';
    import {ProceduralVehicleLoader} from '/src/程序化载具/载具流式加载器.mjs';

    const params = new URLSearchParams(location.search);
    const mode = params.get('source') || 'loose';
    const baseUrl = params.get('base') || '/v1';
    const archiveBaseUrl = params.get('archive') || '/v3';

    const stage = document.getElementById('stage');
    const renderer = new THREE.WebGLRenderer({
      antialias: RENDER_STYLE_BASELINE.webgl.antialias,
      preserveDrawingBuffer: true,
      powerPreference: 'high-performance',
    });
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = RENDER_STYLE_BASELINE.webgl.exposure;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFShadowMap;
    applyStylized680pCanvas(renderer, '16:9');
    renderer.domElement.style.width = '1208px';
    renderer.domElement.style.height = '680px';
    stage.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    const bgDefault = new THREE.Color(0x2d352e);
    const bgSilhouette = new THREE.Color(0x000000);
    scene.background = bgDefault;

    const pmrem = new THREE.PMREMGenerator(renderer);
    const studioEnv = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
    scene.environment = studioEnv;
    scene.environmentIntensity = 0.72;

    const hemi = new THREE.HemisphereLight(0xedf2e4, 0x5c6655, 1.05);
    const sun = new THREE.DirectionalLight(0xfff1dc, 2.5);
    sun.position.set(18, 28, 16);
    sun.castShadow = true;
    sun.shadow.mapSize.set(1024, 1024);
    sun.shadow.camera.near = 1;
    sun.shadow.camera.far = 120;
    sun.shadow.camera.left = -22;
    sun.shadow.camera.right = 22;
    sun.shadow.camera.top = 22;
    sun.shadow.camera.bottom = -22;
    sun.shadow.bias = -0.0004;
    scene.add(hemi, sun);

    const camera = new THREE.PerspectiveCamera(34, 1208 / 680, 0.1, 1500);
    const holder = new THREE.Group();
    scene.add(holder);

    const whiteOverride = new THREE.MeshBasicMaterial({color: 0xffffff, side: THREE.DoubleSide});
    const procLoader = new ProceduralVehicleLoader(renderer, {mode, baseUrl, archiveBaseUrl});

    const refKtx = new KTX2Loader().setTranscoderPath('/vendor/examples/jsm/libs/basis/').setWorkerLimit(2).detectSupport(renderer);
    const refLoader = new GLTFLoader().setKTX2Loader(refKtx).setMeshoptDecoder(MeshoptDecoder);

    let currentObj = null;
    let currentRefBounds = null;

    function clearHolder() {
      if (!currentObj) return;
      holder.remove(currentObj);
      if (currentObj.userData.disposeAll) {
        currentObj.traverse(o => {
          if (!o.isMesh) return;
          o.geometry?.dispose();
          const ms = Array.isArray(o.material) ? o.material : [o.material];
          for (const m of ms) {
            m?.map?.dispose();
            m?.normalMap?.dispose();
            m?.roughnessMap?.dispose();
            m?.metalnessMap?.dispose();
            m?.dispose();
          }
        });
      }
      currentObj = null;
    }

    function setCameraView(viewName, bounds) {
      const min = new THREE.Vector3(...bounds.min);
      const max = new THREE.Vector3(...bounds.max);
      const center = min.clone().add(max).multiplyScalar(0.5);
      const size = max.clone().sub(min);
      const radius = Math.max(1.2, size.length() * 0.5);

      const distClose = radius * 2.65;
      const distSide = radius * 2.75;
      const distNear = radius * 3.8;
      const distMid = radius * 6.8;

      const dirs = {
        closeup_fl: new THREE.Vector3(-0.72, 0.42, -0.72).normalize().multiplyScalar(distClose),
        closeup_br: new THREE.Vector3(0.72, 0.42, 0.72).normalize().multiplyScalar(distClose),
        side: new THREE.Vector3(1.0, 0.08, 0.0).normalize().multiplyScalar(distSide),
        top: new THREE.Vector3(0.0, 1.0, 0.04).normalize().multiplyScalar(distSide),
        tactical_near: new THREE.Vector3(-0.55, 0.85, -0.55).normalize().multiplyScalar(distNear),
        tactical_mid: new THREE.Vector3(-0.55, 0.85, -0.55).normalize().multiplyScalar(distMid),
      };
      const offset = dirs[viewName] || dirs.closeup_fl;
      camera.position.copy(center).add(offset);
      camera.lookAt(center);
      camera.updateProjectionMatrix();
      camera.updateMatrixWorld(true);
    }

    function renderFrame(silhouette = false) {
      scene.background = silhouette ? bgSilhouette : bgDefault;
      scene.overrideMaterial = silhouette ? whiteOverride : null;
      renderer.render(scene, camera);
      scene.overrideMaterial = null;
      return renderer.domElement.toDataURL('image/png');
    }

    window.__VEH_VIS__ = {
      ready: true,
      baseline: RENDER_STYLE_BASELINE.id,
      async init() {
        await procLoader.loadIndex();
        if (mode === 'archive') await procLoader.ensureFarBase();
        return true;
      },
      async loadReference(url, bounds, unifySimplePbr = true) {
        clearHolder();
        const gltf = await refLoader.loadAsync(url);
        if (unifySimplePbr) {
          // 保留原件 100% 高模拓扑 + 原高清底色/法线贴图，仅对齐已批准的去 AO/MR 标量化材质口径，精准度量减面与图集保真度
          gltf.scene.traverse(o => {
            if (!o.isMesh) return;
            const ms = Array.isArray(o.material) ? o.material : [o.material];
            for (const m of ms) {
              if (!m) continue;
              if (m.aoMap) { m.aoMap.dispose(); m.aoMap = null; }
              if (m.roughnessMap) { m.roughnessMap.dispose(); m.roughnessMap = null; m.roughness = 0.72; }
              if (m.metalnessMap) { m.metalnessMap.dispose(); m.metalnessMap = null; m.metalness = 0.16; }
              m.needsUpdate = true;
            }
          });
        }
        gltf.scene.userData.disposeAll = true;
        holder.add(gltf.scene);
        currentObj = gltf.scene;
        currentRefBounds = bounds;
        return true;
      },
      async loadOptimized(slug, lodLevel, bounds) {
        clearHolder();
        const parsed = await procLoader.loadVehicleLod(slug, lodLevel);
        const inst = parsed.scene.clone(true);
        inst.userData.disposeAll = false;
        holder.add(inst);
        currentObj = inst;
        currentRefBounds = bounds;
        return {
          slots: Object.keys(parsed.slots),
          bytes: parsed.bytes,
        };
      },
      setSlotAngle(slotName, axis, deg) {
        if (!currentObj) return false;
        const target = currentObj.getObjectByName(slotName);
        if (!target) return false;
        const rad = (deg * Math.PI) / 180;
        target.rotation.set(0, 0, 0);
        if (axis === 'x') target.rotation.x = rad;
        else if (axis === 'z') target.rotation.z = rad;
        else target.rotation.y = rad;
        target.updateMatrixWorld(true);
        return true;
      },
      capture(viewName, silhouette = false) {
        setCameraView(viewName, currentRefBounds);
        return renderFrame(silhouette);
      },
      clearCache() {
        clearHolder();
        procLoader.clearDetailCache();
        return renderer.info.memory;
      },
      getStats() {
        return {
          loader: procLoader.stats,
          memory: renderer.info.memory,
          render: renderer.info.render,
        };
      },
    };
  </script>
</body>
</html>
