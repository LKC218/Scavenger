<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <link rel="icon" href="data:," />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>程序化载具 · 单车展示与拉帘对比台 (680p 复古微缩 Stylized)</title>
  <link rel="stylesheet" href="/ui/令牌.css" />
  <link rel="stylesheet" href="/ui/组件.css" />
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
      background: var(--ui-bg-canvas); color: var(--ui-text-primary);
      font-family: var(--ui-font-sans); user-select: none;
    }
    .app-shell {
      width: 100%; height: 100%; display: grid;
      grid-template-columns: 276px 1fr;
    }
    .sidebar {
      display: flex; flex-direction: column; height: 100%;
      background: var(--ui-bg-pod-elevated);
      border-right: 1px solid var(--ui-line-base);
      z-index: 20; overflow: hidden;
    }
    .side-head {
      padding: 12px 12px 10px;
      border-bottom: 1px solid var(--ui-line-subtle);
    }
    .side-title {
      font-size: var(--ui-fs-lg); font-weight: 700; letter-spacing: 0.04em;
      display: flex; align-items: center; justify-content: space-between;
    }
    .side-sub {
      font-size: var(--ui-fs-xs); color: var(--ui-text-muted); margin-top: 3px;
    }
    .search-box {
      margin-top: 8px; width: 100%; padding: 6px 9px;
      background: var(--ui-bg-slot); color: var(--ui-text-primary);
      border: 1px solid var(--ui-line-base); border-radius: var(--ui-radius-xs);
      font-size: var(--ui-fs-sm); outline: none;
    }
    .search-box:focus { border-color: var(--ui-state-select); }
    .filter-row {
      display: flex; gap: 4px; margin-top: 8px;
    }
    .filter-row button {
      flex: 1; padding: 4px 0; font-size: var(--ui-fs-xs);
      background: var(--ui-bg-slot); color: var(--ui-text-secondary);
      border: 1px solid var(--ui-line-subtle); border-radius: var(--ui-radius-xs);
      cursor: pointer;
    }
    .filter-row button.active {
      background: var(--ui-state-select-fill); color: var(--ui-state-select);
      border-color: var(--ui-state-select); font-weight: 600;
    }
    .veh-list {
      flex: 1; overflow-y: auto; padding: 6px;
    }
    .veh-item {
      display: flex; align-items: center; gap: 8px;
      padding: 7px 8px; margin-bottom: 4px;
      background: var(--ui-bg-slot);
      border: 1px solid transparent; border-radius: var(--ui-radius-xs);
      cursor: pointer; transition: border-color var(--ui-dur-fast) var(--ui-ease-out);
    }
    .veh-item:hover { background: var(--ui-bg-hover); }
    .veh-item.active {
      border-color: var(--ui-state-select);
      background: var(--ui-state-select-fill);
    }
    .veh-icon { width: 18px; height: 18px; flex: 0 0 18px; }
    .veh-meta { min-width: 0; flex: 1; }
    .veh-name {
      font-size: var(--ui-fs-sm); font-weight: 600;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .veh-sub {
      font-size: var(--ui-fs-2xs); color: var(--ui-text-muted);
      font-family: var(--ui-font-mono); display: flex; justify-content: space-between;
    }
    .badge-partial {
      color: var(--ui-state-warn); font-weight: 600;
    }
    .viewport-area {
      position: relative; width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      background: #0d120f; overflow: hidden;
    }
    #aspect-frame {
      position: relative; background: #1c221d;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.72);
      overflow: hidden;
    }
    #aspect-frame canvas {
      width: 100% !important; height: 100% !important; display: block;
    }
    /* 原生高清 HUD 叠加层（严格双层分离，不叠加 3D 像素/复古滤镜） */
    .hud-layer {
      position: absolute; inset: 0; pointer-events: none; z-index: 15;
    }
    .hud-top {
      position: absolute; top: 10px; left: 10px; right: 10px;
      display: flex; justify-content: space-between; align-items: flex-start; gap: 10px;
    }
    .hud-card {
      pointer-events: auto; padding: 7px 10px;
      display: flex; align-items: center; gap: 6px; flex-wrap: nowrap;
    }
    #cur-title {
      font-size: 13px; max-width: 210px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .hud-btn {
      padding: 4px 9px; font-size: var(--ui-fs-xs); cursor: pointer;
      background: var(--ui-bg-slot); color: var(--ui-text-secondary);
      border: 1px solid var(--ui-line-base); border-radius: var(--ui-radius-xs);
    }
    .hud-btn:hover { background: var(--ui-bg-hover); color: var(--ui-text-primary); }
    .hud-btn.active {
      background: var(--ui-state-select-fill); color: var(--ui-state-select);
      border-color: var(--ui-state-select); font-weight: 600;
    }
    .hud-link {
      text-decoration: none; display: inline-flex; align-items: center;
    }
    .hud-bottom {
      position: absolute; bottom: 10px; left: 10px; right: 10px;
      display: flex; justify-content: space-between; align-items: flex-end; gap: 10px;
    }
    .metrics-grid {
      display: grid; grid-template-columns: repeat(4, auto); gap: 6px 16px;
      font-size: var(--ui-fs-xs); font-family: var(--ui-font-mono);
    }
    .m-label { color: var(--ui-text-muted); font-size: var(--ui-fs-2xs); display: block; }
    .m-val { color: var(--ui-text-primary); font-weight: 600; }
    .m-val.good { color: var(--ui-state-select); }
    /* 拉帘分割线 */
    #split-line {
      position: absolute; top: 0; bottom: 0; width: 2px;
      background: var(--ui-state-select); z-index: 12; pointer-events: none;
      display: none;
    }
    #split-tag-l, #split-tag-r {
      position: absolute; top: 56px; padding: 3px 8px;
      font-size: var(--ui-fs-xs); font-family: var(--ui-font-mono);
      background: var(--ui-bg-pod); border: 1px solid var(--ui-line-base);
      display: none;
    }
    #split-tag-l { left: 12px; color: var(--ui-state-warn); }
    #split-tag-r { right: 12px; color: var(--ui-state-select); }
    #split-slider {
      position: absolute; bottom: 86px; left: 50%; transform: translateX(-50%);
      width: 260px; pointer-events: auto; display: none; accent-color: var(--ui-state-select);
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "/vendor/build/three.module.js",
        "three/addons/": "/vendor/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="side-head">
        <div class="side-title">
          <span>程序化载具库</span>
          <span class="ui-mono" id="count-tag" style="font-size:11px;color:var(--ui-state-select)">0</span>
        </div>
        <div class="side-sub">单源同源三档 LOD · 680p 复古微缩基线</div>
        <input id="search-input" class="search-box" type="search" placeholder="搜索型号 / 稳定ID…" />
        <div class="filter-row">
          <button data-filter="all" class="active">全部</button>
          <button data-filter="ground">地面</button>
          <button data-filter="air">空中</button>
          <button data-filter="movable">含可动件</button>
        </div>
      </div>
      <div id="veh-list" class="veh-list"></div>
    </aside>

    <main class="viewport-area" id="viewport-area">
      <div id="aspect-frame">
        <div id="split-line"></div>
        <div class="hud-layer">
          <div class="hud-top">
            <div class="ui-pod hud-card">
              <strong id="cur-title" style="font-size:13px;">加载中…</strong>
              <span class="ui-divider"></span>
              <button class="hud-btn active" data-lod="0">LOD0 展示</button>
              <button class="hud-btn" data-lod="1">LOD1 中景</button>
              <button class="hud-btn" data-lod="2">LOD2 远景</button>
              <span class="ui-divider"></span>
              <button class="hud-btn" id="btn-compare">原版拉帘对比: 关</button>
              <button class="hud-btn" id="btn-motion">部件演示: 关</button>
              <button class="hud-btn" id="btn-wire">线框: 关</button>
            </div>
            <div class="ui-pod hud-card">
              <button class="hud-btn active" data-aspect="16:9">16:9 (1208×680)</button>
              <button class="hud-btn" data-aspect="21:9">21:9 (1588×680)</button>
              <span class="ui-divider"></span>
              <a class="hud-btn hud-link" href="/battlefield">混编演训场</a>
              <a class="hud-btn hud-link" href="/report">验收报告</a>
            </div>
          </div>

          <div id="split-tag-l">左侧：原版 256 基线</div>
          <div id="split-tag-r">右侧：新版程序化 LOD0 (1024+法线)</div>
          <input id="split-slider" type="range" min="10" max="90" value="50" />

          <div class="hud-bottom">
            <div class="ui-pod hud-card" style="padding:7px 12px;">
              <div class="metrics-grid">
                <div><span class="m-label">当前面数</span><span class="m-val good" id="m-tris">-</span></div>
                <div><span class="m-label">DrawCall / 槽位</span><span class="m-val" id="m-dc">-</span></div>
                <div><span class="m-label">单车体积 (vs旧256)</span><span class="m-val good" id="m-bytes">-</span></div>
                <div><span class="m-label">FPS / 帧耗时</span><span class="m-val" id="m-fps">-</span></div>
              </div>
            </div>
            <div class="ui-pod hud-card" style="font-size:11px;color:var(--ui-text-secondary);">
              左键拖动 360° 旋转 · 滚轮缩放 · 空格启停部件演示
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
    import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
    import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
    import {KTX2Loader} from 'three/addons/loaders/KTX2Loader.js';
    import {MeshoptDecoder} from 'three/addons/libs/meshopt_decoder.module.js';
    import {
      RENDER_STYLE_BASELINE,
      applyStylized680pCanvas,
      getStandardAspectSpec,
      layoutAspectFrameBox,
    } from '/src/程序化地图/渲染基线.mjs';
    import {VEHICLE_SILHOUETTES} from '/ui/图标与标绘.mjs';
    import {ProceduralVehicleLoader} from '/src/程序化载具/载具流式加载器.mjs';

    const urlParams = new URLSearchParams(location.search);
    const sourceMode = urlParams.get('source') || 'archive';
    const baseUrl = urlParams.get('base') || '/v2';
    const archiveBaseUrl = urlParams.get('archive') || '/v3';

    const viewportArea = document.getElementById('viewport-area');
    const aspectFrame = document.getElementById('aspect-frame');
    let currentAspect = urlParams.get('aspect') === '21:9' ? '21:9' : '16:9';

    const renderer = new THREE.WebGLRenderer({
      antialias: RENDER_STYLE_BASELINE.webgl.antialias,
      powerPreference: 'high-performance',
    });
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = RENDER_STYLE_BASELINE.webgl.exposure;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFShadowMap;
    renderer.setScissorTest(false);
    aspectFrame.prepend(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1f2621);
    const sceneRef = new THREE.Scene();
    sceneRef.background = new THREE.Color(0x1f2621);

    const pmrem = new THREE.PMREMGenerator(renderer);
    const studioEnv = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
    scene.environment = studioEnv;
    scene.environmentIntensity = 0.78;
    sceneRef.environment = studioEnv;
    sceneRef.environmentIntensity = 0.78;

    function buildLights(targetScene) {
      const hemi = new THREE.HemisphereLight(0xedf2e4, 0x525c4c, 1.0);
      const sun = new THREE.DirectionalLight(0xfff1dc, 2.5);
      sun.position.set(16, 26, 15);
      sun.castShadow = true;
      sun.shadow.mapSize.set(1024, 1024);
      sun.shadow.camera.near = 1;
      sun.shadow.camera.far = 120;
      sun.shadow.camera.left = -20;
      sun.shadow.camera.right = 20;
      sun.shadow.camera.top = 20;
      sun.shadow.camera.bottom = -20;
      sun.shadow.bias = -0.0004;
      const ground = new THREE.Mesh(
        new THREE.CircleGeometry(36, 48),
        new THREE.MeshStandardMaterial({color: 0x262e28, roughness: 0.92, metalness: 0.05}),
      );
      ground.rotation.x = -Math.PI / 2;
      ground.receiveShadow = true;
      const grid = new THREE.GridHelper(40, 20, 0x455848, 0x2d3a30);
      grid.position.y = 0.01;
      targetScene.add(hemi, sun, ground, grid);
      return {ground, grid};
    }
    const stageMain = buildLights(scene);
    const stageRef = buildLights(sceneRef);

    const camera = new THREE.PerspectiveCamera(34, 16 / 9, 0.1, 1500);
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;

    function updateAspectLayout() {
      const spec = applyStylized680pCanvas(renderer, currentAspect);
      const box = layoutAspectFrameBox(spec.ratio, viewportArea.clientWidth - 16, viewportArea.clientHeight - 16);
      aspectFrame.style.width = `${box.width}px`;
      aspectFrame.style.height = `${box.height}px`;
      camera.aspect = spec.ratio;
      camera.updateProjectionMatrix();
      document.querySelectorAll('[data-aspect]').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.aspect === currentAspect);
      });
    }
    new ResizeObserver(updateAspectLayout).observe(viewportArea);
    updateAspectLayout();

    const procLoader = new ProceduralVehicleLoader(renderer, {mode: sourceMode, baseUrl, archiveBaseUrl});
    const refKtx = new KTX2Loader().setTranscoderPath('/vendor/examples/jsm/libs/basis/').setWorkerLimit(2).detectSupport(renderer);
    const refLoader = new GLTFLoader().setKTX2Loader(refKtx).setMeshoptDecoder(MeshoptDecoder);

    let allVehicles = [];
    let baselineBySlug = new Map();
    let currentFilter = 'all';
    let currentSlug = null;
    let currentLod = 0;
    let compareEnabled = false;
    let splitRatio = 0.5;
    let motionEnabled = false;
    let wireEnabled = false;

    let activeGroup = null;
    let activeRefGroup = null;
    let activeMeta = null;

    function makeSilhouetteSvg(role) {
      const key = role === 'ground' ? 'tank' : role === 'rotorcraft' ? 'heli' : 'plane';
      const color = role === 'ground' ? 'var(--ui-ch-ground)' : role === 'rotorcraft' ? 'var(--ui-ch-heli)' : 'var(--ui-ch-plane)';
      return `<svg class="veh-icon" viewBox="0 0 24 24" aria-hidden="true"><path fill="${color}" fill-rule="evenodd" d="${VEHICLE_SILHOUETTES[key]}"/></svg>`;
    }

    function renderVehicleList() {
      const q = document.getElementById('search-input').value.trim().toLowerCase();
      const filtered = allVehicles.filter(v => {
        const cat = v.cat === 'g' || v.category === 'ground' ? 'ground' : 'air';
        const hasMov = (v.sl && v.sl.length > 0) || (v.slots && v.slots.length > 1);
        if (currentFilter === 'ground' && cat !== 'ground') return false;
        if (currentFilter === 'air' && cat !== 'air') return false;
        if (currentFilter === 'movable' && !hasMov) return false;
        if (q && !`${v.name} ${v.id} ${v.slug}`.toLowerCase().includes(q)) return false;
        return true;
      });
      document.getElementById('count-tag').textContent = `${filtered.length}/${allVehicles.length}`;
      const host = document.getElementById('veh-list');
      host.innerHTML = filtered
        .map(v => {
          const isPartial = v.st === 'R' || v.quality_status === 'partial';
          const tris = v.t ? v.t[0] : v.lod0_tris;
          return `<div class="veh-item ${v.slug === currentSlug ? 'active' : ''}" data-slug="${v.slug}">
            ${makeSilhouetteSvg(v.role)}
            <div class="veh-meta">
              <div class="veh-name">${v.name}</div>
              <div class="veh-sub"><span>${tris.toLocaleString()} 面</span>${isPartial ? '<span class="badge-partial">PARTIAL</span>' : `<span>DC ${v.dc ?? v.draw_calls}</span>`}</div>
            </div>
          </div>`;
        })
        .join('');
      host.querySelectorAll('.veh-item').forEach(el => {
        el.addEventListener('click', () => selectVehicle(el.dataset.slug));
      });
    }

    function applyWireframe(root, enabled) {
      if (!root) return;
      root.traverse(o => {
        if (!o.isMesh) return;
        const ms = Array.isArray(o.material) ? o.material : [o.material];
        for (const m of ms) if (m && 'wireframe' in m) m.wireframe = enabled;
      });
    }

    function disposeRefGroup() {
      if (!activeRefGroup) return;
      sceneRef.remove(activeRefGroup);
      activeRefGroup.traverse(o => {
        if (!o.isMesh) return;
        o.geometry?.dispose();
        const ms = Array.isArray(o.material) ? o.material : [o.material];
        for (const m of ms) {
          m?.map?.dispose();
          m?.normalMap?.dispose();
          m?.dispose();
        }
      });
      activeRefGroup = null;
    }

    async function loadRefForCompare(slug) {
      disposeRefGroup();
      const baseRec = baselineBySlug.get(slug);
      if (!baseRec) return;
      const rel = baseRec.current_256_path.replace(/^local-data\/资源库\/当前资源\/模型\//, '');
      const gltf = await refLoader.loadAsync(`/ref256/${rel}`);
      gltf.scene.traverse(o => {
        if (o.isMesh) {
          o.castShadow = true;
          o.receiveShadow = true;
        }
      });
      sceneRef.add(gltf.scene);
      activeRefGroup = gltf.scene;
    }

    async function selectVehicle(slug, lod = currentLod, resetCamera = true) {
      currentSlug = slug;
      currentLod = lod;
      renderVehicleList();

      const rec = allVehicles.find(v => v.slug === slug);
      if (!rec) return;
      activeMeta = await procLoader.loadVehicleMeta(slug);
      const parsed = await procLoader.loadVehicleLod(slug, lod);

      if (activeGroup) scene.remove(activeGroup);
      activeGroup = parsed.scene.clone(true);
      activeGroup.traverse(o => {
        if (o.isMesh) {
          o.castShadow = true;
          o.receiveShadow = true;
        }
      });
      applyWireframe(activeGroup, wireEnabled);
      scene.add(activeGroup);

      const bMin = activeMeta.b ? activeMeta.b[0] : activeMeta.bounds.min;
      const bMax = activeMeta.b ? activeMeta.b[1] : activeMeta.bounds.max;
      stageMain.ground.position.y = bMin[1] - 0.01;
      stageMain.grid.position.y = bMin[1];
      stageRef.ground.position.y = bMin[1] - 0.01;
      stageRef.grid.position.y = bMin[1];

      if (resetCamera) {
        const cx = (bMin[0] + bMax[0]) * 0.5;
        const cy = (bMin[1] + bMax[1]) * 0.5;
        const cz = (bMin[2] + bMax[2]) * 0.5;
        const r = Math.max(1.8, Math.hypot(bMax[0] - bMin[0], bMax[1] - bMin[1], bMax[2] - bMin[2]) * 0.5);
        controls.target.set(cx, cy, cz);
        camera.position.set(cx - r * 1.9, cy + r * 1.05, cz - r * 1.9);
        controls.update();
      }

      if (compareEnabled) {
        await loadRefForCompare(slug);
      }

      const trisArr = activeMeta.t || [activeMeta.lods.lod0.triangles, activeMeta.lods.lod1.triangles, activeMeta.lods.lod2.triangles];
      const dcVal = activeMeta.dc ?? activeMeta.lods.lod0.drawCalls;
      const slotsList = activeMeta.sl ? ['hull', ...activeMeta.sl.map(s => s[0])] : activeMeta.slots.map(s => s.slot);
      const oldBytes = activeMeta.b256 || activeMeta.baseline_256_bytes || 0;
      document.getElementById('cur-title').textContent = `${rec.name} (${rec.id})`;
      document.getElementById('m-tris').textContent = `${trisArr[lod].toLocaleString()} (LOD${lod})`;
      document.getElementById('m-dc').textContent = `${dcVal} / ${slotsList.join('+')}`;
      document.getElementById('m-bytes').textContent = `${(parsed.bytes / 1024).toFixed(1)}KB 几何 (旧 ${(oldBytes / 1024).toFixed(0)}KB)`;
      document.getElementById('split-tag-r').textContent = `右侧：新版 LOD${lod} (${trisArr[lod].toLocaleString()}面)`;
      document.querySelectorAll('[data-lod]').forEach(b => b.classList.toggle('active', Number(b.dataset.lod) === lod));
      return true;
    }

    function syncSplitUI() {
      const sl = document.getElementById('split-line');
      const tl = document.getElementById('split-tag-l');
      const tr = document.getElementById('split-tag-r');
      const sr = document.getElementById('split-slider');
      sl.style.display = compareEnabled ? 'block' : 'none';
      tl.style.display = compareEnabled ? 'block' : 'none';
      tr.style.display = compareEnabled ? 'block' : 'none';
      sr.style.display = compareEnabled ? 'block' : 'none';
      sl.style.left = `${splitRatio * 100}%`;
    }

    document.getElementById('search-input').addEventListener('input', renderVehicleList);
    document.querySelectorAll('[data-filter]').forEach(btn => {
      btn.addEventListener('click', () => {
        currentFilter = btn.dataset.filter;
        document.querySelectorAll('[data-filter]').forEach(b => b.classList.toggle('active', b === btn));
        renderVehicleList();
      });
    });
    document.querySelectorAll('[data-lod]').forEach(btn => {
      btn.addEventListener('click', () => {
        if (currentSlug) selectVehicle(currentSlug, Number(btn.dataset.lod), false);
      });
    });
    document.querySelectorAll('[data-aspect]').forEach(btn => {
      btn.addEventListener('click', () => {
        currentAspect = btn.dataset.aspect;
        updateAspectLayout();
      });
    });
    document.getElementById('btn-compare').addEventListener('click', async e => {
      compareEnabled = !compareEnabled;
      e.target.classList.toggle('active', compareEnabled);
      e.target.textContent = `原版拉帘对比: ${compareEnabled ? '开' : '关'}`;
      syncSplitUI();
      if (compareEnabled && currentSlug) await loadRefForCompare(currentSlug);
      else disposeRefGroup();
    });
    document.getElementById('split-slider').addEventListener('input', e => {
      splitRatio = Number(e.target.value) / 100;
      syncSplitUI();
    });
    document.getElementById('btn-motion').addEventListener('click', e => {
      motionEnabled = !motionEnabled;
      e.target.classList.toggle('active', motionEnabled);
      e.target.textContent = `部件演示: ${motionEnabled ? '开' : '关'}`;
    });
    document.getElementById('btn-wire').addEventListener('click', e => {
      wireEnabled = !wireEnabled;
      e.target.classList.toggle('active', wireEnabled);
      e.target.textContent = `线框: ${wireEnabled ? '开' : '关'}`;
      applyWireframe(activeGroup, wireEnabled);
    });
    window.addEventListener('keydown', e => {
      if (e.code === 'Space' && document.activeElement?.tagName !== 'INPUT') {
        e.preventDefault();
        document.getElementById('btn-motion').click();
      }
    });

    // 主渲染循环 + 实时帧统计
    let lastT = performance.now();
    let fpsAcc = 0, fpsFrames = 0;
    let animPhase = 0;
    const frameTimes = [];

    function animate(now) {
      requestAnimationFrame(animate);
      const dt = Math.min(0.1, (now - lastT) / 1000);
      lastT = now;
      const ms = dt * 1000;
      frameTimes.push(ms);
      if (frameTimes.length > 600) frameTimes.shift();

      fpsAcc += dt;
      fpsFrames += 1;
      if (fpsAcc >= 0.4) {
        const fps = fpsFrames / fpsAcc;
        document.getElementById('m-fps').textContent = `${fps.toFixed(1)} FPS / ${(1000 / Math.max(1, fps)).toFixed(2)}ms`;
        fpsAcc = 0;
        fpsFrames = 0;
      }

      if (motionEnabled && activeGroup) {
        animPhase += dt;
        const turret = activeGroup.getObjectByName('turret');
        const barrel = activeGroup.getObjectByName('barrel');
        const radar = activeGroup.getObjectByName('radar');
        const mainRotor = activeGroup.getObjectByName('main_rotor');
        const tailRotor = activeGroup.getObjectByName('tail_rotor');
        const gun = activeGroup.getObjectByName('gun');
        const tYaw = Math.sin(animPhase * 0.9) * 1.1;
        if (turret) turret.rotation.y = tYaw;
        if (barrel) {
          if (!barrel.userData.basePos) barrel.userData.basePos = barrel.position.clone();
          if (turret) {
            const dx = barrel.userData.basePos.x - turret.position.x;
            const dy = barrel.userData.basePos.y - turret.position.y;
            const dz = barrel.userData.basePos.z - turret.position.z;
            const c = Math.cos(tYaw), s = Math.sin(tYaw);
            barrel.position.set(
              turret.position.x + dx * c + dz * s,
              turret.position.y + dy,
              turret.position.z - dx * s + dz * c,
            );
            barrel.rotation.order = 'YXZ';
            barrel.rotation.y = tYaw;
          }
          barrel.rotation.x = Math.sin(animPhase * 1.3) * 0.16;
        }
        if (radar) radar.rotation.y = animPhase * 2.4;
        if (mainRotor) mainRotor.rotation.y = animPhase * 14.0;
        if (tailRotor) {
          const tailSlotMeta = activeMeta?.sl?.find(s => s[0] === 'tail_rotor') || activeMeta?.slots?.find(s => s.slot === 'tail_rotor');
          const tailAxis = Array.isArray(tailSlotMeta) ? tailSlotMeta[2] : tailSlotMeta?.axis;
          if (tailAxis === 'y') tailRotor.rotation.y = -animPhase * 14.0;
          else tailRotor.rotation.x = animPhase * 24.0;
        }
        if (gun) gun.rotation.y = Math.sin(animPhase * 1.4) * 0.7;
      }

      controls.update();
      const spec = getStandardAspectSpec(currentAspect);
      if (compareEnabled && activeRefGroup) {
        const splitX = Math.round(spec.width * splitRatio);
        renderer.setScissorTest(true);
        renderer.setScissor(0, 0, splitX, spec.height);
        renderer.setViewport(0, 0, spec.width, spec.height);
        renderer.render(sceneRef, camera);
        renderer.setScissor(splitX, 0, spec.width - splitX, spec.height);
        renderer.render(scene, camera);
        renderer.setScissorTest(false);
      } else {
        renderer.setScissorTest(false);
        renderer.setViewport(0, 0, spec.width, spec.height);
        renderer.render(scene, camera);
      }
    }
    requestAnimationFrame(animate);

    async function boot() {
      const idx = await procLoader.loadIndex();
      if (sourceMode === 'archive') await procLoader.ensureFarBase();
      allVehicles = idx.vehicles;
      try {
        const b0 = await (await fetch('/v0/基线凭证.json')).json();
        for (const v of b0.vehicles) baselineBySlug.set(v.slug, v);
      } catch {}
      renderVehicleList();
      const initSlug = urlParams.get('slug') || (allVehicles.find(v => v.slug === 'US_M1A2') || allVehicles[0])?.slug;
      if (initSlug) await selectVehicle(initSlug, 0, true);
      window.__VEH_SHOWCASE__ = {
        ready: true,
        baseline: RENDER_STYLE_BASELINE.id,
        getVehicleCount: () => allVehicles.length,
        getSlugs: () => allVehicles.map(v => v.slug),
        selectVehicle: (slug, lod = 0) => selectVehicle(slug, lod, true),
        setAspect: a => { currentAspect = a; updateAspectLayout(); },
        setMotion: on => { motionEnabled = Boolean(on); },
        clearDetailCache: () => {
          if (activeGroup) {
            scene.remove(activeGroup);
            activeGroup = null;
          }
          procLoader.clearDetailCache();
        },
        sampleFrameTimes: () => [...frameTimes],
        resetFrameTimes: () => { frameTimes.length = 0; },
        getMemory: () => ({
          ...renderer.info.memory,
          calls: renderer.info.render.calls,
          triangles: renderer.info.render.triangles,
          loader: procLoader.stats,
          jsHeap: performance.memory?.usedJSHeapSize || 0,
        }),
      };
    }
    boot();
  </script>
</body>
</html>
