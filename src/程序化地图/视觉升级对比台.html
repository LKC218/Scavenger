  <script type="module">

    const FADE_OPTIONS = [
      {
        id: 'bayer_legacy',
        title: '对照：当前原版（低频 8×8 Bayer 纱窗）',
        tag: '现状痛点',
        tagCls: 'bad',
        desc: '复现图 3 问题：规则低频 Bayer 网格在 1080p 下把屋顶和墙面打成明显的“白色点阵纱窗/铁丝网”，观感生硬杂乱。',
        meta: '8×8 Bayer Matrix Discard · 强规则网格伪影',
      },
      {
        id: 'ign_complementary',
        title: 'T1 · 高频 IGN / 蓝噪声互补溶解（零网格）',
        tag: '极低开销',
        tagCls: '',
        desc: '用 Interleaved Gradient Noise 蓝噪声级高频分布替代棋盘格，并采用“近景 > 阈值 / 远景 <= 阈值”互补交接，彻底消除方格纱窗和露底空洞。',
        meta: 'Interleaved Gradient Noise · 互补双层像素交接 · 纯 Opaque',
      },
      {
        id: 'depth_soft_alpha',
        title: 'T2 · Depth-Prepass 柔和真透明淡变（零噪点）',
        tag: '电影级干净',
        tagCls: '',
        desc: '完全抛弃像素打孔噪点！先执行只写深度的 Depth-Prepass（杜绝建筑内墙穿透明露馅），再做丝滑的连续 Alpha 柔和淡入淡出，画面纯净无任何颗粒感。',
        meta: 'Depth-Prepass + True Soft Alpha Cross-Fade · 0 颗粒/0 纱窗',
      },
      {
        id: 'geo_morph_solid',
        title: 'T3 · 实体无缝形变（细节沉降 + 材质渐变）',
        tag: '强烈推荐 · 硬核RTS',
        tagCls: 'rec',
        desc: '建筑主体全程 100% 实心不透明、不打孔、不虚化！仅将屋顶细碎构件（天窗/空调机/女儿墙）高度平滑收拢沉入主体屋顶，同时贴图细节平滑柔化为远景简洁色调，完全无过渡违和感。',
        meta: '100% Solid Geometry Morph + Detail Melt · 0 透明/0 噪点/0 闪烁',
      },
      {
        id: 'staggered_haze',
        title: 'T4 · 按栋微错峰 + 柔雾大气淡化（微缩景深感）',
        tag: '推荐 · 写实氛围',
        tagCls: 'rec',
        desc: '每栋建筑按世界坐标微错峰进入过渡（避免整片街区齐刷刷变幻），配合 Depth-Prepass 柔和淡变与柔和的大气透视柔焦，拉远时整座城区如微缩沙盘自然退入远景。',
        meta: 'Per-Building Stagger + Depth-Prepass Alpha + Aerial Haze',
      },
    ];

    // ==================== 渲染器初始化（1080p 基准） ====================
    const host = document.getElementById('canvas-host');
    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance', preserveDrawingBuffer: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    host.appendChild(renderer.domElement);

    const camera = new THREE.PerspectiveCamera(34, window.innerWidth / window.innerHeight, 0.5, 2000);
    const camState = {
      target: new THREE.Vector3(0, 0, 0),
      dist: 95,
      yaw: 0.42,
      tiltDeg: 48,
    };

    function updateCamera() {
      const tilt = THREE.MathUtils.degToRad(camState.tiltDeg);
      const horiz = Math.cos(tilt) * camState.dist;
      const vert = Math.sin(tilt) * camState.dist;
      camera.position.set(
        camState.target.x + Math.sin(camState.yaw) * horiz,
        camState.target.y + vert,
        camState.target.z + Math.cos(camState.yaw) * horiz
      );
      camera.lookAt(camState.target);
    }

    // 通用环境与灯光构造函数
    function addLights(scene) {
      scene.background = new THREE.Color(0x283223);
      scene.fog = new THREE.FogExp2(0x3a4635, 0.0014);
      const hemi = new THREE.HemisphereLight(0xf3f7e8, 0x5c6b4e, 1.35);
      scene.add(hemi);
      const sun = new THREE.DirectionalLight(0xffe9c4, 3.1);
      sun.position.set(-75, 118, 60);
      sun.castShadow = true;
      sun.shadow.mapSize.set(2048, 2048);
      sun.shadow.camera.left = -95;
      sun.shadow.camera.right = 95;
      sun.shadow.camera.top = 95;
      sun.shadow.camera.bottom = -95;
      sun.shadow.camera.near = 10;
      sun.shadow.camera.far = 320;
      sun.shadow.bias = -0.0005;
      sun.shadow.normalBias = 0.04;
      scene.add(sun);
    }

    // 简单 2D 确定性哈希与 FBM 地形起伏
    function hash2(x, z) {
      const s = Math.sin(x * 127.1 + z * 311.7) * 43758.5453123;
      return s - Math.floor(s);
    }
    function valueNoise(x, z) {
      const ix = Math.floor(x), iz = Math.floor(z);
      const fx = x - ix, fz = z - iz;
      const ux = fx * fx * (3 - 2 * fx), uz = fz * fz * (3 - 2 * fz);
      const a = hash2(ix, iz), b = hash2(ix + 1, iz);
      const c = hash2(ix, iz + 1), d = hash2(ix + 1, iz + 1);
      return a + (b - a) * ux + (c - a) * uz + (a - b - c + d) * ux * uz;
    }
    function fbm(x, z) {
      return valueNoise(x, z) * 0.55 + valueNoise(x * 2.13 + 7.1, z * 2.13 - 3.4) * 0.30 + valueNoise(x * 4.4 - 2.2, z * 4.4 + 5.7) * 0.15;
    }

    // 斜穿公路距离函数（用于草地场景避开柏油路）
    function distToRoad(x, z) {
      // 直线方程: 0.45 * x + z = -22
      return Math.abs(0.45 * x + z + 22.0) / Math.hypot(0.45, 1.0);
    }
    function terrainH(x, z) {
      const dr = distToRoad(x, z);
      const roadFlatten = THREE.MathUtils.smoothstep(dr, 5.5, 13.0);
      const h = (fbm(x * 0.022, z * 0.022) - 0.45) * 4.8;
      return h * roadFlatten;
    }

    // ==================== 场景 1：开源草地模拟对比场景 ====================
    const grassScene = new THREE.Scene();
    addLights(grassScene);

    const grassUniforms = {
      uTime: { value: 0 },
      uWindStrength: { value: 1.0 },
    };

    // 1.1 构建微起伏草坡与斜穿公路底图纹理
    function createGroundBaseTexture() {
      const size = 512;
      const canvas = document.createElement('canvas');
      canvas.width = size; canvas.height = size;
      const ctx = canvas.getContext('2d');
      const img = ctx.createImageData(size, size);
      for (let y = 0; y < size; y++) {
        for (let x = 0; x < size; x++) {
          const wx = (x / size - 0.5) * 140;
          const wz = (y / size - 0.5) * 140;
          const dr = distToRoad(wx, wz);
          const n1 = fbm(wx * 0.06, wz * 0.06);
          const n2 = valueNoise(wx * 0.35, wz * 0.35);

          let r, g, b;
          if (dr < 5.2) {
            // 柏油道路
            const edge = THREE.MathUtils.smoothstep(dr, 3.8, 5.2);
            const asphalt = 74 + (n2 - 0.5) * 16 + edge * 18;
            r = asphalt * 0.98; g = asphalt * 0.97; b = asphalt * 0.94;
            // 中心虚线
            if (dr < 0.25 && ((Math.floor((wx - wz * 0.45) * 0.4) & 1) === 0)) {
              r = 212; g = 205; b = 178;
            }
          } else if (0.45 * wx + wz + 22.0 < -5.2) {
            // 公路上方水泥机坪/硬质硬化区（还原图1右上角水泥地）
            const c = 158 + (n2 - 0.5) * 16 + (n1 - 0.5) * 12;
            r = c * 1.02; g = c * 1.00; b = c * 0.94;
          } else {
            // 草坡生态底色（自然草绿+干草微黄+湿润泥土过渡）
            const lush = THREE.MathUtils.smoothstep(n1, 0.28, 0.72);
            const rSoil = 138, gSoil = 128, bSoil = 88;
            const rLush = 72, gLush = 98, bLush = 44;
            r = THREE.MathUtils.lerp(rSoil, rLush, lush) + (n2 - 0.5) * 14;
            g = THREE.MathUtils.lerp(gSoil, gLush, lush) + (n2 - 0.5) * 16;
            b = THREE.MathUtils.lerp(bSoil, bLush, lush) + (n2 - 0.5) * 10;
            // 路肩砂砾过渡
            const sh = 1.0 - THREE.MathUtils.smoothstep(dr, 5.2, 8.2);
            r = THREE.MathUtils.lerp(r, 128, sh * 0.7);
            g = THREE.MathUtils.lerp(g, 118, sh * 0.7);
            b = THREE.MathUtils.lerp(b, 95, sh * 0.7);
          }
          const idx = (y * size + x) * 4;
          img.data[idx] = Math.max(0, Math.min(255, r));
          img.data[idx + 1] = Math.max(0, Math.min(255, g));
          img.data[idx + 2] = Math.max(0, Math.min(255, b));
          img.data[idx + 3] = 255;
        }
      }
      ctx.putImageData(img, 0, 0);
      const tex = new THREE.CanvasTexture(canvas);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.anisotropy = 8;
      return tex;
    }

    const groundGeo = new THREE.PlaneGeometry(140, 140, 120, 120);
    groundGeo.rotateX(-Math.PI / 2);
    const gPos = groundGeo.attributes.position;
    for (let i = 0; i < gPos.count; i++) {
      gPos.setY(i, terrainH(gPos.getX(i), gPos.getZ(i)));
    }
    groundGeo.computeVertexNormals();
    const groundTex = createGroundBaseTexture();
    const groundMesh = new THREE.Mesh(
      groundGeo,
      new THREE.MeshStandardMaterial({ map: groundTex, roughness: 0.92, metalness: 0.0 })
    );
    groundMesh.receiveShadow = true;
    grassScene.add(groundMesh);

    // 1.2 添加林缘球形法线低模阔叶树与针叶云杉（还原图1下方森林边缘）
    function addDemoTrees(parent) {
      const crownMat = new THREE.MeshStandardMaterial({ color: 0x304d22, roughness: 0.86 });
      const pineMat = new THREE.MeshStandardMaterial({ color: 0x1e3819, roughness: 0.88 });
      const trunkMat = new THREE.MeshStandardMaterial({ color: 0x4b3828, roughness: 0.95 });

      const treeSpots = [
        [-42, 34, 1.3, 0], [-32, 30, 1.1, 1], [-24, 38, 1.4, 0], [-14, 32, 1.2, 1],
        [-4, 38, 1.35, 0], [8, 35, 1.15, 0], [18, 40, 1.3, 1], [28, 33, 1.25, 0],
        [38, 38, 1.1, 0], [46, 28, 1.2, 1], [-48, 22, 1.2, 0], [-36, 44, 1.35, 1],
        [34, 16, 0.95, 0], [-18, 46, 1.25, 0], [12, 46, 1.4, 1],
      ];
      for (const [tx, tz, sc, isPine] of treeSpots) {
        const ty = terrainH(tx, tz);
        const grp = new THREE.Group();
        grp.position.set(tx, ty, tz);
        const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.35 * sc, 0.55 * sc, 3.5 * sc, 6), trunkMat);
        trunk.position.y = 1.7 * sc;
        trunk.castShadow = true;
        grp.add(trunk);

        if (isPine) {
          for (let l = 0; l < 4; l++) {
            const cone = new THREE.Mesh(new THREE.ConeGeometry((3.8 - l * 0.72) * sc, 4.2 * sc, 7), pineMat);
            cone.position.y = (3.6 + l * 2.2) * sc;
            cone.castShadow = true;
            grp.add(cone);
          }
        } else {
          const blobs = [[0, 6.2, 0, 4.2], [-2.1, 5.2, 1.4, 3.0], [2.2, 5.4, -1.2, 3.1], [0.5, 5.0, 2.2, 2.8]];
          for (const [bx, by, bz, br] of blobs) {
            const sp = new THREE.Mesh(new THREE.IcosahedronGeometry(br * sc, 1), crownMat);
            sp.position.set(bx * sc, by * sc, bz * sc);
            sp.scale.y = 0.78;
            sp.castShadow = true;
            grp.add(sp);
          }
        }
        parent.add(grp);
      }
    }
    addDemoTrees(grassScene);

    // 1.3 构建五种草地流派图层
    const grassGroups = {};

    // 辅助：判断草地生长权重（避开道路和上方水泥坪）
    function grassMaskAt(x, z) {
      if (0.45 * x + z + 22.0 < 6.2) return 0.0;
      return THREE.MathUtils.smoothstep(distToRoad(x, z), 5.6, 8.8);
    }

    // --- 选项 0: 对照原版（稀疏十字贴图卡片） ---
    function buildLegacyCrossGrass() {
      const grp = new THREE.Group();
      // 创建 3 交叉星形卡几何体
      const planes = [];
      for (let a = 0; a < 3; a++) {
        const g = new THREE.PlaneGeometry(1.4, 1.05);
        g.translate(0, 0.5, 0);
        g.rotateY((a * Math.PI) / 3);
        planes.push(g);
      }
      const merged = mergeSimpleGeos(planes);

      // 绘制硬 AlphaTest 暗草贴图
      const cv = document.createElement('canvas');
      cv.width = 64; cv.height = 64;
      const ctx = cv.getContext('2d');
      ctx.clearRect(0, 0, 64, 64);
      for (let i = 0; i < 11; i++) {
        const bx = 10 + i * 4.5;
        ctx.strokeStyle = i % 2 === 0 ? '#1b2c12' : '#435b24';
        ctx.lineWidth = 3.2;
        ctx.beginPath();
        ctx.moveTo(bx, 64);
        ctx.quadraticCurveTo(bx + (i - 5) * 2.2, 30, bx + (i - 5) * 4.2, 8 + (i % 3) * 8);
        ctx.stroke();
      }
      const tex = new THREE.CanvasTexture(cv);
      tex.colorSpace = THREE.SRGBColorSpace;
      const mat = new THREE.MeshStandardMaterial({ map: tex, alphaTest: 0.42, side: THREE.DoubleSide, roughness: 0.9 });

      const positions = [];
      for (let gx = -56; gx <= 56; gx += 2.3) {
        for (let gz = -48; gz <= 52; gz += 2.3) {
          const wx = gx + (hash2(gx, gz) - 0.5) * 1.1;
          const wz = gz + (hash2(gz, gx) - 0.5) * 1.1;
          if (grassMaskAt(wx, wz) > 0.35 && hash2(wx * 3.1, wz * 3.1) > 0.32) {
            positions.push([wx, terrainH(wx, wz), wz, hash2(wx, wz) * Math.PI]);
          }
        }
      }
      const inst = new THREE.InstancedMesh(merged, mat, positions.length);
      const dummy = new THREE.Object3D();
      const col = new THREE.Color();
      positions.forEach((p, i) => {
        dummy.position.set(p[0], p[1], p[2]);
        dummy.rotation.set(0, p[3], 0);
        const s = 0.8 + hash2(p[2], p[0]) * 0.5;
        dummy.scale.set(s, s, s);
        dummy.updateMatrix();
        inst.setMatrixAt(i, dummy.matrix);
        col.setHex(i % 3 === 0 ? 0xaec26a : 0x263818);
        inst.setColorAt(i, col);
      });
      inst.instanceMatrix.needsUpdate = true;
      inst.instanceColor.needsUpdate = true;
      grp.add(inst);
      return grp;
    }

    // 合并简单非索引几何体工具
    function mergeSimpleGeos(geos) {
      let totalVerts = 0;
      const list = geos.map(g => g.index ? g.toNonIndexed() : g);
      for (const g of list) totalVerts += g.attributes.position.count;
      const pos = new Float32Array(totalVerts * 3);
      const norm = new Float32Array(totalVerts * 3);
      const uv = new Float32Array(totalVerts * 2);
      let off = 0;
      for (const g of list) {
        const c = g.attributes.position.count;
        pos.set(g.attributes.position.array, off * 3);
        norm.set(g.attributes.normal.array, off * 3);
        uv.set(g.attributes.uv.array, off * 2);
        off += c;
      }
      const out = new THREE.BufferGeometry();
      out.setAttribute('position', new THREE.BufferAttribute(pos, 3));
      out.setAttribute('normal', new THREE.BufferAttribute(norm, 3));
      out.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
      return out;
    }

    // 构造纯几何弯曲锥形草叶（SimonDev Quick_Grass / Ghost of Tsushima 风格：7顶点 5三角面，无 AlphaTest 锯齿）
    function createCurvedBladeGeometry(bladeW = 0.16, bladeH = 1.05, segments = 3) {
      const positions = [];
      const uvs = [];
      const indices = [];
      for (let i = 0; i <= segments; i++) {
        const t = i / segments; // 0 = 根部, 1 = 叶尖
        const halfW = bladeW * 0.5 * (1.0 - Math.pow(t, 1.35));
        const y = t * bladeH;
        const curveZ = t * t * 0.34 * bladeH; // 自然弯曲倾倒，48°俯视角面积更饱满
        if (i < segments) {
          positions.push(-halfW, y, curveZ, halfW, y, curveZ);
          uvs.push(0, t, 1, t);
        } else {
          positions.push(0, y, curveZ + 0.04);
          uvs.push(0.5, 1.0);
        }
      }
      for (let i = 0; i < segments - 1; i++) {
        const r0 = i * 2, r1 = (i + 1) * 2;
        indices.push(r0, r0 + 1, r1, r0 + 1, r1 + 1, r1);
      }
      const lastRow = (segments - 1) * 2;
      const tipIdx = segments * 2;
      indices.push(lastRow, lastRow + 1, tipIdx);

      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
      geo.setIndex(indices);
      geo.computeVertexNormals();
      return geo;
    }

    // --- 选项 G1: SimonDev Quick_Grass（75,000 根纯几何弯曲草叶 + 根部融地着色 + 风浪波纹） ---
    function buildInstancedBladeGrass({ count, clumped, width, height, viewFatten }) {
      const bladeGeo = createCurvedBladeGeometry(width, height, 3);
      const instGeo = new THREE.InstancedBufferGeometry();
      instGeo.index = bladeGeo.index;
      instGeo.attributes.position = bladeGeo.attributes.position;
      instGeo.attributes.uv = bladeGeo.attributes.uv;

      const offsets = new Float32Array(count * 3);
      const params = new Float32Array(count * 4); // yaw, scaleY, lean, tintRand
      let placed = 0;
      let seed = clumped ? 7711 : 1337;
      const rnd = () => {
        seed = (seed * 1664525 + 1013904223) >>> 0;
        return seed / 4294967296;
      };

      // 如果启用簇生（G2 / G4），先生成 900 个自然聚簇中心
      const clumps = [];
      if (clumped) {
        for (let c = 0; c < 1400; c++) {
          const cx = (rnd() - 0.5) * 124;
          const cz = (rnd() - 0.5) * 124;
          if (grassMaskAt(cx, cz) < 0.2) continue;
          const patch = fbm(cx * 0.055 + 11, cz * 0.055 - 4);
          if (patch < 0.36) continue;
          clumps.push([cx, cz, 1.4 + rnd() * 3.8, patch]);
        }
      }

      let attempts = 0;
      while (placed < count && attempts < count * 4) {
        attempts++;
        let wx, wz, lushFactor;
        if (clumped && clumps.length > 0 && rnd() < 0.82) {
          const cl = clumps[Math.floor(rnd() * clumps.length)];
          const ang = rnd() * Math.PI * 2;
          const rad = Math.sqrt(rnd()) * cl[2];
          wx = cl[0] + Math.cos(ang) * rad;
          wz = cl[1] + Math.sin(ang) * rad;
          lushFactor = cl[3];
        } else {
          wx = (rnd() - 0.5) * 124;
          wz = (rnd() - 0.5) * 124;
          lushFactor = fbm(wx * 0.05, wz * 0.05);
        }
        const mask = grassMaskAt(wx, wz);
        if (mask < 0.15 || rnd() > mask) continue;

        const wy = terrainH(wx, wz);
        offsets[placed * 3] = wx;
        offsets[placed * 3 + 1] = wy - 0.04;
        offsets[placed * 3 + 2] = wz;

        params[placed * 4] = rnd() * Math.PI * 2;
        params[placed * 4 + 1] = (0.58 + rnd() * 0.72) * (0.65 + lushFactor * 0.65) * mask;
        params[placed * 4 + 2] = 0.55 + rnd() * 0.85;
        params[placed * 4 + 3] = rnd();
        placed++;
      }

      instGeo.instanceCount = placed;
      instGeo.setAttribute('aOffset', new THREE.InstancedBufferAttribute(offsets, 3));
      instGeo.setAttribute('aParam', new THREE.InstancedBufferAttribute(params, 4));

      const mat = new THREE.ShaderMaterial({
        uniforms: {
          uTime: grassUniforms.uTime,
          uWindStrength: grassUniforms.uWindStrength,
          uGroundTex: { value: groundTex },
          uViewFatten: { value: viewFatten ? 1.0 : 0.0 },
        },
        side: THREE.DoubleSide,
        vertexShader: `
          attribute vec3 aOffset;
          attribute vec4 aParam;
          uniform float uTime;
          uniform float uWindStrength;
          uniform float uViewFatten;
          varying float vHeightFrac;
          varying vec2 vGroundUV;
          varying float vWindWave;
          varying float vTintRand;
          varying float vShade;

          // 轻量 2D 风浪噪声
          float windNoise(vec2 p) {
            return sin(p.x * 0.14 + uTime * 2.1 + cos(p.y * 0.11 + uTime * 1.4)) * 0.55
                 + sin(p.x * 0.29 - p.y * 0.23 + uTime * 3.2) * 0.30
                 + cos(p.y * 0.42 + uTime * 1.9) * 0.15;
          }

          void main() {
            float yaw = aParam.x;
            float scY = aParam.y;
            float lean = aParam.z;
            vTintRand = aParam.w;
            vHeightFrac = uv.y;

            vec3 local = position;
            local.y *= scY;
            local.z *= scY * lean;

            // 俯视角草叶自然微加宽（避免俯看变成细针）
            if (uViewFatten > 0.5) {
              local.x *= 1.38;
            }

            float c = cos(yaw), s = sin(yaw);
            vec3 rotated = vec3(
              local.x * c - local.z * s,
              local.y,
              local.x * s + local.z * c
            );

            // 风浪推动草叶顶部弯曲
            float w = windNoise(aOffset.xz);
            vWindWave = w;
            float bend = vHeightFrac * vHeightFrac * 0.65 * uWindStrength;
            rotated.x += (0.35 + w * 0.85) * bend;
            rotated.z += (0.20 + w * 0.45) * bend;
            rotated.y -= abs(w) * 0.14 * bend;

            vec3 worldPos = aOffset + rotated;
            vGroundUV = (worldPos.xz / 140.0) + 0.5;
            vGroundUV.y = 1.0 - vGroundUV.y;

            // 近似日光方向与叶面明暗体积感
            vec3 sunDir = normalize(vec3(-0.62, 0.72, 0.32));
            vec3 fakeNorm = normalize(vec3(sin(yaw) * 0.45, 0.85, cos(yaw) * 0.45));
            vShade = 0.62 + 0.38 * max(0.0, dot(fakeNorm, sunDir));

            gl_Position = projectionMatrix * viewMatrix * vec4(worldPos, 1.0);
          }
        `,
        fragmentShader: `
          uniform sampler2D uGroundTex;
          varying float vHeightFrac;
          varying vec2 vGroundUV;
          varying float vWindWave;
          varying float vTintRand;
          varying float vShade;

          void main() {
            // 根部直接采样地表颜色，实现 100% 无缝融地（彻底消灭黑点与边界割裂）
            vec3 groundCol = texture2D(uGroundTex, clamp(vGroundUV, 0.002, 0.998)).rgb;
            vec3 baseColor = groundCol * 0.72;
            vec3 lushTip = mix(vec3(0.32, 0.48, 0.16), vec3(0.49, 0.56, 0.21), vTintRand);
            vec3 dryTip = vec3(0.56, 0.52, 0.26);
            vec3 tipColor = mix(lushTip, dryTip, smoothstep(0.68, 0.96, vTintRand));

            // 根部 AO -> 中段饱满草绿 -> 叶尖阳光透射（SSS）与风浪高光
            float h = vHeightFrac;
            vec3 col = mix(baseColor, tipColor, smoothstep(0.08, 0.88, h));
            float ao = mix(0.66, 1.16, smoothstep(0.0, 0.85, h));
            float gustHighlight = smoothstep(0.25, 0.85, vWindWave) * h * 0.16;
            col = col * ao * vShade + vec3(0.14, 0.16, 0.05) * gustHighlight;

            gl_FragColor = vec4(col, 1.0);
          }
        `,
      });

      const mesh = new THREE.Mesh(instGeo, mat);
      mesh.frustumCulled = false;
      const grp = new THREE.Group();
      grp.add(mesh);
      return grp;
    }

    // --- 选项 G3: Shell Texturing（多层体积毛绒草毯，基于 borisowww/three-shell-texturing） ---
    function buildShellTexturingGrass(layers = 12, maxHeight = 0.82) {
      const grp = new THREE.Group();
      for (let i = 1; i <= layers; i++) {
        const layerFrac = i / layers;
        const mat = new THREE.ShaderMaterial({
          uniforms: {
            uTime: grassUniforms.uTime,
            uWindStrength: grassUniforms.uWindStrength,
            uGroundTex: { value: groundTex },
            uLayerFrac: { value: layerFrac },
            uMaxHeight: { value: maxHeight },
          },
          side: THREE.DoubleSide,
          vertexShader: `
            uniform float uTime;
            uniform float uWindStrength;
            uniform float uLayerFrac;
            uniform float uMaxHeight;
            varying vec3 vWorldPos;
            varying vec2 vGroundUV;
            varying float vWind;

            void main() {
              vec3 pos = position;
              vec4 w0 = modelMatrix * vec4(pos, 1.0);
              float wind = sin(w0.x * 0.13 + uTime * 2.0 + cos(w0.z * 0.11 + uTime * 1.35)) * 0.6
                         + sin(w0.x * 0.31 - w0.z * 0.25 + uTime * 3.1) * 0.4;
              vWind = wind;
              // 壳层沿法线抬升，高层随风场发生自然剪切偏移
              float bend = uLayerFrac * uLayerFrac * 0.38 * uWindStrength;
              pos.y += uLayerFrac * uMaxHeight;
              pos.x += (0.28 + wind * 0.72) * bend;
              pos.z += (0.18 + wind * 0.42) * bend;

              vec4 wp = modelMatrix * vec4(pos, 1.0);
              vWorldPos = wp.xyz;
              vGroundUV = (wp.xz / 140.0) + 0.5;
              vGroundUV.y = 1.0 - vGroundUV.y;
              gl_Position = projectionMatrix * viewMatrix * wp;
            }
          `,
          fragmentShader: `
            uniform sampler2D uGroundTex;
            uniform float uLayerFrac;
            varying vec3 vWorldPos;
            varying vec2 vGroundUV;
            varying float vWind;

            float hash21(vec2 p) {
              p = fract(p * vec2(123.34, 456.21));
              p += dot(p, p + 45.32);
              return fract(p.x * p.y);
            }
            float noise2D(vec2 p) {
              vec2 i = floor(p);
              vec2 f = fract(p);
              f = f * f * (3.0 - 2.0 * f);
              return mix(
                mix(hash21(i), hash21(i + vec2(1.0, 0.0)), f.x),
                mix(hash21(i + vec2(0.0, 1.0)), hash21(i + vec2(1.0, 1.0)), f.x),
                f.y
              );
            }

            void main() {
              // 避开斜穿道路和上方水泥地
              float roadSide = 0.45 * vWorldPos.x + vWorldPos.z + 22.0;
              float distRoad = abs(roadSide) / 1.0965856;
              if (roadSide < 6.2 || distRoad < 5.8) discard;
              float roadEdge = smoothstep(5.8, 8.6, distRoad);

              // 双层旋转错位 + 域扭曲的有机草绒场（彻底消除正方形网格排列感）
              vec2 warp = vec2(
                noise2D(vWorldPos.xz * 0.45 + 3.1) - 0.5,
                noise2D(vWorldPos.xz * 0.45 - 8.7) - 0.5
              ) * 0.65;
              vec2 wp = vWorldPos.xz + warp;
              mat2 rot37 = mat2(0.7986, -0.6018, 0.6018, 0.7986);

              vec2 uvA = wp * 4.6;
              vec2 idA = floor(uvA);
              vec2 jA = (vec2(hash21(idA), hash21(idA + 19.7)) - 0.5) * 0.72;
              float dA = length(fract(uvA) - 0.5 - jA);

              vec2 uvB = (rot37 * wp) * 5.3 + 17.3;
              vec2 idB = floor(uvB);
              vec2 jB = (vec2(hash21(idB + 5.1), hash21(idB + 31.4)) - 0.5) * 0.72;
              float dB = length(fract(uvB) - 0.5 - jB);

              float macroPatch = noise2D(vWorldPos.xz * 0.065) * 0.55 + noise2D(vWorldPos.xz * 0.22) * 0.45;
              float hA = (0.32 + 0.68 * hash21(idA + 7.3)) * (0.55 + 0.60 * macroPatch) * roadEdge;
              float hB = (0.32 + 0.68 * hash21(idB + 11.9)) * (0.55 + 0.60 * macroPatch) * roadEdge;

              float thickness = 0.46 * (1.0 - uLayerFrac * 0.76);
              bool hitA = (uLayerFrac <= hA && dA <= thickness);
              bool hitB = (uLayerFrac <= hB && dB <= thickness);
              if (!hitA && !hitB) discard;

              vec3 groundCol = texture2D(uGroundTex, clamp(vGroundUV, 0.002, 0.998)).rgb;
              vec3 lush = mix(vec3(0.24, 0.39, 0.14), vec3(0.45, 0.53, 0.19), macroPatch);
              vec3 baseCol = mix(groundCol * 0.78, lush, 0.52 + 0.42 * uLayerFrac);

              // 经典 Shell Texturing 自阴影 AO：底层深沉，顶层迎光柔软明亮
              float ao = mix(0.56, 1.24, pow(uLayerFrac, 0.75));
              float gust = smoothstep(0.15, 0.85, vWind) * uLayerFrac * 0.14;
              vec3 finalCol = baseCol * ao + vec3(0.12, 0.15, 0.04) * gust;

              gl_FragColor = vec4(finalCol, 1.0);
            }
          `,
        });
        const shellMesh = new THREE.Mesh(groundGeo, mat);
        shellMesh.renderOrder = i;
        grp.add(shellMesh);
      }
      return grp;
    }

    grassGroups.legacy = buildLegacyCrossGrass();
    grassGroups.quick_grass = buildInstancedBladeGrass({ count: 75000, clumped: false, width: 0.18, height: 1.08, viewFatten: false });
    grassGroups.alro_clump = buildInstancedBladeGrass({ count: 85000, clumped: true, width: 0.17, height: 1.15, viewFatten: true });
    grassGroups.shell_texturing = buildShellTexturingGrass(12, 0.86);
    grassGroups.hybrid_flagship = new THREE.Group();
    grassGroups.hybrid_flagship.add(
      buildShellTexturingGrass(6, 0.54),
      buildInstancedBladeGrass({ count: 32000, clumped: true, width: 0.19, height: 1.25, viewFatten: true })
    );

    for (const g of Object.values(grassGroups)) {
      g.visible = false;
      grassScene.add(g);
    }

    // ==================== 场景 2：建筑/街区过渡消融对比场景（复现图3街区） ====================
    const fadeScene = new THREE.Scene();
    addLights(fadeScene);

    const fadeUniforms = {
      uFade: { value: 0.50 }, // 0 = 100% 近景精细 3D 建筑, 1 = 100% 远景简化体块
      uMode: { value: 3 },    // 0=bayer_legacy, 1=ign, 2=soft_alpha, 3=geo_morph, 4=staggered_haze
    };

    // 2.1 街区道路与地块底面（还原图3的环路与草地街区）
    function createUrbanBaseTexture() {
      const s = 512;
      const cv = document.createElement('canvas');
      cv.width = s; cv.height = s;
      const ctx = cv.getContext('2d');
      ctx.fillStyle = '#c8be8d';
      ctx.fillRect(0, 0, s, s);
      // 柔和草地斑块
      const grad = ctx.createRadialGradient(140, 120, 20, 140, 120, 160);
      grad.addColorStop(0, '#8ba352');
      grad.addColorStop(1, 'rgba(139,163,82,0)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, s, s);
      // 街区沥青路网
      ctx.strokeStyle = '#53514c';
      ctx.lineWidth = 26;
      ctx.strokeRect(56, 56, 400, 400);
      ctx.beginPath();
      ctx.moveTo(295, 0); ctx.lineTo(295, 512);
      ctx.moveTo(0, 235); ctx.lineTo(512, 235);
      ctx.stroke();
      // 道路白虚线
      ctx.strokeStyle = '#d4d0c5';
      ctx.lineWidth = 2;
      ctx.setLineDash([10, 10]);
      ctx.strokeRect(56, 56, 400, 400);
      ctx.setLineDash([]);
      // 建筑硬质地基广场
      ctx.fillStyle = '#9b968a';
      ctx.fillRect(88, 86, 185, 125);
      ctx.fillRect(88, 260, 185, 170);
      ctx.fillRect(322, 86, 110, 344);
      const tex = new THREE.CanvasTexture(cv);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.anisotropy = 8;
      return tex;
    }

    const urbanGround = new THREE.Mesh(
      new THREE.PlaneGeometry(150, 150).rotateX(-Math.PI / 2),
      new THREE.MeshStandardMaterial({ map: createUrbanBaseTexture(), roughness: 0.92 })
    );
    urbanGround.receiveShadow = true;
    fadeScene.add(urbanGround);

    // 创建建筑立面窗户贴图（近景精细细节）与远景简洁色块贴图
    function createFacadeTexture() {
      const cv = document.createElement('canvas');
      cv.width = 256; cv.height = 256;
      const ctx = cv.getContext('2d');
      ctx.fillStyle = '#8d6442';
      ctx.fillRect(0, 0, 256, 256);
      // 砖墙微纹理与楼层线
      for (let row = 0; row < 6; row++) {
        ctx.fillStyle = '#755033';
        ctx.fillRect(0, row * 42, 256, 4);
        for (let col = 0; col < 8; col++) {
          ctx.fillStyle = '#334048';
          ctx.fillRect(col * 32 + 6, row * 42 + 12, 18, 22);
          ctx.fillStyle = '#c8bfb2';
          ctx.fillRect(col * 32 + 5, row * 42 + 34, 20, 3);
        }
      }
      const tex = new THREE.CanvasTexture(cv);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
      return tex;
    }
    function createRoofTexture() {
      const cv = document.createElement('canvas');
      cv.width = 256; cv.height = 256;
      const ctx = cv.getContext('2d');
      ctx.fillStyle = '#a8a296';
      ctx.fillRect(0, 0, 256, 256);
      ctx.strokeStyle = '#7e786e';
      ctx.lineWidth = 3;
      for (let i = 0; i < 256; i += 24) {
        ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(256, i); ctx.stroke();
      }
      ctx.strokeStyle = '#605a52';
      ctx.lineWidth = 8;
      ctx.strokeRect(4, 4, 248, 248);
      const tex = new THREE.CanvasTexture(cv);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    const facadeTex = createFacadeTexture();
    const roofTex = createRoofTexture();

    // 街区建筑布局（14 栋不同高度与朝向的建筑）
    const buildingSpecs = [
      [-35, -36, 18, 12, 9, 0.0],
      [-11, -36, 22, 14, 10, 0.0],
      [-35, -18, 16, 10, 8, 0.0],
      [-13, -18, 18, 18, 11, 0.0],
      [-38, 14, 15, 11, 8, 0.0],
      [-16, 14, 20, 15, 9, 0.0],
      [-36, 36, 19, 13, 9, 0.0],
      [-12, 38, 16, 11, 8, 0.0],
      [25, -34, 11, 14, 22, 0.0],
      [25, -6, 11, 12, 20, 0.0],
      [25, 22, 11, 16, 22, 0.0],
      [44, -28, 10, 10, 16, 0.0],
      [44, 0, 10, 13, 18, 0.0],
      [44, 28, 10, 11, 16, 0.0],
    ];

    // 构造可编程过渡材质工厂（分别用于近景建筑与远景简化体块）
    function createTransitionMaterial({ baseColor, mapTex, isNear, isRoofDetail = false, depthOnly = false }) {
      const mat = new THREE.ShaderMaterial({
        uniforms: {
          uFade: fadeUniforms.uFade,
          uMode: fadeUniforms.uMode,
          uMap: { value: mapTex },
          uHasMap: { value: mapTex ? 1.0 : 0.0 },
          uColor: { value: new THREE.Color(baseColor) },
          uIsNear: { value: isNear ? 1.0 : 0.0 },
          uIsRoofDetail: { value: isRoofDetail ? 1.0 : 0.0 },
        },
        transparent: !depthOnly,
        depthWrite: true,
        colorWrite: !depthOnly,
        vertexShader: `
          attribute float aStagger;
          uniform float uFade;
          uniform float uMode;
          uniform float uIsRoofDetail;
          varying vec2 vUv;
          varying vec3 vNormalW;
          varying float vLocalFade;
          varying float vStagger;

          void main() {
            vUv = uv;
            vStagger = aStagger;
            // 计算当前建筑的过渡进度（T4 模式启用按栋微错峰）
            float f = uFade;
            if (abs(uMode - 4.0) < 0.5) {
              f = clamp((uFade * 1.32 - aStagger * 0.32), 0.0, 1.0);
            }
            vLocalFade = f;

            vec3 p = position;
            // T3 模式（实体无缝形变）：屋顶细碎构件随距离平滑沉降收拢进屋顶主体
            if (abs(uMode - 3.0) < 0.5 && uIsRoofDetail > 0.5) {
              float shrink = 1.0 - smoothstep(0.15, 0.85, f);
              p.y *= max(0.01, shrink);
              p.xz *= mix(0.65, 1.0, shrink);
            }

            vec4 wp = modelMatrix * vec4(p, 1.0);
            vNormalW = normalize(mat3(modelMatrix) * normal);
            gl_Position = projectionMatrix * viewMatrix * wp;
          }
        `,
        fragmentShader: `
          uniform float uMode;
          uniform sampler2D uMap;
          uniform float uHasMap;
          uniform vec3 uColor;
          uniform float uIsNear;
          uniform float uIsRoofDetail;
          varying vec2 vUv;
          varying vec3 vNormalW;
          varying float vLocalFade;
          varying float vStagger;

          // 对照原版低频规则 8x8 Bayer（刻意还原图3白点阵纱窗）
          float bayerLegacy(vec2 px) {
            vec2 g = floor(mod(px / 2.0, 4.0));
            float idx = g.x + g.y * 4.0;
            float m = mod(idx * 7.0 + g.y * 3.0, 16.0) / 16.0;
            return m;
          }

          // T1 高频 Interleaved Gradient Noise（蓝噪声级无网格伪影）
          float ign(vec2 px) {
            return fract(52.9829189 * fract(0.06711056 * px.x + 0.00583715 * px.y));
          }

          void main() {
            float f = vLocalFade;
            vec3 sunDir = normalize(vec3(-0.55, 0.78, 0.35));
            float ndl = max(0.0, dot(normalize(vNormalW), sunDir));
            float light = 0.52 + 0.55 * ndl;

            vec3 texCol = uHasMap > 0.5 ? texture2D(uMap, vUv).rgb : vec3(1.0);
            vec3 nearCol = texCol * uColor * light;
            vec3 farSimplifiedCol = mix(uColor * 0.92, vec3(0.76, 0.74, 0.68), 0.35) * light;

            // --- 模式 0：当前原版 Bayer 纱窗 ---
            if (uMode < 0.5) {
              if (uIsNear > 0.5) {
                float vis = 1.0 - f;
                if (vis < 0.99 && bayerLegacy(gl_FragCoord.xy) > vis) discard;
                gl_FragColor = vec4(nearCol, 1.0);
              } else {
                float vis = f;
                if (vis < 0.99 && bayerLegacy(gl_FragCoord.xy) > vis) discard;
                gl_FragColor = vec4(farSimplifiedCol, 1.0);
              }
              return;
            }

            // --- 模式 1：高频 IGN 蓝噪声互补溶解 ---
            if (uMode < 1.5) {
              float n = ign(gl_FragCoord.xy);
              // 严格互补阈值：近景保留 n < (1-f)，远景保留 n >= (1-f)，零白点空洞！
              if (uIsNear > 0.5) {
                if (n >= 1.0 - f) discard;
                gl_FragColor = vec4(nearCol, 1.0);
              } else {
                if (n < 1.0 - f) discard;
                gl_FragColor = vec4(farSimplifiedCol, 1.0);
              }
              return;
            }

            // --- 模式 2：Depth-Prepass 柔和真透明淡变（0 颗粒） ---
            if (uMode < 2.5) {
              if (uIsNear > 0.5) {
                float a = 1.0 - smoothstep(0.05, 0.95, f);
                if (a <= 0.01) discard;
                gl_FragColor = vec4(nearCol, a);
              } else {
                float a = smoothstep(0.0, 0.85, f);
                if (a <= 0.01) discard;
                gl_FragColor = vec4(farSimplifiedCol, a);
              }
              return;
            }

            // --- 模式 3：实体无缝形变（细节沉降 + 材质平滑柔化，全程 100% 实心） ---
            if (uMode < 3.5) {
              if (uIsNear < 0.5) discard; // 远景无需叠加重绘，主体直接平滑柔化为远景外观
              if (uIsRoofDetail > 0.5 && f > 0.86) discard;
              float blend = smoothstep(0.15, 0.88, f);
              vec3 morphed = mix(nearCol, farSimplifiedCol, blend);
              gl_FragColor = vec4(morphed, 1.0);
              return;
            }

            // --- 模式 4：按栋微错峰 + 柔和淡变 + 轻度大气透视柔焦 ---
            vec3 hazeCol = vec3(0.66, 0.70, 0.62);
            if (uIsNear > 0.5) {
              float a = 1.0 - smoothstep(0.08, 0.92, f);
              if (a <= 0.01) discard;
              vec3 c = mix(nearCol, hazeCol, f * 0.18);
              gl_FragColor = vec4(c, a);
            } else {
              float a = smoothstep(0.0, 0.85, f);
              if (a <= 0.01) discard;
              vec3 c = mix(farSimplifiedCol, hazeCol, f * 0.22);
              gl_FragColor = vec4(c, a);
            }
          }
        `,
      });
      return mat;
    }

    const nearWallMat = createTransitionMaterial({ baseColor: 0xffffff, mapTex: facadeTex, isNear: true });
    const nearRoofMat = createTransitionMaterial({ baseColor: 0xffffff, mapTex: roofTex, isNear: true });
    const nearDetailMat = createTransitionMaterial({ baseColor: 0x706c64, mapTex: null, isNear: true, isRoofDetail: true });
    const farBlockMat = createTransitionMaterial({ baseColor: 0xb9ae9a, mapTex: null, isNear: false });
    // Depth-Prepass 专用材质（防止 T2/T4 半透明模式下内部背面互相穿透）
    const depthPrepassMat = createTransitionMaterial({ baseColor: 0xffffff, mapTex: null, isNear: true, depthOnly: true });

    function stampStagger(geo, val) {
      const arr = new Float32Array(geo.attributes.position.count).fill(val);
      geo.setAttribute('aStagger', new THREE.BufferAttribute(arr, 1));
      return geo;
    }

    const depthPrepassMeshes = [];
    buildingSpecs.forEach(([bx, bz, bw, bh, bd, yaw], idx) => {
      const stagger = ((idx * 0.37) % 1.0);
      const grp = new THREE.Group();
      grp.position.set(bx, 0, bz);
      grp.rotation.y = yaw;

      // 1) 近景精细建筑（墙体 + 纹理屋顶 + 屋顶空调机/女儿墙细节）
      const wallGeo = stampStagger(new THREE.BoxGeometry(bw, bh, bd), stagger);
      const wallMesh = new THREE.Mesh(wallGeo, nearWallMat);
      wallMesh.position.y = bh * 0.5;
      wallMesh.castShadow = true;
      wallMesh.receiveShadow = true;
      wallMesh.renderOrder = 10;
      grp.add(wallMesh);

      const roofGeo = stampStagger(new THREE.BoxGeometry(bw + 0.5, 0.8, bd + 0.5), stagger);
      const roofMesh = new THREE.Mesh(roofGeo, nearRoofMat);
      roofMesh.position.y = bh + 0.4;
      roofMesh.castShadow = true;
      roofMesh.renderOrder = 11;
      grp.add(roofMesh);

      // 屋顶细碎空调箱、楼梯间与女儿墙（T3 模式下会平滑沉降收拢进屋顶）
      const detailOffsets = [
        [-bw * 0.25, bd * 0.18, 2.8, 2.2, 2.6],
        [bw * 0.22, -bd * 0.16, 3.4, 1.8, 2.2],
        [0, 0, 2.0, 2.6, 2.0],
      ];
      for (const [dx, dz, dw, dh, dd] of detailOffsets) {
        const dg = stampStagger(new THREE.BoxGeometry(dw, dh, dd), stagger);
        dg.translate(0, dh * 0.5, 0);
        const dm = new THREE.Mesh(dg, nearDetailMat);
        dm.position.set(dx, bh + 0.8, dz);
        dm.castShadow = true;
        dm.renderOrder = 12;
        grp.add(dm);
      }

      // Depth-Prepass 辅助体（仅在 T2/T4 模式下开启，保证柔和 Alpha 淡变绝不穿透明露馅）
      const dpMesh = new THREE.Mesh(wallGeo, depthPrepassMat);
      dpMesh.position.y = bh * 0.5;
      dpMesh.renderOrder = 8;
      dpMesh.visible = false;
      grp.add(dpMesh);
      depthPrepassMeshes.push(dpMesh);

      // 2) 远景简洁体块（略微内缩 0.08m 防止 Z-fighting）
      const farGeo = stampStagger(new THREE.BoxGeometry(bw - 0.08, bh + 0.4, bd - 0.08), stagger);
      const farMesh = new THREE.Mesh(farGeo, farBlockMat);
      farMesh.position.y = (bh + 0.4) * 0.5;
      farMesh.renderOrder = 5;
      grp.add(farMesh);

      fadeScene.add(grp);
    });

    // ==================== 状态控制与 UI 渲染 ====================
    let activeTab = 'grass'; // 'grass' | 'fade'
    let activeGrassId = 'hybrid_flagship';
    let activeFadeId = 'geo_morph_solid';
    let autoPlayFade = false;

    const optionsListEl = document.getElementById('options-list');
    const drawerTitleEl = document.getElementById('drawer-title');
    const drawerSubEl = document.getElementById('drawer-sub');

    function applyGrassOption(id) {
      activeGrassId = id;
      for (const [k, g] of Object.entries(grassGroups)) {
        g.visible = (k === id);
      }
      renderOptions();
    }

    function applyFadeOption(id) {
      activeFadeId = id;
      const modeMap = {
        bayer_legacy: 0,
        ign_complementary: 1,
        depth_soft_alpha: 2,
        geo_morph_solid: 3,
        staggered_haze: 4,
      };
      const m = modeMap[id] ?? 3;
      fadeUniforms.uMode.value = m;

      // 控制 Depth-Prepass 与透明混合设置
      const isAlphaMode = (m === 2 || m === 4);
      for (const dp of depthPrepassMeshes) dp.visible = isAlphaMode;
      for (const mat of [nearWallMat, nearRoofMat, nearDetailMat, farBlockMat]) {
        mat.transparent = isAlphaMode;
        mat.depthWrite = !isAlphaMode;
        mat.needsUpdate = true;
      }
      if (isAlphaMode) {
        farBlockMat.depthWrite = true;
      }
      renderOptions();
    }

    function renderOptions() {
      const list = activeTab === 'grass' ? GRASS_OPTIONS : FADE_OPTIONS;
      const curId = activeTab === 'grass' ? activeGrassId : activeFadeId;
      optionsListEl.innerHTML = list.map(item => `
        <div class="option-card ${item.id === curId ? 'active' : ''}" data-id="${item.id}">
          <div class="option-title">
            <span>${item.title}</span>
            ${item.tag ? `<span class="tag ${item.tagCls}">${item.tag}</span>` : ''}
          </div>
          <div class="option-desc">${item.desc}</div>
          <div class="option-meta">${item.meta}</div>
        </div>
      `).join('');

      optionsListEl.querySelectorAll('.option-card').forEach(el => {
        el.onclick = () => {
          const id = el.getAttribute('data-id');
          if (activeTab === 'grass') applyGrassOption(id);
          else applyFadeOption(id);
        };
      });
    }

    function switchTab(tab) {
      activeTab = tab;
      document.getElementById('tab-grass').classList.toggle('active', tab === 'grass');
      document.getElementById('tab-fade').classList.toggle('active', tab === 'fade');
      document.getElementById('grass-controls').style.display = tab === 'grass' ? 'flex' : 'none';
      document.getElementById('fade-controls').style.display = tab === 'fade' ? 'flex' : 'none';

      if (tab === 'grass') {
        drawerTitleEl.textContent = '🌿 开源草地模拟方案（48° RTS 俯视角）';
        drawerSubEl.textContent = '原生 1080p 实时对比 4 套开源 Three.js 草地技术与现状对照；左键拖拽平移，右键旋转，滚轮拉近查看单叶细节。';
        camState.target.set(0, 0, 6);
        camState.dist = 82;
        camState.yaw = 0.28;
        camState.tiltDeg = 48;
      } else {
        drawerTitleEl.textContent = '🏙️ 建筑过渡消融升级方案（对照图3）';
        drawerSubEl.textContent = '拖动下方滑块或点击「自动往返演示」，在 1080p 下直观对比 50% 过渡态是否有纱窗/噪点/穿帮。';
        camState.target.set(4, 4, 2);
        camState.dist = 148;
        camState.yaw = 0.08;
        camState.tiltDeg = 54;
      }
      document.getElementById('tilt-slider').value = String(camState.tiltDeg);
      document.getElementById('tilt-val').textContent = `${camState.tiltDeg}°`;
      updateCamera();
      renderOptions();
    }

    document.getElementById('tab-grass').onclick = () => switchTab('grass');
    document.getElementById('tab-fade').onclick = () => switchTab('fade');

    const windSlider = document.getElementById('wind-slider');
    windSlider.oninput = () => {
      const v = parseFloat(windSlider.value);
      grassUniforms.uWindStrength.value = v;
      document.getElementById('wind-val').textContent = `${v.toFixed(2)}x`;
    };
    const tiltSlider = document.getElementById('tilt-slider');
    tiltSlider.oninput = () => {
      camState.tiltDeg = parseFloat(tiltSlider.value);
      document.getElementById('tilt-val').textContent = `${camState.tiltDeg}°`;
      updateCamera();
    };
    const fadeSlider = document.getElementById('fade-slider');
    fadeSlider.oninput = () => {
      autoPlayFade = false;
      document.getElementById('btn-auto-fade').classList.remove('active');
      const v = parseFloat(fadeSlider.value);
      fadeUniforms.uFade.value = v;
      document.getElementById('fade-val').textContent = `${Math.round(v * 100)}%`;
    };
    document.getElementById('btn-auto-fade').onclick = () => {
      autoPlayFade = !autoPlayFade;
      document.getElementById('btn-auto-fade').classList.toggle('active', autoPlayFade);
    };
    document.getElementById('btn-hold-50').onclick = () => {
      autoPlayFade = false;
      document.getElementById('btn-auto-fade').classList.remove('active');
      fadeSlider.value = '0.50';
      fadeUniforms.uFade.value = 0.50;
      document.getElementById('fade-val').textContent = '50%';
    };

    // 交互控制（左键平移、右键旋转、滚轮缩放）
    let dragMode = 0; // 1=pan, 2=rotate
    let lastPt = { x: 0, y: 0 };
    host.addEventListener('contextmenu', e => e.preventDefault());
    host.addEventListener('pointerdown', e => {
      dragMode = e.button === 2 ? 2 : 1;
      lastPt = { x: e.clientX, y: e.clientY };
    });
    window.addEventListener('pointermove', e => {
      if (!dragMode) return;
      const dx = e.clientX - lastPt.x;
      const dy = e.clientY - lastPt.y;
      lastPt = { x: e.clientX, y: e.clientY };
      if (dragMode === 2) {
        camState.yaw -= dx * 0.006;
        camState.tiltDeg = THREE.MathUtils.clamp(camState.tiltDeg + dy * 0.25, 28, 76);
      } else {
        const s = camState.dist * 0.0014;
        const cy = Math.cos(camState.yaw), sy = Math.sin(camState.yaw);
        camState.target.x -= (dx * cy + dy * sy) * s;
        camState.target.z -= (-dx * sy + dy * cy) * s;
      }
      updateCamera();
    });
    window.addEventListener('pointerup', () => { dragMode = 0; });
    host.addEventListener('wheel', e => {
      e.preventDefault();
      camState.dist = THREE.MathUtils.clamp(camState.dist * (e.deltaY > 0 ? 1.1 : 0.91), 28, 280);
      updateCamera();
    }, { passive: false });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // 支持 URL 参数直达指定标签与方案（如 ?tab=fade&opt=geo_morph_solid）
    const qp = new URLSearchParams(window.location.search);
    applyGrassOption(qp.get('grass') || 'hybrid_flagship');
    applyFadeOption(qp.get('fade') || 'geo_morph_solid');
    switchTab(qp.get('tab') === 'fade' ? 'fade' : 'grass');

    window.__COMPARE_UI__ = {
      switchTab,
      applyGrassOption,
      applyFadeOption,
      setFadeValue: (v) => {
        fadeUniforms.uFade.value = v;
        fadeSlider.value = String(v);
        document.getElementById('fade-val').textContent = `${Math.round(v * 100)}%`;
      },
    };

    // 主循环与实时性能监测
    let frameCount = 0;
    let lastFpsT = performance.now();
    function animate(now) {
      const sec = now * 0.001;
      grassUniforms.uTime.value = sec;

      if (activeTab === 'fade' && autoPlayFade) {
        const v = 0.5 - 0.5 * Math.cos(sec * 1.15);
        fadeUniforms.uFade.value = v;
        fadeSlider.value = v.toFixed(3);
        document.getElementById('fade-val').textContent = `${Math.round(v * 100)}%`;
      }

      const curScene = activeTab === 'grass' ? grassScene : fadeScene;
      renderer.render(curScene, camera);

      frameCount++;
      if (now - lastFpsT >= 400) {
        const fps = Math.round((frameCount * 1000) / (now - lastFpsT));
        document.getElementById('stat-fps').textContent = `${fps} FPS`;
        document.getElementById('stat-dc').textContent = `${renderer.info.render.calls}`;
        document.getElementById('stat-tris').textContent = `${renderer.info.render.triangles.toLocaleString()}`;
        frameCount = 0;
        lastFpsT = now;
      }
      requestAnimationFrame(animate);
    }
    requestAnimationFrame(animate);
  </script>
</body>
</html>
