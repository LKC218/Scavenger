<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <link rel="icon" href="data:," />
  <title>渲染分辨率与风格化实时对比台 · 16:9 / 21:9 · 1080p / 720p / 680p / 540p / 364p</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
      background: #0d120c; color: #e4eee0;
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
      display: flex; flex-direction: column;
    }
    #toolbar {
      flex: 0 0 auto;
      background: rgba(16, 23, 15, 0.96);
      border-bottom: 1px solid rgba(154, 194, 120, 0.35);
      padding: 8px 14px;
      display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px;
      z-index: 30;
    }
    .group {
      display: flex; align-items: center; gap: 5px;
      padding-right: 10px;
      border-right: 1px solid rgba(154, 194, 120, 0.22);
    }
    .group:last-child { border-right: none; padding-right: 0; }
    .g-label {
      font-size: 11px; color: #9eb78c; font-weight: 600; margin-right: 2px; white-space: nowrap;
    }
    .btn {
      background: rgba(38, 52, 34, 0.9); color: #d8e6cc;
      border: 1px solid rgba(154, 194, 120, 0.38); border-radius: 5px;
      padding: 4px 9px; font-size: 12px; cursor: pointer;
      transition: all 0.12s; white-space: nowrap;
    }
    .btn:hover { background: rgba(66, 92, 56, 0.95); color: #fff; }
    .btn.active {
      background: #4e8039; color: #fff; border-color: #b8ee96; font-weight: 700;
      box-shadow: 0 0 0 1px rgba(184, 238, 150, 0.35);
    }
    .btn.accent {
      background: #6c5a26; border-color: #e4c868; color: #fff4d2;
    }
    .btn.accent:hover { background: #8a7330; }
    .btn.accent.active { background: #b58d22; color: #fff; }

    #telemetry {
      margin-left: auto;
      font-size: 12px; color: #cde2be;
      background: rgba(10, 15, 10, 0.72);
      border: 1px solid rgba(154, 194, 120, 0.28);
      border-radius: 5px; padding: 4px 10px;
      display: flex; gap: 12px; align-items: center;
    }
    #telemetry b { color: #b9f28b; }

    #stage-wrap {
      flex: 1 1 auto;
      position: relative;
      display: flex; align-items: center; justify-content: center;
      background: radial-gradient(circle at center, #141b12 0%, #090d08 100%);
      overflow: hidden;
      padding: 12px;
    }
    #aspect-frame {
      position: relative;
      background: #000;
      border: 1px solid rgba(164, 206, 128, 0.42);
      box-shadow: 0 12px 42px rgba(0, 0, 0, 0.72);
      overflow: hidden;
      transition: width 0.18s ease, height 0.18s ease;
    }
    #map-iframe {
      width: 100%; height: 100%; border: none; display: block;
    }

    #badge-corner {
      position: absolute; top: 10px; left: 10px; z-index: 15;
      background: rgba(12, 18, 11, 0.84);
      border: 1px solid rgba(170, 214, 134, 0.48);
      border-radius: 6px; padding: 5px 10px; font-size: 12px;
      pointer-events: none; color: #e8f5df;
    }
    #badge-corner .pill {
      display: inline-block; padding: 1px 6px; border-radius: 4px;
      background: #4e8039; color: #fff; font-weight: 700; margin-right: 6px;
    }
    #badge-corner .pill.peek {
      background: #b58d22;
    }
    #hint-bottom {
      position: absolute; bottom: 10px; left: 10px; z-index: 15;
      background: rgba(12, 18, 11, 0.8);
      border: 1px solid rgba(154, 194, 120, 0.28);
      border-radius: 6px; padding: 4px 10px; font-size: 11px; color: #bed1b0;
      pointer-events: none;
    }

    /* 同镜头左右滑块逐像素对比浮层 */
    #split-overlay {
      position: absolute; inset: 0; z-index: 25;
      display: none; background: #000; user-select: none;
    }
    #split-overlay.open { display: block; }
    .split-img {
      position: absolute; inset: 0; width: 100%; height: 100%;
      object-fit: fill; pointer-events: none;
    }
    #split-right-wrap {
      position: absolute; inset: 0; overflow: hidden;
      clip-path: inset(0 0 0 50%);
    }
    #split-divider {
      position: absolute; top: 0; bottom: 0; left: 50%; width: 3px;
      background: #d8ff8a; cursor: ew-resize; z-index: 30;
      box-shadow: 0 0 12px rgba(0, 0, 0, 0.9);
    }
    #split-handle {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 34px; height: 34px; border-radius: 50%;
      background: rgba(20, 30, 18, 0.92); border: 2px solid #d8ff8a;
      color: #d8ff8a; font-size: 14px; font-weight: 700;
      display: flex; align-items: center; justify-content: center;
      pointer-events: none;
    }
    .split-tag {
      position: absolute; top: 12px; z-index: 32;
      background: rgba(12, 18, 11, 0.88);
      border: 1px solid rgba(184, 238, 150, 0.55);
      border-radius: 6px; padding: 5px 10px; font-size: 12px; font-weight: 700;
      pointer-events: none;
    }
    #split-tag-left { left: 12px; color: #d8ff8a; }
    #split-tag-right { right: 12px; color: #ffdf80; }
    #split-close-bar {
      position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%); z-index: 35;
      background: rgba(14, 20, 13, 0.92); border: 1px solid rgba(184, 238, 150, 0.5);
      border-radius: 8px; padding: 6px 12px; display: flex; gap: 8px; align-items: center;
      font-size: 12px;
    }

    #loading-mask {
      position: absolute; inset: 0; z-index: 40;
      background: rgba(11, 16, 10, 0.9);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 10px; color: #d6e9c8; font-size: 14px;
    }
  </style>
</head>
<body>
  <div id="toolbar">
    <div class="group" id="grp-res">
      <span class="g-label">渲染分辨率(高度)</span>
      <button class="btn" data-h="1080">1080p [1]</button>
      <button class="btn" data-h="720">720p [2]</button>
      <button class="btn active" data-h="680">680p 候选 [3]</button>
      <button class="btn" data-h="540">540p (1/2整倍) [4]</button>
      <button class="btn" data-h="364">364p 复古 [5]</button>
    </div>

    <div class="group" id="grp-aspect">
      <span class="g-label">画幅比例</span>
      <button class="btn active" data-aspect="16:9">16:9</button>
      <button class="btn" data-aspect="21:9">21:9 (Hor+)</button>
    </div>

    <div class="group" id="grp-style">
      <span class="g-label">风格化上采样</span>
      <button class="btn active" data-style="auto">柔滑 Bilinear</button>
      <button class="btn" data-style="pixelated">锐利像素 Pixelated</button>
      <button class="btn" data-style="soft-film">微缩胶片 Soft</button>
      <button class="btn" data-style="stylized">复古微缩 Stylized</button>
    </div>

    <div class="group" id="grp-cam">
      <span class="g-label">实战机位</span>
      <button class="btn" data-cam="forest">🌲 混交林+草地</button>
      <button class="btn" data-cam="airbase">🚁 机场+三型载具</button>
      <button class="btn" data-cam="town">🏘️ 中景城镇460m</button>
      <button class="btn" data-cam="rocks">🪨 远景岩脉1400m</button>
    </div>

    <div class="group">
      <button class="btn accent" id="btn-split">🔍 1080p vs 当前滑块对比</button>
      <button class="btn" id="btn-back" onclick="window.location.href='/'">返回主试玩</button>
    </div>

    <div id="telemetry">
      <span>像素: <b id="tel-px">1208×680</b></span>
      <span>相对1080p: <b id="tel-pct">39.6%</b></span>
      <span>DC: <b id="tel-dc">--</b></span>
    </div>
  </div>

  <div id="stage-wrap">
    <div id="aspect-frame">
      <iframe id="map-iframe" src="/?source=archive&embed=1"></iframe>

      <div id="badge-corner">
        <span class="pill" id="badge-pill">680p · 16:9</span>
        <span id="badge-desc">1208×680 · 柔滑 Bilinear · 像素量 39.6%</span>
      </div>

      <div id="hint-bottom">
        提示：画布内可自由 WASD/左键拖拽/滚轮缩放 | 数字键 1–5 秒切分辨率 | <b>按住空格键 (Space)</b> 瞬间对比 1080p 原画，松开弹回！
      </div>

      <div id="split-overlay">
        <img id="split-left-img" class="split-img" alt="左侧基准图" />
        <div id="split-right-wrap">
          <img id="split-right-img" class="split-img" alt="右侧候选图" />
        </div>
        <div id="split-divider"><div id="split-handle">⇔</div></div>
        <div class="split-tag" id="split-tag-left">左：1080p 原画基准</div>
        <div class="split-tag" id="split-tag-right">右：680p 候选</div>
        <div id="split-close-bar">
          <span>拖动绿色中线逐像素对比</span>
          <button class="btn" id="btn-split-swap-style">切换右侧像素化/柔滑</button>
          <button class="btn accent" id="btn-split-close">关闭滑块返回实时画布 (ESC)</button>
        </div>
      </div>

      <div id="loading-mask">
        <div>正在从 .scvmap 归档加载完整 9km 真实地图与三型载具…</div>
        <div style="font-size:12px;color:#93ad82;">首次加载约 1–3 秒，之后切换任意分辨率与画幅均为 1ms 实时秒切</div>
      </div>
    </div>
  </div>

  <script>
    // 各垂直渲染高度在 16:9 与 21:9 下的精确偶数像素宽（符合工业视频/渲染对齐规范）
    const RES_TABLE = {
      1080: { '16:9': [1920, 1080], '21:9': [2560, 1080], note: '原生超清写实基准' },
      720:  { '16:9': [1280, 720],  '21:9': [1680, 720],  note: '经典轻量清晰线' },
      680:  { '16:9': [1208, 680],  '21:9': [1588, 680],  note: '风格化候选基线 (1080p的0.63×高)' },
      540:  { '16:9': [960, 540],   '21:9': [1280, 540],  note: '1080p严格1/2整数倍(像素最齐)' },
      364:  { '16:9': [640, 364],   '21:9': [850, 364],   note: '强复古低分对照' },
    };

    const CAM_PRESETS = {
      forest:  { x: 12.5,   z: -212.5, span: 105, angle: 0.25 },
      airbase: { x: 0.0,    z: 85.0,   span: 135, angle: 0.0 },
      town:    { x: -180.0, z: -480.0, span: 460, angle: 0.0 },
      rocks:   { x: -2050,  z: -2300,  span: 1400, angle: 0.0 },
    };

    const STYLE_LABELS = {
      auto: '柔滑 Bilinear',
      pixelated: '锐利像素 Pixelated',
      'soft-film': '微缩胶片 Soft',
      stylized: '复古微缩 Stylized',
    };

    const state = {
      heightP: 680,
      aspect: '16:9',
      style: 'auto',
      peeking1080: false,
      ready: false,
      splitOpen: false,
      splitPct: 50,
    };

    const stageWrap = document.getElementById('stage-wrap');
    const aspectFrame = document.getElementById('aspect-frame');
    const iframe = document.getElementById('map-iframe');
    const loadingMask = document.getElementById('loading-mask');
    const badgePill = document.getElementById('badge-pill');
    const badgeDesc = document.getElementById('badge-desc');
    const telPx = document.getElementById('tel-px');
    const telPct = document.getElementById('tel-pct');
    const telDc = document.getElementById('tel-dc');

    function getMapApi() {
      try {
        return iframe.contentWindow && iframe.contentWindow.__SCV_MAP__;
      } catch {
        return null;
      }
    }

    function layoutAspectFrame() {
      const pad = 24;
      const availW = Math.max(320, stageWrap.clientWidth - pad);
      const availH = Math.max(200, stageWrap.clientHeight - pad);
      const ratio = state.aspect === '21:9' ? (2560 / 1080) : (16 / 9);
      let w = availW;
      let h = w / ratio;
      if (h > availH) {
        h = availH;
        w = h * ratio;
      }
      aspectFrame.style.width = Math.round(w) + 'px';
      aspectFrame.style.height = Math.round(h) + 'px';
    }

    function applyCurrentSettings() {
      layoutAspectFrame();
      const activeH = state.peeking1080 ? 1080 : state.heightP;
      const [w, h] = RES_TABLE[activeH][state.aspect];
      const [refW, refH] = RES_TABLE[1080][state.aspect];
      const pct = ((w * h) / (refW * refH) * 100).toFixed(1);

      const api = getMapApi();
      if (api && state.ready) {
        const ratio = state.aspect === '21:9' ? (2560 / 1080) : (16 / 9);
        api.setAspectHorPlus(ratio);
        api.setResolution(w, h);
        api.setUpscaleStyle(state.peeking1080 ? 'auto' : state.style);
      }

      badgePill.textContent = state.peeking1080
        ? `对照 1080p · ${state.aspect}`
        : `${activeH}p · ${state.aspect}`;
      badgePill.classList.toggle('peek', state.peeking1080);
      badgeDesc.textContent = `${w}×${h} · ${state.peeking1080 ? '原生基准' : STYLE_LABELS[state.style]} · 相对1080p像素 ${pct}%`;
      telPx.textContent = `${w}×${h}`;
      telPct.textContent = `${pct}%`;

      document.querySelectorAll('#grp-res .btn').forEach(b => {
        b.classList.toggle('active', Number(b.dataset.h) === state.heightP);
      });
      document.querySelectorAll('#grp-aspect .btn').forEach(b => {
        b.classList.toggle('active', b.dataset.aspect === state.aspect);
      });
      document.querySelectorAll('#grp-style .btn').forEach(b => {
        b.classList.toggle('active', b.dataset.style === state.style);
      });
    }

    // 绑定顶部按钮事件
    document.querySelectorAll('#grp-res .btn').forEach(btn => {
      btn.addEventListener('click', () => {
        state.heightP = Number(btn.dataset.h);
        applyCurrentSettings();
        if (state.splitOpen) openSplitCompare();
      });
    });

    document.querySelectorAll('#grp-aspect .btn').forEach(btn => {
      btn.addEventListener('click', () => {
        state.aspect = btn.dataset.aspect;
        applyCurrentSettings();
        if (state.splitOpen) openSplitCompare();
      });
    });

    document.querySelectorAll('#grp-style .btn').forEach(btn => {
      btn.addEventListener('click', () => {
        state.style = btn.dataset.style;
        applyCurrentSettings();
        if (state.splitOpen) syncSplitRightStyle();
      });
    });

    document.querySelectorAll('#grp-cam .btn').forEach(btn => {
      btn.addEventListener('click', async () => {
        const api = getMapApi();
        const preset = CAM_PRESETS[btn.dataset.cam];
        if (!api || !preset) return;
        closeSplitCompare();
        await api.setCameraView(preset.x, preset.z, preset.span, preset.angle);
        applyCurrentSettings();
      });
    });

    // 同镜头左右滑块逐像素对比
    const splitOverlay = document.getElementById('split-overlay');
    const splitLeftImg = document.getElementById('split-left-img');
    const splitRightImg = document.getElementById('split-right-img');
    const splitRightWrap = document.getElementById('split-right-wrap');
    const splitDivider = document.getElementById('split-divider');
    const splitTagLeft = document.getElementById('split-tag-left');
    const splitTagRight = document.getElementById('split-tag-right');
    const btnSplit = document.getElementById('btn-split');

    function syncSplitRightStyle() {
      const isPix = state.style === 'pixelated' || state.style === 'stylized';
      splitRightImg.style.imageRendering = isPix ? 'pixelated' : 'auto';
      splitRightImg.style.filter = state.style === 'stylized'
        ? 'contrast(1.08) saturate(1.10) sepia(0.06)'
        : state.style === 'soft-film'
          ? 'contrast(1.06) saturate(1.08)'
          : 'none';
      splitTagRight.textContent = `右：${state.heightP}p (${RES_TABLE[state.heightP][state.aspect].join('×')}) · ${STYLE_LABELS[state.style]}`;
    }

    function setSplitPosition(pct) {
      state.splitPct = Math.max(4, Math.min(96, pct));
      splitRightWrap.style.clipPath = `inset(0 0 0 ${state.splitPct}%)`;
      splitDivider.style.left = `${state.splitPct}%`;
    }

    function openSplitCompare() {
      const api = getMapApi();
      if (!api || !state.ready) return;
      const [lw, lh] = RES_TABLE[1080][state.aspect];
      const targetH = state.heightP === 1080 ? 680 : state.heightP;
      if (state.heightP === 1080) {
        state.heightP = 680;
        applyCurrentSettings();
      }
      const [rw, rh] = RES_TABLE[targetH][state.aspect];
      const leftUrl = api.captureAtResolution(lw, lh);
      const rightUrl = api.captureAtResolution(rw, rh);
      splitLeftImg.src = leftUrl;
      splitRightImg.src = rightUrl;
      splitTagLeft.textContent = `左：1080p 原画 (${lw}×${lh})`;
      syncSplitRightStyle();
      setSplitPosition(50);
      splitOverlay.classList.add('open');
      state.splitOpen = true;
      btnSplit.classList.add('active');
    }

    function closeSplitCompare() {
      splitOverlay.classList.remove('open');
      state.splitOpen = false;
      btnSplit.classList.remove('active');
    }

    btnSplit.addEventListener('click', () => {
      if (state.splitOpen) closeSplitCompare();
      else openSplitCompare();
    });
    document.getElementById('btn-split-close').addEventListener('click', closeSplitCompare);
    document.getElementById('btn-split-swap-style').addEventListener('click', () => {
      state.style = (state.style === 'pixelated' || state.style === 'stylized') ? 'auto' : 'pixelated';
      applyCurrentSettings();
      syncSplitRightStyle();
    });

    let draggingSplit = false;
    splitDivider.addEventListener('pointerdown', e => {
      draggingSplit = true;
      splitDivider.setPointerCapture(e.pointerId);
    });
    splitOverlay.addEventListener('pointerdown', e => {
      if (e.target.closest('#split-close-bar')) return;
      draggingSplit = true;
      const rect = splitOverlay.getBoundingClientRect();
      setSplitPosition(((e.clientX - rect.left) / rect.width) * 100);
    });
    window.addEventListener('pointermove', e => {
      if (!draggingSplit) return;
      const rect = splitOverlay.getBoundingClientRect();
      setSplitPosition(((e.clientX - rect.left) / rect.width) * 100);
    });
    window.addEventListener('pointerup', () => { draggingSplit = false; });

    // 快捷键 1-5 切分辨率、按住 Space 原地对比 1080p、ESC 关滑块
    function handleKeyDown(e) {
      if (e.code === 'Escape' && state.splitOpen) { closeSplitCompare(); return; }
      const mapKey = { Digit1: 1080, Digit2: 720, Digit3: 680, Digit4: 540, Digit5: 364 };
      if (mapKey[e.code]) {
        state.heightP = mapKey[e.code];
        applyCurrentSettings();
        if (state.splitOpen) openSplitCompare();
      } else if (e.code === 'Space' && !e.repeat && !state.splitOpen) {
        e.preventDefault();
        state.peeking1080 = true;
        applyCurrentSettings();
      }
    }
    function handleKeyUp(e) {
      if (e.code === 'Space' && state.peeking1080) {
        state.peeking1080 = false;
        applyCurrentSettings();
      }
    }
    window.addEventListener('keydown', handleKeyDown);
    window.addEventListener('keyup', handleKeyUp);
    window.addEventListener('resize', layoutAspectFrame);
    layoutAspectFrame();

    // 等待内嵌真实 9km 地图加载至全精度后自动切到 680p 混交林+草地特写并绑定同源键盘透传
    const poll = setInterval(() => {
      const api = getMapApi();
      if (api && api.isFullPrecisionReady && api.isFullPrecisionReady()) {
        clearInterval(poll);
        state.ready = true;
        loadingMask.style.display = 'none';
        try {
          iframe.contentWindow.addEventListener('keydown', handleKeyDown);
          iframe.contentWindow.addEventListener('keyup', handleKeyUp);
        } catch {}
        applyCurrentSettings();
        // 默认切到兼顾树木、建筑、道路与草地的混交林机位，方便一眼对比 680p 观感
        api.setCameraView(12.5, -212.5, 105, 0.25).then(() => applyCurrentSettings());
      }
    }, 180);

    setInterval(() => {
      const api = getMapApi();
      if (!api || !state.ready) return;
      const m = api.getTransitionAndMemoryMetrics();
      if (m) telDc.textContent = String(m.drawCalls);
    }, 600);
  </script>
</body>
</html>
