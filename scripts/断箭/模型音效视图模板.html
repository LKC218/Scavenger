<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>模型与声音分类档案</title><style>
:root{color-scheme:dark;--bg:#141715;--panel:#1c211d;--line:#3b443b;--ink:#ecebdc;--muted:#b6bba9;--accent:#e0ba62;--good:#bad29b;--bad:#e9a38b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 "Bahnschrift","Microsoft YaHei",sans-serif}button,input,select{font:inherit}button,a,input,select{outline-offset:4px}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent)}button{cursor:pointer}a{color:var(--accent)}.masthead{padding:30px 36px 22px;border-top:7px solid var(--accent);border-bottom:1px solid var(--line);background:repeating-linear-gradient(90deg,transparent,transparent 79px,#ffffff05 80px),var(--panel)}.eyebrow{font-size:12px;letter-spacing:.18em;color:var(--accent)}h1{font-weight:500;font-size:clamp(27px,4vw,48px);line-height:1.2;margin:8px 0 14px}h2{font-size:19px;font-weight:500;margin:0 0 12px}.masthead p{margin:0;max-width:940px;color:var(--muted)}.counts{display:flex;gap:30px;margin-top:23px;flex-wrap:wrap}.counts strong{display:block;font-size:28px;font-weight:500;line-height:1.2}.counts span{color:var(--muted);font-size:12px}.toolbar{padding:18px 36px;display:flex;gap:14px;align-items:end;border-bottom:1px solid var(--line);background:#20251f;flex-wrap:wrap}.search{flex:1;min-width:220px}label{display:block;font-size:12px;color:var(--muted)}input,select{display:block;width:100%;border:1px solid #64705e;background:#111711;color:var(--ink);padding:10px 12px;margin-top:4px;border-radius:0}.layout{display:grid;grid-template-columns:190px minmax(350px,1fr) 370px;max-width:1850px;margin:auto;min-height:64vh}nav{padding:22px 16px;border-right:1px solid var(--line)}nav button{background:none;color:var(--muted);border:0;border-left:3px solid transparent;text-align:left;padding:9px 10px;width:100%;display:flex;justify-content:space-between;gap:8px;font-size:14px}nav button:hover{background:#ffffff08}nav button[aria-pressed=true]{background:#363b2e;color:var(--accent);border-left-color:var(--accent)}main{min-width:0}.resultbar{display:flex;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--line);color:var(--muted);font-size:13px}.list{padding-bottom:40px}.track{border:0;border-bottom:1px solid var(--line);color:var(--ink);background:none;width:100%;text-align:left;display:grid;grid-template-columns:38px 1fr 76px;gap:12px;padding:15px 22px;align-items:start}.track:hover{background:#ffffff06}.track[aria-current=true]{background:#31372a;box-shadow:inset 4px 0 var(--accent)}.num{color:#858d7b;font-size:12px;padding-top:3px}.name{display:block;font-weight:500;overflow-wrap:anywhere;line-height:1.4}.meta{display:block;color:var(--muted);font-size:11px;margin-top:6px;overflow-wrap:anywhere}.state{text-align:right;font-size:12px;color:var(--good)}.warn{color:var(--bad)}aside{padding:25px 24px;border-left:1px solid var(--line);background:#1c211c;overflow-wrap:anywhere}.inspector{position:sticky;top:20px}.tag{display:inline-block;border:1px solid #6d755c;color:var(--accent);font-size:11px;padding:2px 8px;margin:0 6px 10px 0}audio{width:100%;margin:18px 0 8px}.hint,.empty{color:var(--muted);font-size:13px}.empty{padding:36px 24px}.facts{margin:22px 0;font-size:13px}.facts dt{color:var(--muted);font-size:11px;margin-top:12px}.facts dd{margin:3px 0;font-family:Consolas,"Microsoft YaHei",monospace;font-size:12px}details{margin-top:20px;border-top:1px solid var(--line);padding-top:13px}summary{cursor:pointer;color:var(--accent)}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:11px;color:var(--muted);max-height:380px;overflow:auto}footer{padding:20px 36px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}.download{display:inline-block;margin:8px 0}.hidden{display:none!important}@media(max-width:1150px){.layout{grid-template-columns:170px minmax(300px,1fr)}aside{grid-column:1/-1;border-left:0;border-top:1px solid var(--line)}.inspector{position:static}.inspector audio{max-width:600px}}@media(max-width:650px){.masthead{padding:23px 19px}.toolbar{padding:14px 18px}.layout{display:block}nav{border-right:0;border-bottom:1px solid var(--line);display:flex;gap:5px;overflow-x:auto;padding:12px}nav button{width:auto;white-space:nowrap;border-left:0;border-bottom:2px solid transparent}nav button[aria-pressed=true]{border-bottom-color:var(--accent);border-left:0}.track{grid-template-columns:25px 1fr 64px;padding:13px 15px;gap:8px}.counts{gap:20px}.toolbar>div{flex:1}.track .name{font-size:13px}aside{padding:22px 18px}footer{padding:20px}.resultbar{padding:12px 16px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}

.modes{display:flex;gap:8px;margin-top:20px;flex-wrap:wrap}.modes button{background:transparent;color:var(--ink);border:1px solid var(--line);padding:9px 18px}.modes button[aria-pressed=true]{background:var(--accent);color:var(--bg);border-color:var(--accent)}.model-controls{display:flex;gap:14px;width:100%;padding-top:12px;border-top:1px solid var(--line)}.model-controls>div:first-child{min-width:120px}.model-controls>div:last-child{flex:1;min-width:200px}.model-summary{padding:18px 22px;border-bottom:1px solid var(--line);background:#252b22}.model-summary h2{margin-bottom:5px}.model-summary p{margin:6px 0}.model-summary details{margin-top:10px}.model-links{display:flex;gap:5px;flex-wrap:wrap;max-height:280px;overflow:auto;margin-top:12px}.model-links button{background:transparent;color:var(--ink);border:1px solid var(--line);padding:6px 9px;text-align:left;font-size:12px}.model-links button:hover{border-color:var(--accent);color:var(--accent)}.association{color:var(--accent)}@media(max-width:650px){.model-controls{flex-wrap:wrap}.model-summary{padding:16px}.model-controls>div{flex:1}.layout nav{align-items:stretch}.modes button{flex:1;padding:8px 10px}}
</style></head><body>
<header class="masthead"><div class="eyebrow">模型与声音 · 分类浏览候选</div><h1>从载具，找到它的声音。</h1><p>已确认关系覆盖当前美军模型库的选用配置。全部声音仍可按用途浏览，未关联事件单列保留；关联状态与音频技术状态分别展示。</p><div class="counts" id="counts"></div><div class="modes" id="modes" aria-label="浏览方式"><button type="button" data-mode="purpose" aria-pressed="true">按声音用途</button><button type="button" data-mode="model" aria-pressed="false">按模型查找</button><button type="button" data-mode="unassigned" aria-pressed="false">未关联声音</button></div></header>
<section class="toolbar" aria-label="检索条件"><div class="search"><label for="search">搜索型号、名称、事件、路径、bank或GUID</label><input id="search" type="search" placeholder="例如 A-10、M1A2、Rotor、120mm" autocomplete="off"></div><div><label for="status">音频技术状态</label><select id="status"><option value="all">全部状态</option><option value="ready">技术通过</option><option value="review">待复核</option><option value="failed">提取失败</option></select></div><div><label for="operation">音频来源</label><select id="operation"><option value="all">全部来源</option><option value="reused">复用原库</option><option value="rendered">007新增渲染</option></select></div><div id="model-controls" class="model-controls hidden"><div><label for="model-group">模型分类</label><select id="model-group"><option value="all">全部模型</option><option value="air">空中</option><option value="ground">地面</option></select></div><div><label for="model">选择型号（含暂无声音入口）</label><select id="model"></select></div></div></section>
<div class="layout"><nav id="categories" aria-label="音效用途"></nav><main><section id="model-summary" class="model-summary" aria-live="polite"></section><div class="resultbar"><span id="result" role="status" aria-live="polite"></span><a href="模型分类清单.csv" download>型号清单</a></div><div class="list" id="tracks"></div></main><aside><div class="inspector"><div id="detail"></div><audio id="player" controls preload="none" aria-label="当前选中音效"></audio><p id="media-status" class="hint">选择条目后，点击播放器试听。默认不自动播放。</p><label><input id="loop" type="checkbox" style="display:inline;width:auto;margin-right:8px">主动循环片段（不代表无缝循环）</label><p class="hint">共享声音只引用一份既有WAV。当前页面依赖相邻007批次的音频，请保留相对目录位置。</p></div></aside></div><footer id="footer"></footer>
<script id="catalog" type="application/json">__CATALOG__</script><script>
'use strict';
const catalog=JSON.parse(document.getElementById('catalog').textContent);
const el=id=>document.getElementById(id),player=el('player');
const models=new Map(catalog.models.map(model=>[model.id,model]));
const escape=value=>String(value??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const stateText={ready:'技术通过',review:'待复核',failed:'提取失败'};
let category='all',selected=null,mode='purpose';
player.volume=0.35;
el('counts').innerHTML=[['声音事件',catalog.summary.events],['模型入口',catalog.summary.models],['有已确认声音的模型',catalog.summary.models_with_audio],['未关联声音',catalog.summary.unassigned_events]].map(([label,value])=>`<div><strong>${value}</strong><span>${label}</span></div>`).join('');
el('footer').innerHTML=`批次 ${escape(catalog.batch)} · 当前美军模型入口，不覆盖其他阵营模型 · 候选视图，不替换正式V1。<br><a href="模型声音关联.csv" download>下载模型声音关联</a> · <a href="引用复核.json" download>完整引用与缺项依据</a> · <a href="模型音效目录.json" download>目录JSON</a>`;
function availableModels(){return catalog.models.filter(model=>el('model-group').value==='all'||model.category===el('model-group').value);}
function populateModels(){const previous=el('model').value;el('model').innerHTML='<option value="all">全部已关联声音</option>'+availableModels().map(model=>`<option value="${escape(model.id)}">${escape(model.name)} · ${escape(model.id)} · ${model.event_guids.length}项</option>`).join('');el('model').value=availableModels().some(model=>model.id===previous)?previous:'all';}
function scopeRows(){if(mode==='unassigned')return catalog.events.filter(row=>row.association_status==='unassigned');if(mode==='model'){const id=el('model').value,group=el('model-group').value;return catalog.events.filter(row=>row.model_ids.some(modelId=>(id==='all'||modelId===id)&&(group==='all'||models.get(modelId).category===group)));}return catalog.events;}
function filtered(){const query=el('search').value.trim().toLowerCase();return scopeRows().filter(row=>(category==='all'||row.category===category)&&(el('status').value==='all'||row.status===el('status').value)&&(el('operation').value==='all'||row.operation===el('operation').value)&&[row.name,row.path,row.guid,...row.banks,...row.model_ids.flatMap(id=>[id,models.get(id).name])].join(' ').toLowerCase().includes(query));}
function renderCategories(){const rows=scopeRows();el('categories').innerHTML=[['all','全部用途'],...catalog.categories.map(name=>[name,name])].map(([id,label])=>`<button type="button" data-category="${escape(id)}" aria-pressed="${category===id}"><span>${escape(label)}</span><span>${rows.filter(row=>id==='all'||row.category===id).length}</span></button>`).join('');}
function renderSummary(){if(mode==='model'){const model=models.get(el('model').value);if(model){const counts=model.reference_counts;el('model-summary').innerHTML=`<h2>${escape(model.name)}</h2><p class="hint">${escape(model.id)} · ${model.category==='air'?'空中':'地面'} · ${escape(model.variant)} · 模型${model.model_status==='passed'?'通过':'待修参考'}</p><p>${model.event_guids.length?`已确认 ${model.event_guids.length} 项声音，${counts.confirmed||0} 条引用。`:'暂无已确认声音：保留入口，不按相似型号套用。'}</p><details><summary>当前配置的字段与缺项</summary><p class="hint">空字段 ${counts.empty_field||0} · 未索引引用 ${counts.event_not_indexed||0} · 无当前单位关联 ${counts.unresolved||0}。空字段不是提取失败，未索引引用不视为已恢复。</p><p class="hint">这里只展示当前选用配置，不能推导全部改装声音已覆盖。</p></details>`;}else{el('model-summary').innerHTML=`<h2>按模型查找</h2><p class="hint">上方可选择${availableModels().length}个模型入口，含暂无声音的入口。共享声音在列表中只出现一次。</p>`;}}else if(mode==='unassigned'){el('model-summary').innerHTML='<h2>未关联声音</h2><p class="hint">149项事件尚无本轮模型库的确证关系。未关联不代表没有可用声音，也不代表其他载具不会使用。</p>';}else{el('model-summary').innerHTML='<h2>全部声音用途</h2><p class="hint">250项事件全部保留。已确认101项与当前模型有关联；149项尚未关联。技术通过247项，静音待复核3项。</p>';}}
function clearSelection(){selected=null;player.pause();player.loop=false;el('loop').checked=false;player.removeAttribute('src');player.load();player.classList.add('hidden');}
function setMode(value){mode=value;category='all';el('model-group').value='all';el('model').value='all';el('model-controls').classList[mode==='model'?'remove':'add']('hidden');el('modes').innerHTML=[['purpose','按声音用途'],['model','按模型查找'],['unassigned','未关联声音']].map(([id,label])=>`<button type="button" data-mode="${id}" aria-pressed="${mode===id}">${label}</button>`).join('');populateModels();clearSelection();renderSummary();renderCategories();renderRows();}
function openModel(id){setMode('model');el('search').value='';el('status').value=el('operation').value='all';el('model').value=id;clearSelection();renderSummary();renderCategories();renderRows();}
function selectEvent(id){const row=filtered().find(row=>row.guid===id);if(!row)return;selected=id;player.pause();player.loop=false;el('loop').checked=false;const links=row.model_ids.map(id=>{const fields=[...new Set(row.bindings.filter(binding=>binding.model_id===id).map(binding=>binding.field))];return `<button type="button" data-model="${escape(id)}">${escape(models.get(id).name)}<br>${escape(id)} · ${fields.map(escape).join(' / ')}</button>`;}).join('');el('detail').innerHTML=`<span class="tag">${escape(row.category)}</span><span class="tag">${row.association_status==='confirmed'?'关联已确认':'尚未关联模型'}</span><h2>${escape(row.name)}</h2><p class="${row.status==='ready'?'hint':'warn'}">音频：${stateText[row.status]}${row.issue?' · '+escape(row.issue):''}</p><details${row.model_ids.length?'':' open'}><summary>已确认使用型号（${row.model_ids.length}）</summary><div class="model-links">${links||'<p class="hint">暂无本轮模型的确证关系。</p>'}</div></details><dl class="facts"><dt>事件路径</dt><dd>${escape(row.path)}</dd><dt>来源bank</dt><dd>${row.banks.map(escape).join('<br>')}</dd><dt>事件GUID</dt><dd>${escape(row.guid)}</dd><dt>声音格式与时长</dt><dd>${row.check.sample_rate}Hz · ${row.check.channels}声道 · PCM16 · ${row.check.duration_seconds.toFixed(2)}秒</dd><dt>循环 / 听审</dt><dd>循环点未知 · 逐事件待听审</dd></dl><a class="download" href="${escape(row.audio_path)}" download>打开或下载WAV</a><details><summary>来源、参数与摘要</summary><pre>${escape(JSON.stringify({来源:row.source,原声音批次:catalog.source_batch,渲染:row.render_profile,技术检查:row.check,关联引用:row.bindings},null,2))}</pre></details>`;player.src=row.audio_path;player.classList.remove('hidden');el('media-status').textContent='已选择，点击播放器试听。';player.load();renderRows(false);}
function renderRows(choose=true){const rows=filtered();el('result').textContent=`显示 ${rows.length} / ${scopeRows().length} 个事件 · 全库 ${catalog.events.length} 项`;el('tracks').innerHTML=rows.map((row,index)=>`<button class="track" type="button" data-event="${escape(row.guid)}" aria-current="${row.guid===selected}"><span class="num">${String(index+1).padStart(3,'0')}</span><span><span class="name">${escape(row.name)}</span><span class="meta">${escape(row.category)} · <span class="association">${row.model_ids.length?'关联 '+row.model_ids.length+' 个模型':'尚未关联模型'}</span></span></span><span class="state ${row.status==='ready'?'':'warn'}">${stateText[row.status]}<br>${row.check.duration_seconds.toFixed(1)}秒</span></button>`).join('')||'<p class="empty">当前条件下没有已确认声音，请查看型号说明或调整筛选。</p>';if(choose){if(rows.length&&!rows.some(row=>row.guid===selected))selectEvent(rows[0].guid);if(!rows.length){clearSelection();el('detail').innerHTML='<h2>当前无声音条目</h2><p class="hint">无关联型号不会自动套用其他声音。</p>';el('media-status').textContent='当前没有选中的声音。';}}}
el('modes').addEventListener('click',event=>{const button=event.target.closest('button[data-mode]');if(button)setMode(button.dataset.mode);});
el('model-group').addEventListener('change',()=>{el('model').value='all';populateModels();category='all';clearSelection();renderSummary();renderCategories();renderRows();});
el('model').addEventListener('change',()=>{category='all';clearSelection();renderSummary();renderCategories();renderRows();});
el('categories').addEventListener('click',event=>{const button=event.target.closest('button[data-category]');if(button){category=button.dataset.category;renderCategories();renderRows();}});
el('tracks').addEventListener('click',event=>{const button=event.target.closest('button[data-event]');if(button)selectEvent(button.dataset.event);});
el('detail').addEventListener('click',event=>{const button=event.target.closest('button[data-model]');if(button)openModel(button.dataset.model);});
el('search').addEventListener('input',()=>renderRows());for(const id of ['status','operation'])el(id).addEventListener('change',()=>renderRows());
el('loop').addEventListener('change',()=>{player.loop=el('loop').checked;});
for(const [name,label] of [['loadedmetadata','媒体信息已加载，可点击播放。'],['playing','正在播放。'],['pause','已暂停。'],['ended','播放结束。'],['error','媒体加载失败，请保留008页面与007声音目录的相对位置。']])player.addEventListener(name,()=>{el('media-status').textContent=label;});
document.addEventListener('visibilitychange',()=>{if(document.hidden)player.pause();});window.addEventListener('pagehide',()=>player.pause());
populateModels();renderSummary();renderCategories();renderRows();
</script></body></html>
